id: frontend-derived-stale-reference-recovery
version: v004
ecosystem: frontend
parent: frontend-derived-v003-consolidated
fine_tune_run: run-0012
behavior_shapes:
  - stateful_ui
  - conditional_flow
  - data_dashboard_layout
compatible_rubric_snapshots:
  - v002
steps:
  - id: explore
    name: Explore structure, dependencies, and state-machine boundaries
    prompt: prompts/generator.md
    outputs:
      - trace
      - exploration_notes
      - state_machine_boundaries
      - verified_references
      - unresolved_references
  - id: analyze
    name: Analyze discovered behavior
    prompt: >
      Analyze the explored code to produce a predicate inventory for conditional
      flows. For each conditional flow discovered: - List each gate predicate
      separately (e.g. agreement-state, progress-percentage, auth-session) -
      Label the render mode as exactly one of: hidden, visible-disabled,
      visible-enabled - Mark the relation to the golden wording as: exact,
      partial, or mismatch - Preserve agreement-state gating and
      hidden-vs-disabled differences instead of collapsing
        them into the nearest live behavior
      - Flag partial matches with explicit notes about what code evidence
      supports vs what
        the golden wording requires
    outputs:
      - behavior_map
      - predicate_inventory
  - id: draft
    name: Draft specs with explicit states, transitions, guards, and side effects
    outputs:
      - spec_set
      - state_transition_map
  - id: verify
    name: Verify schema and reference consistency
    outputs:
      - verification_report
  - id: cross_ref
    name: Link related specs and evidence
    outputs:
      - reference_map
validations:
  - schema_valid
  - references_resolve
  - no_internal_contradictions
mutation_tiers:
  - prompt_tweak
  - step_management
  - parent_guideline
  - schema_change
  - tool_change
  - rubric_mutation
specializations:
  - component_state_tracking
  - conditional_rendering_checks
  - accessibility_review
  - data_table_behavior
  - state_machine_boundary_detection
  - explicit_state_transition_enumeration
  - conditional_predicate_inventory
  - stale_reference_recovery
status: candidate
discovered_in_run: run-0012
mutation_source:
  run_id: run-0012
  analyzer_failure_type: search_failure
  proposed_change_type: step_management
  target_step: explore
  rationale: >
    Add reference_validation sub-step to explore with ecosystem_recovery
    heuristics and proceed_gate. Added verified_references and
    unresolved_references outputs. Eliminates recall misses caused by stale file
    paths in golden-set evidence_refs.
created_at: 2026-04-22T20:30:00.000Z
