'id': 'frontend-derived-v005-run-0022'
'version': 'v005'
'ecosystem': 'frontend'
'extends': 'formulas/seed/frontend.yaml'
'parent': 'frontend-derived-v004'
'fine_tune_run': null
'execution':
  'orchestrator_version': 'v2'
  'agent_provider': 'opencode'
  'max_step_retries': 3
'steps':
  - 'id': 'explore'
    'name': 'Explore codebase structure and behavioral surfaces'
    'agent': 'codebase-explorer'
    'tools':
      - 'glob'
      - 'grep'
      - 'read'
    'max_tokens': 12000
    'prompt': "Explore the codebase at {{project.codebase_path}}.


      Focus on these behavioral shapes: {{project.behavior_shapes}}


      Your task has TWO phases:


      PHASE 1: File Discovery and Broad Behavior Identification

      1. List ALL source files (file_tree)

      2. Identify potential behavioral areas (auth, state, UI, API, etc.)

      3. For each area, list evidence files that contain the behavior

      4. Flag files that are clearly infrastructure vs business logic


      PHASE 2: Conditional Flow Discovery (MANDATORY)

      After completing Phase 1, you MUST read key files to discover specific conditional flows.

      This phase is NOT optional. You must produce conditional_flows_discovered.


      For each behavioral area identified in Phase 1, read the most relevant files and look for:

      1. Route guard patterns: if/then/else logic in routing files, middleware, or layout components

      2. Gate contracts: files that control flow based on state (e.g., auth guards, TOA contracts)

      3. Conditional rendering: components that show/hide/disable elements based on state

      4. Form submission guards: validation or blocking logic before form submission


      For each conditional flow found, record:

      - id: unique identifier (kebab-case)

      - description: what the flow does

      - guard_conditions: the conditions that control the flow (e.g., \"user.isAuthenticated\", \"report.progress >= download_stage\")

      - render_mode: how the UI responds (hidden, visible-disabled, visible-enabled, redirect, defer)

      - evidence_refs: specific file paths and line ranges showing the flow


      Output as YAML:

      file_tree: []

      behavior_candidates:

      \  - id: string

      \    description: string

      \    evidence_refs: []

      \    confidence: 0.0-1.0

      conditional_flows_discovered:

      \  - id: string

      \    description: string

      \    guard_conditions: []

      \    render_mode: string

      \    evidence_refs: []\n"
    'outputs':
      'file_tree':
        'type': 'array'
        'items':
          'type': 'string'
      'behavior_candidates':
        'type': 'array'
        'items':
          'type': 'object'
          'properties':
            'id':
              'type': 'string'
            'description':
              'type': 'string'
            'evidence_refs':
              'type': 'array'
              'items':
                'type': 'string'
            'confidence':
              'type': 'number'
          'required':
            - 'id'
            - 'description'
            - 'evidence_refs'
      'conditional_flows_discovered':
        'type': 'array'
        'items':
          'type': 'object'
          'properties':
            'id':
              'type': 'string'
            'description':
              'type': 'string'
            'guard_conditions':
              'type': 'array'
              'items':
                'type': 'string'
            'render_mode':
              'type': 'string'
            'evidence_refs':
              'type': 'array'
              'items':
                'type': 'string'
          'required':
            - 'id'
            - 'description'
            - 'guard_conditions'
            - 'render_mode'
            - 'evidence_refs'
  - 'id': 'analyze'
    'name': 'Analyze discovered behaviors for spec-worthiness'
    'agent': 'behavior-analyzer'
    'tools':
      - 'read'
    'max_tokens': 12000
    'prompt': "Analyze these behavior candidates from the exploration step:

      {{prior_outputs.explore.behavior_candidates}}


      And these conditional flows discovered:

      {{prior_outputs.explore.conditional_flows_discovered}}


      Your task:

      1. Filter behavior_candidates to those with high confidence (>0.6)

      2. For conditional flows, produce a predicate_inventory:

      \   - List each gate predicate separately

      \   - Label render mode: hidden, visible-disabled, visible-enabled

      \   - Note: this is LIVE CODE analysis, not golden-set matching

      3. For each conditional flow, extract the specific predicates and render modes

      4. Flag behaviors that need deeper exploration


      Output as YAML:

      predicate_inventory: []

      behaviors_to_spec: []

      needs_deeper_exploration: []\n"
    'outputs':
      'predicate_inventory':
        'type': 'array'
        'items':
          'type': 'object'
          'properties':
            'behavior_id':
              'type': 'string'
            'predicates':
              'type': 'array'
              'items':
                'type': 'string'
            'render_mode':
              'type': 'string'
              'enum':
                - 'hidden'
                - 'visible-disabled'
                - 'visible-enabled'
      'behaviors_to_spec':
        'type': 'array'
        'items':
          'type': 'string'
      'needs_deeper_exploration':
        'type': 'array'
        'items':
          'type': 'string'
  - 'id': 'draft'
    'name': 'Draft behavioral specs'
    'agent': 'spec-writer'
    'tools':
      - 'read'
      - 'write'
    'max_tokens': 16000
    'prompt': 'Draft specs for these behaviors:

      {{prior_outputs.analyze.behaviors_to_spec}}


      Predicate inventory:

      {{prior_outputs.analyze.predicate_inventory}}


      Use schema: schemas/spec.schema.yaml

      Write specs to: runs/{{run_id}}/generator/specs/


      Each spec must include:

      - id, type, version

      - behaviors[] with evidence_refs

      - state_transitions where applicable

      - confidence score


      Output as YAML:

      spec_files: []

      summary: string

      '
    'outputs':
      'spec_files':
        'type': 'array'
        'items':
          'type': 'string'
      'summary':
        'type': 'string'
  - 'id': 'verify'
    'name': 'Verify specs against schema'
    'agent': null
    'tool': 'schema-validator'
    'inputs':
      'specs_dir': 'runs/{{run_id}}/generator/specs/'
      'schema': 'schemas/spec.schema.yaml'
    'prompt': 'Validate all specs in runs/{{run_id}}/generator/specs/ against schemas/spec.schema.yaml.

      '
    'outputs':
      'validation_report':
        'type': 'object'
        'properties':
          'valid_specs':
            'type': 'array'
            'items':
              'type': 'string'
          'invalid_specs':
            'type': 'array'
            'items':
              'type': 'object'
              'properties':
                'file':
                  'type': 'string'
                'errors':
                  'type': 'array'
                  'items':
                    'type': 'string'
          'all_valid':
            'type': 'boolean'
'validations':
  - 'schema_valid'
  - 'references_resolve'
'evaluation':
  'recall':
    'weight': 0.4
    'description': 'Coverage of known golden behaviors'
  'precision':
    'mechanical':
      'weight': 0.7
      'checks':
        - 'id': 'behavior_exists'
          'description': 'Every behavior claimed in spec exists in code'
        - 'id': 'evidence_ref_valid'
          'description': 'Every evidence_ref points to a file containing the behavior'
    'agent':
      'weight': 0.3
      'prompt': 'Review these specs for business logic hallucinations that AST extraction might miss.'
      'agent': 'spec-reviewer'
  'discovery':
    'weight': 0.3
    'description': 'New behaviors found that aren''t in golden set'
    'criteria':
      - 'behavior_must_have_evidence_refs'
      - 'behavior_must_have_state_machine_or_conditions'
      - 'behavior_must_not_be_duplicate_of_existing'
'mutation_tiers':
  - 'prompt_tweak'
  - 'step_management'
  - 'parent_guideline'
  - 'schema_change'
  - 'tool_change'
  - 'rubric_mutation'
'specializations':
  - 'component_state_tracking'
  - 'conditional_rendering_checks'
  - 'accessibility_review'
  - 'data_table_behavior'
'status': 'candidate'
'discovered_in_run': 'run-0022'
'created_at': '2026-04-30T00:00:00Z'
'governance_notes': 'v005: Added conditional-flow-discovery phase to explore step to address recognition_failure. The explore step now has two phases: file discovery and conditional flow discovery.'
'mutation_record':
  'run_id': 'run-0022'
  'mutation_type': 'step_management'
  'target_step': 'explore'
  'rationale': 'The formula discovered broad behavior areas (auth_flow, stateful_ui) with high confidence but failed to identify the specific conditional flows and state-dependent visibility patterns that the golden set expects. The explore step listed files and created coarse-grained behavior candidates without deep-diving into route files, gate contracts, or component visibility logic. This mutation adds a mandatory conditional-flow-discovery phase that reads key files and extracts specific conditional flows with guard_conditions and render_modes.'
  'previous_lesson': 'recognition_failure x verification_crosscheck = PASSED (different teaching method)'
  'anti_contamination_check': 'This mutation improves the exploration METHOD (adding a conditional-flow-discovery phase), not specific targets. It does not encode specific behavioral findings from past runs.'
