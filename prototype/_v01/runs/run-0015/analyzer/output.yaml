confidence: 0.78
confidence_rationale: >
  Moderate-high confidence in recognition_failure for miss 1: the formula
  explicitly mentions "agreement-state gating" in the analyze step prompt,
  yet the generator only applied it in the report-creation context
  (toa-gated-report-creation achieved 1.0 recall) and missed it in the
  project-editing context. This is a clear context-collapse signal. Moderate
  confidence in search_failure for miss 2: ReportActions.tsx is absent from
  all spec evidence_refs, strongly suggesting the explore step never found
  it. However, we lack the explore step's raw file list to confirm
  definitively — there is a small chance the file was found but completely
  ignored (which would reclassify as recognition_failure). Deducted 0.22
  from maximum confidence because: (1) the explore step's file list is not
  available to confirm search_failure definitively, (2) the two misses have
  different failure types which complicates a single primary classification,
  (3) the pdf.lifecycle precision finding (pdfLifecycle.js not imported by
  PdfGenerationOverlay.tsx) suggests possible architectural drift that could
  affect diagnosis accuracy, (4) the precision finding on
  auth.toa-gated-report-creation (calculator-side documented from
  prior_context, not source files) indicates the one successful recall hit
  may be partially inflated.

