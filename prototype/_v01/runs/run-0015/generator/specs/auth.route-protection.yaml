confidence: 0.88
confidence_rationale: >
  All three discovered behaviors are fully evidenced across 5 source files with
  direct code snippets. Route protection logic confirmed in authGuard.js (pure
  function with normalizeSession, isProtectedRoute, allow/redirect decisions).
  Auth redirect hook confirmed in useAuthRedirect.ts (token check, refresh attempt,
  redirect on failure, minLoadingDelay). Dashboard layout protection confirmed in
  layout.tsx (AuthGuard wraps all dashboard routes). Root page routing confirmed in
  entryContracts.js (resolveRootHomeRedirect with authenticated/anonymous/parse-failure
  branches). Deducted 0.12 because: (1) the actual login API response shape is not
  visible (getToken() returns from authMemorySession.js which is in another spec),
  (2) the AuthSyncBootstrap cross-tab listener initialization is in another spec,
  (3) the exact behavior of withBasePath() for sub-path routing is not in these files,
  (4) the default protected paths list only includes /companies but /reports protection
  is mentioned in prior_context without code evidence in these files.

unresolved_questions:
  - "Is /reports also a protected route? The prior_context mentions it but DEFAULT_PROTECTED_PATHS in authGuard.js only includes /companies. The /reports protection may be handled elsewhere or may be missing."
  - "What does withBasePath() do? useAuthRedirect calls withBasePath(redirectTo) but the implementation is in shared/lib/routing/basePath.ts which is not in scope."
  - "How does AuthSyncBootstrap interact with route protection? It's rendered after auth check but its cross-tab logout listener may trigger additional redirects not captured here."
  - "What happens if the refresh token cookie is expired? The useAuthRedirect hook calls refreshAccessToken() but the actual HTTP call and cookie validation are in tokenRefresher.js (covered by session-management spec)."
  - "Does the minLoadingDelay apply on error paths? The finally block runs after catch, so the delay would apply even on auth check errors."

status: complete
