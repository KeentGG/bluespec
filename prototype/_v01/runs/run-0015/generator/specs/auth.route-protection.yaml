      export function resolveRootHomeRedirect(options = {}) {
        const {
          token = null,
          tokenParseFailed = false,
          query = null,
          companiesRoute = COMPANIES_ROUTE,
          externalToolsUrl = EXTERNAL_TOOLS_URL,
        } = options;

        const normalizedCompaniesDestination = normalizeInAppRoute(companiesRoute, COMPANIES_ROUTE);
        const companiesDestination = withSupportedCreateQuery(normalizedCompaniesDestination, query);
        const externalDestination = normalizeExternalToolsUrl(externalToolsUrl);

        if (tokenParseFailed) {
          return {
            destination: externalDestination,
            isExternal: true,
            reason: "token_parse_failed",
          };
        }

        if (hasAuthToken(token)) {
          return {
            destination: companiesDestination,
            isExternal: false,
            reason: "authenticated_companies_redirect",
          };
        }

        return {
          destination: externalDestination,
          isExternal: true,
          reason: "anonymous_external_redirect",
        };
      }
    covers:
