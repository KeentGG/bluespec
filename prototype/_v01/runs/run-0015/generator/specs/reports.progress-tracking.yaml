confidence: 0.92
confidence_rationale: >
  All behavior is fully contained in a single 367-line pure-function module with
  no external dependencies beyond CALCULATOR_IDS constant and normalizeString utility.
  Every code path is visible: four calculator-specific resolvers with explicit
  route-to-percentage mappings, input normalization with type coercion, structured
  success/failure return format, and step-based linear formulas for multi-page
  routes. The only uncertainties (0.08 deducted) are: (1) the CALCULATOR_IDS
  constant values are imported from another module and not visible here — assumed
  to be string IDs "VE", "DE", "VGA", "NP" based on usage patterns, (2) the
  normalizeString utility behavior is not visible — assumed to trim and lowercase,
  (3) callers of this module are not visible — unknown which components consume
  the progress percentage, (4) whether CALCULATOR_IDS values are exactly the
  strings used in comparisons or could be numeric — the normalizeCalculatorId
  function handles both cases suggesting they might be numeric in some contexts.

unresolved_questions:
  - "What are the exact values of CALCULATOR_IDS imported from @/shared/constants/calculators? Are they strings ('VE') or numbers?"
  - "What does normalizeOptionalString (aliased as normalizeString) do exactly? Does it trim, lowercase, or handle other transformations?"
  - "Which components or pages call resolveCalculatorAwareProgressPercentage()? Is it used in the reports table component or elsewhere?"
  - "Are there any routes not covered by the current mapping that could be passed in, and how should they be handled (return null vs default percentage)?"
  - "Is the progress percentage used for anything beyond display (e.g., gating completion, analytics tracking)?"

status: complete
