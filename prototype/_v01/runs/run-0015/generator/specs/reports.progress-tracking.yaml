id: reports.progress-tracking
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: calculator-progress-mapping
    coverage: full
    notes: >
      Fully documented. Each calculator type (VE, DE, VGA, NP) has a dedicated
      progress resolution function that maps normalized route strings to percentage
      values. VE uses step-based formula for questionnaire routes (5 + (step-1)*5)
      plus fixed milestones. DE uses step-based for company-information (5 + (step-1)*8)
      plus fixed milestones. VGA uses step-based (5 + (step-1)*7) plus fixed milestones.
      NP uses step-based (5 + (step-1)*7) plus fixed milestones. All calculators
      recognize optional-questions as 100% complete. Route normalization handles
      double slashes, trailing slashes, and leading slash enforcement.
  - id: progress-percentage-calculation
    coverage: full
    notes: >
      Fully documented. resolveCalculatorAwareProgressPercentage() is the public
      entry point. It validates and normalizes inputs (calculatorId, reportProgress
      route), dispatches to the appropriate calculator-specific resolver, and returns
      a structured success/failure result. Four failure modes exist: invalid_payload,
      invalid_calculator_id, missing_report_progress, unknown_progress. Success
      returns progressPercentage as an integer 0-100.

description: >
  Maps calculator-specific routes to progress percentages for display in the
  dashboard reports table. Each calculator type (VE, DE, VGA, NP) has its own
  progress resolution logic with unique route-to-percentage mappings. The module
  exports resolveCalculatorAwareProgressPercentage() which accepts a calculatorId
  and reportProgress route, normalizes both inputs, dispatches to the correct
  calculator resolver, and returns a structured result with the progress percentage.
  Progress percentages are approximate integers (0-100) designed for UI display only.
  Step-based routes (questionnaire, company-information) use linear formulas; all
  other routes map to fixed percentage milestones.

state_machine: null

conditions:
  - id: valid-payload-check
    description: >
      The input options must be a non-null, non-array object. Non-object inputs
      (null, undefined, arrays, primitives) cause immediate failure with
      invalid_payload reason.
    trigger: resolveCalculatorAwareProgressPercentage() is called
    guards:
      - field: options
        condition: >
          typeof options === "object" AND options !== null AND NOT Array.isArray(options)
    then:
      - Extract calculatorId and reportProgress from options or nested report object
    else:
      - Return failure with action "progress_percentage", reason "invalid_payload"

  - id: valid-calculator-id
    description: >
      The calculatorId must be one of the four known calculator IDs (VE, DE, VGA, NP).
      Numeric values are truncated and stringified before validation. Unknown IDs
      cause failure with invalid_calculator_id reason.
    trigger: calculatorId is extracted from input
    guards:
      - field: calculatorId
        condition: >
          After normalization (number truncation + string conversion + trim),
          value must exist in VALID_CALCULATOR_ID_SET (VE, DE, VGA, NP)
    then:
      - Proceed to route normalization
    else:
      - Return failure with action "progress_percentage", reason "invalid_calculator_id"

  - id: valid-report-progress-route
    description: >
      The reportProgress route must be a non-empty string starting with "/".
      Double slashes are collapsed, trailing slashes stripped. Empty or missing
      routes cause failure with missing_report_progress reason.
    trigger: reportProgress is extracted from input
    guards:
      - field: reportProgress
        condition: >
          After normalization: non-empty string, starts with "/", double slashes
          collapsed, trailing slashes stripped (except root "/")
    then:
      - Dispatch to calculator-specific progress resolver
    else:
      - Return failure with action "progress_percentage", reason "missing_report_progress"

  - id: recognized-route-for-calculator
    description: >
      The normalized route must be recognized by the calculator-specific resolver.
      Each calculator has a fixed set of known routes and step-based patterns.
      Unrecognized routes cause failure with unknown_progress reason.
    trigger: Calculator-specific resolver is invoked with normalized route
    guards:
      - field: route
        condition: >
          Route matches a known fixed path OR matches a step-based regex pattern
          for the given calculator type
    then:
      - Return success with resolved progressPercentage
    else:
      - Return failure with action "progress_percentage", reason "unknown_progress"

  - id: ve-step-calculation
    description: >
      VE calculator uses linear step formula for questionnaire routes:
      progress = 5 + (step - 1) * 5, clamped to 0-100. Step 1 = 5%, step 5 = 25%,
      step 10 = 50%.
    trigger: VE resolver receives a route matching /questionnaire/N
    guards:
      - field: route
        condition: Matches regex /^\/questionnaire\/(\d+)(?:\/|$)/
    then:
      - Calculate percentage as 5 + (stepNumber - 1) * 5, clamped to 0-100
    else:
      - Check fixed VE milestones

  - id: de-step-calculation
    description: >
      DE calculator uses linear step formula for company-information routes:
      progress = 5 + (step - 1) * 8, clamped to 0-100. Step 1 = 5%, step 7 = 53%.
    trigger: DE resolver receives a route matching /company-information/N
    guards:
      - field: route
        condition: Matches regex /^\/company-information\/(\d+)(?:\/|$)/
    then:
      - Calculate percentage as 5 + (stepNumber - 1) * 8, clamped to 0-100
    else:
      - Check fixed DE milestones

  - id: vga-step-calculation
    description: >
      VGA calculator uses linear step formula for company-information routes:
      progress = 5 + (step - 1) * 7, clamped to 0-100. Step 1 = 5%, step 14 = 91%.
    trigger: VGA resolver receives a route matching /company-information/N
    guards:
      - field: route
        condition: Matches regex /^\/company-information\/(\d+)(?:\/|$)/
    then:
      - Calculate percentage as 5 + (stepNumber - 1) * 7, clamped to 0-100
    else:
      - Check fixed VGA milestones

  - id: np-step-calculation
    description: >
      NP calculator uses linear step formula for company-information routes:
      progress = 5 + (step - 1) * 7, clamped to 0-100. Step 1 = 5%, step 14 = 91%.
    trigger: NP resolver receives a route matching /company-information/N
    guards:
      - field: route
        condition: Matches regex /^\/company-information\/(\d+)(?:\/|$)/
    then:
      - Calculate percentage as 5 + (stepNumber - 1) * 7, clamped to 0-100
    else:
      - Check fixed NP milestones

  - id: optional-questions-completion
    description: >
      All four calculators treat any route containing "optional-questions" as
      100% complete. This is checked via route.includes("optional-questions")
      before most fixed milestone checks.
    trigger: Any calculator resolver receives a route
    guards:
      - field: route
        condition: route.includes("optional-questions")
    then:
      - Return 100%
    else:
      - Continue to other milestone checks

inputs:
  - id: calculatorId
    type: "string or number"
    source: "caller argument to resolveCalculatorAwareProgressPercentage()"
    required: true
    validation:
      type_coercion: >
        Numbers are truncated via Math.trunc() and stringified. Non-finite
        numbers (NaN, Infinity) are rejected.
      normalization: >
        Passed through normalizeOptionalString utility. Must be one of:
        VE, DE, VGA, NP (from CALCULATOR_IDS constant).
      fallback: >
        Can also be extracted from options.report.calculatorId if not
        directly provided.

  - id: reportProgress
    type: "string route path"
    source: "caller argument to resolveCalculatorAwareProgressPercentage()"
    required: true
    validation:
      format: "Must start with /"
      normalization: >
        Passed through normalizeOptionalString utility. Double slashes
        collapsed to single. Trailing slashes stripped (except root "/").
      fallback: >
        Can also be extracted from options.report.reportProgress if not
        directly provided.

outputs:
  - id: progress_result_success
    type: "object { ok: true, action, reason, progressPercentage, calculatorId, reportProgress }"
    destination: "returned by resolveCalculatorAwareProgressPercentage()"
    lifespan: "immediate (no side effects, pure function)"
  - id: progress_result_failure
    type: "object { ok: false, action, reason, progressPercentage: 0, calculatorId, reportProgress }"
    destination: "returned by resolveCalculatorAwareProgressPercentage()"
    lifespan: "immediate (no side effects, pure function)"

evidence_refs:
  - path: src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      export function resolveCalculatorAwareProgressPercentage(options = {}) {
        const input = resolveReportProgressInput(options);
        if (!input) {
          return createFailure("progress_percentage", "invalid_payload", {
            progressPercentage: 0,
            calculatorId: null,
            reportProgress: null,
          });
        }

        const calculatorId = normalizeCalculatorId(input.calculatorId);
        if (!calculatorId) {
          return createFailure("progress_percentage", "invalid_calculator_id", {
            progressPercentage: 0,
            calculatorId: null,
            reportProgress: null,
          });
        }

        const reportProgress = normalizeProgressRoute(input.reportProgress);
        if (!reportProgress) {
          return createFailure("progress_percentage", "missing_report_progress", {
            progressPercentage: 0,
            calculatorId,
            reportProgress: null,
          });
        }

        const progressPercentage = resolveProgressPercentageByCalculatorId(calculatorId, reportProgress);
        if (progressPercentage === null) {
          return createFailure("progress_percentage", "unknown_progress", {
            progressPercentage: 0,
            calculatorId,
            reportProgress,
          });
        }

        return createSuccess("progress_percentage", "progress_percentage_resolved", {
          progressPercentage,
          calculatorId,
          reportProgress,
        });
      }
    covers:
      - "condition:valid-payload-check"
      - "condition:valid-calculator-id"
      - "condition:valid-report-progress-route"
      - "condition:recognized-route-for-calculator"
      - "output:progress_result_success"
      - "output:progress_result_failure"
    line_range:
      start: 325
      end: 367

  - path: src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      function resolveReportProgressInput(options = {}) {
        if (!options || typeof options !== "object" || Array.isArray(options)) {
          return null;
        }

        const report =
          options.report && typeof options.report === "object" && !Array.isArray(options.report)
            ? options.report
            : null;

        return {
          calculatorId: options.calculatorId ?? report?.calculatorId ?? null,
          reportProgress: options.reportProgress ?? report?.reportProgress ?? null,
        };
      }
    covers:
      - "condition:valid-payload-check"
      - "input:calculatorId"
      - "input:reportProgress"
    line_range:
      start: 97
      end: 111

  - path: src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      function normalizeCalculatorId(value) {
        if (typeof value === "number" && Number.isFinite(value)) {
          value = String(Math.trunc(value));
        }

        const normalized = normalizeString(value);
        if (!normalized) {
          return null;
        }

        return VALID_CALCULATOR_ID_SET.has(normalized) ? normalized : null;
      }
    covers:
      - "condition:valid-calculator-id"
      - "input:calculatorId"
    line_range:
      start: 38
      end: 49

  - path: src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      function normalizeProgressRoute(value) {
        const normalized = normalizeString(value);
        if (!normalized || !normalized.startsWith("/")) {
          return null;
        }

        let route = normalized.replace(/\/{2,}/g, "/");
        if (route.length > 1 && route.endsWith("/")) {
          route = route.slice(0, -1);
        }

        return route;
      }
    covers:
      - "condition:valid-report-progress-route"
      - "input:reportProgress"
    line_range:
      start: 51
      end: 63

  - path: src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      function resolveVeProgressPercentage(route) {
        const questionnaireStep = toStepNumber(route, /^\/questionnaire\/(\d+)(?:\/|$)/);
        if (questionnaireStep !== null) {
          return clampPercent(5 + (questionnaireStep - 1) * 5);
        }

        if (route.startsWith("/add-period")) {
          return 50;
        }

        if (route === "/income-statement") {
          return 60;
        }

        if (route === "/customize-report-1") {
          return 70;
        }

        if (route === "/industry-data") {
          return 76;
        }

        if (route === "/customize-report-2") {
          return 82;
        }

        if (route === "/choose-multiplier") {
          return 88;
        }

        if (route === "/your-information") {
          return 94;
        }

        if (
          route === "/value-estimate" ||
          route === "/thankyou" ||
          route.includes("optional-questions")
        ) {
          return 100;
        }

        return null;
      }
    covers:
      - "condition:ve-step-calculation"
      - "condition:optional-questions-completion"
      - "condition:recognized-route-for-calculator"
    line_range:
