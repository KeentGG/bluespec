  - path: src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      function clampPercent(value) {
        return Math.max(0, Math.min(100, Math.round(value)));
      }

      function toStepNumber(route, expression) {
        const matched = route.match(expression);
        if (!matched) {
          return null;
        }

        const raw = Number.parseInt(matched[1], 10);
        return Number.isFinite(raw) && raw > 0 ? raw : null;
      }
    covers:
