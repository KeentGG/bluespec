      function validatePersistedBusinessId(rawValue) {
        const normalized = normalizeString(rawValue);
        if (!normalized) {
          return {
            valid: false,
            reason: "missing_or_empty_string",
            value: null,
          };
        }

        if (normalized.length > 128) {
          return {
            valid: false,
            reason: "value_too_long",
            value: null,
          };
        }

        if (/^(null|undefined)$/i.test(normalized)) {
          return {
            valid: false,
            reason: "reserved_literal_value",
            value: null,
          };
        }

        if (/[\r\n\t]/.test(normalized) || /\s/.test(normalized)) {
          return {
            valid: false,
            reason: "contains_whitespace",
            value: null,
          };
        }

        if (/^[\[{"]/.test(normalized)) {
          return {
            valid: false,
            reason: "serialized_payload_detected",
            value: null,
          };
        }

        return {
          valid: true,
          reason: "valid",
          value: normalized,
        };
      }
    covers:
      - "condition:business-id-validation"
    line_range:
      start: 148
      end: 195

