        }

        if (key === "questionnaireSteps") {
          return validateJsonArray(rawValue);
        }

        if (key === "currentStepper" || key === "LastformValues") {
          return validateJsonObject(rawValue);
        }

        return {
          valid: true,
          reason: "unknown_key_passthrough",
          value: rawValue,
        };
      }
    covers:
