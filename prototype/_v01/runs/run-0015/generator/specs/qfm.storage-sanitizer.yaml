      function validateStorageValueByKey(key, rawValue) {
        if (key === "targetId" || key === "downloadPdfKey") {
          return validateNonEmptyIdentity(rawValue);
        }

        if (key === "db_businessid") {
          return validatePersistedBusinessId(rawValue);
        }

