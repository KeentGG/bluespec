      end: 288

  - path: src/shared/lib/contracts/storage-contract.js
    snippet: |
      export function commitIdentityKeyAfterPersistence({
        key,
        persistedValue,
        candidateValue,
        persistenceSucceeded,
        options = {},
      } = {}) {
        if (!isIdentityBearingStorageKey(key)) {
          throw new TypeError(`key must be an identity-bearing storage key. Received: ${String(key)}`);
        }

        const normalizedPersisted = resolveStorageContractValue(key, persistedValue, options);
        const normalizedCandidate = resolveStorageContractValue(key, candidateValue, options);

        if (!persistenceSucceeded) {
          return {
            key,
            committed: false,
            reason: "persistence_failed",
            value: normalizedPersisted,
            previousValue: normalizedPersisted,
          };
        }

        if (!hasCommittedIdentityValue(key, normalizedCandidate)) {
          return {
            key,
            committed: false,
            reason: "missing_identity_in_success_response",
            value: normalizedPersisted,
            previousValue: normalizedPersisted,
          };
        }

        return {
          key,
          committed: true,
          reason: "persisted",
          value: normalizedCandidate,
          previousValue: normalizedPersisted,
        };
      }
    covers:
      - "condition:identity-key-commitment"
      - "output:identity_commitment"
    line_range:
      start: 302
      end: 343

  - path: src/shared/lib/contracts/storage-contract.js
    snippet: |
      function hasCommittedIdentityValue(key, value) {
        if (key === "targetId") {
          return typeof value === "string" && value.length > 0;
        }

        if (key === "downloadPdfKey") {
          return typeof value === "string" && value.length > 0;
        }

        return value !== null && typeof value !== "undefined";
      }
    covers:
      - "condition:identity-key-commitment"
    line_range:
      start: 290
      end: 300

confidence: 0.91
confidence_rationale: >
  All 3 discovered behaviors are fully evidenced across 2 primary source files
  with direct code snippets. Storage validation confirmed in storageSanitizer.js
  with 7 keys, type-specific validators, and multi-rule business ID validation.
  Storage recovery confirmed with safe defaults, QFM taxonomy integration
  (bucket, failure mode ID, reason code), and storageMutation output shape.
  Corruption pattern handling confirmed with 5 distinct patterns. Storage contract
  confirmed in storage-contract.js with 9 key contracts, owner-based cleanup plan,
  and identity key commitment logic. Deducted 0.09 because: (1) the sanitizer
  only covers 7 of the 9 keys in storage-contract.js (user, rememberMe,
  isClassificationFinished are not sanitized), (2) the storage-contract.js
  STORAGE_VALIDATORS have their own validation logic that may diverge from the
  sanitizer's validators (e.g., questionnaireSteps default is ["step-1"..."step-4"]
  in contract but [] in sanitizer), (3) the interaction between
  sanitizeDashboardPersistedKey and resolveStorageContractValue is not explicitly
  wired — callers must coordinate both modules, (4) the cloneValue deep-clone
  implementation does not handle circular references (documented as known limitation
  in comments).

unresolved_questions:
  - "Why do storageSanitizer.js and storage-contract.js have different default values for questionnaireSteps? Sanitizer defaults to [] while contract defaults to ['step-1', 'step-2', 'step-3', 'step-4']. Which is authoritative?"
  - "The sanitizer covers 7 keys but the contract defines 9 (including user, rememberMe, isClassificationFinished). Are the cookie-based keys (user, rememberMe) intentionally excluded from sanitizer validation?"
  - "How do callers coordinate between sanitizeDashboardPersistedKey() and resolveStorageContractValue()? Are they called in sequence, or does one replace the other?"
  - "The STORAGE_VALIDATORS in storage-contract.js have their own normalization logic (e.g., normalizeIdentityString, parseJsonOrNull) that differs from the sanitizer's validators. Are these intentional redundancies or drift?"
  - "commitIdentityKeyAfterPersistence() throws for non-identity keys. Is this a hard contract or should callers guard with isIdentityBearingStorageKey() first?"
  - "The storageMutation action 'remove' fires when fallbackValue is null (e.g., db_businessid, downloadPdfKey, currentStepper). Does the caller actually call localStorage.removeItem() in this case, or is the mutation just advisory?"

