  - path: src/shared/lib/contracts/storage-contract.js
    snippet: |
      export function buildOwnedCleanupPlan(owner, keys = []) {
        const normalizedOwner = ensureOwner(owner);
        const normalizedKeys = normalizeCleanupKeys(keys);
        const removableKeys = [];
        const blockedKeys = [];
        const unknownKeys = [];

        for (const key of normalizedKeys) {
          const contract = getStorageKeyContract(key);

          if (!contract) {
            unknownKeys.push(key);
            continue;
          }

          if (contract.owners.includes(normalizedOwner)) {
            removableKeys.push(key);
            continue;
          }

          blockedKeys.push(key);
        }

        return {
          owner: normalizedOwner,
          removableKeys,
          blockedKeys,
          unknownKeys,
        };
      }
    covers:
      - "condition:owner-based-cleanup"
      - "output:cleanup_plan"
    line_range:
      start: 240
      end: 269

  - path: src/shared/lib/contracts/storage-contract.js
    snippet: |
      export function applyOwnedCleanup(owner, keys = [], storageSnapshot = {}) {
        const plan = buildOwnedCleanupPlan(owner, keys);

        if (!isPlainObject(storageSnapshot)) {
          throw new TypeError("storageSnapshot must be a plain object.");
        }

        const nextStorageSnapshot = { ...storageSnapshot };

        for (const key of plan.removableKeys) {
          delete nextStorageSnapshot[key];
        }

        return {
          ...plan,
          nextStorageSnapshot,
        };
      }
    covers:
      - "condition:owner-based-cleanup"
      - "output:cleanup_result"
    line_range:
