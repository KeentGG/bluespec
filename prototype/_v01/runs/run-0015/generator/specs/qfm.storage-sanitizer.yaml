  - path: src/shared/lib/qfm/storageSanitizer.js
    snippet: |
      export function sanitizeDashboardPersistedKey(options = {}) {
        const key = normalizeStorageKey(options.key);
        const rawValue = Object.prototype.hasOwnProperty.call(options, "rawValue")
          ? options.rawValue
          : null;
        const flowId = normalizeString(options.flowId) ?? "dashboard.storage.sanitizer";

        if (!key) {
          const fallbackValue = resolveFallbackValue("unknown", options.fallbackValue);

          return {
            schema: QFM_STORAGE_SANITIZER_SCHEMA,
            key: normalizeString(options.key),
            value: fallbackValue,
            recovered: true,
            storageMutation: createStorageMutation(true, normalizeString(options.key), fallbackValue),
            recovery: {
              schema: QFM_STORAGE_SANITIZER_SCHEMA,
              eventName: "qfm.storage.recovered",
              flowId,
              key: normalizeString(options.key),
              recovered: true,
              taxonomyBucket: QFM_STORAGE_RECOVERY_BUCKET,
              failureModeId: QFM_STORAGE_RECOVERY_FAILURE_MODE_ID,
              reasonCode: QFM_STORAGE_RECOVERY_REASON_CODE,
              validationReason: "unsupported_key",
              previousValueType: resolveValueType(rawValue),
              recoveryAction: fallbackValue === null ? "remove" : "set_default",
            },
          };
        }

        const fallbackValue = resolveFallbackValue(key, options.fallbackValue);
        const validation = validateStorageValueByKey(key, rawValue);
        const recovered = validation.valid !== true;
        const value = recovered ? fallbackValue : validation.value;
        const storageMutation = createStorageMutation(recovered, key, value);

        return {
          schema: QFM_STORAGE_SANITIZER_SCHEMA,
          key,
          value,
          recovered,
          storageMutation,
          recovery: {
            schema: QFM_STORAGE_SANITIZER_SCHEMA,
            eventName: recovered ? "qfm.storage.recovered" : "qfm.storage.valid",
            flowId,
            key,
            recovered,
            taxonomyBucket: recovered ? QFM_STORAGE_RECOVERY_BUCKET : null,
            failureModeId: recovered ? QFM_STORAGE_RECOVERY_FAILURE_MODE_ID : null,
            reasonCode: recovered ? QFM_STORAGE_RECOVERY_REASON_CODE : "storage_value_valid",
            validationReason: validation.reason,
            previousValueType: resolveValueType(rawValue),
            recoveryAction:
              storageMutation.action === "none"
                ? "none"
                : storageMutation.action === "remove"
                  ? "remove"
                  : "set_default",
          },
        };
      }
    covers:
      - "condition:recovery-event-emission"
      - "output:sanitization_result"
    line_range:
      start: 338
      end: 401

  - path: src/shared/lib/qfm/storageSanitizer.js
    snippet: |
      function createStorageMutation(recovered, key, value) {
        if (!recovered) {
          return {
            action: "none",
            key,
            value: null,
          };
        }

        const serializedValue = serializeSanitizedDashboardStorageValue(value);
        if (serializedValue === null) {
          return {
            action: "remove",
            key,
            value: null,
          };
        }

        return {
          action: "set",
          key,
          value: serializedValue,
        };
      }
    covers:
      - "output:sanitization_result"
    line_range:
      start: 313
      end: 336

