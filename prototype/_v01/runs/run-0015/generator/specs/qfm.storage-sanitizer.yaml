id: qfm.storage-sanitizer
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: storage-validation
    coverage: full
    notes: >
      Validates 7 dashboard localStorage keys against type-specific rules.
      Each key has a dedicated validator: targetId and downloadPdfKey require
      non-empty identity strings; db_businessid enforces length limit (128),
      rejects reserved literals ("null", "undefined"), whitespace, and
      serialized payloads; downloadingpdf accepts boolean or string "true"/"false";
      questionnaireSteps requires valid JSON array; currentStepper and LastformValues
      require valid JSON objects. Unknown keys pass through with valid=true.
  - id: storage-recovery
    coverage: full
    notes: >
      When validation fails, replaces corrupted value with a safe default from
      DEFAULT_KEY_FALLBACKS. Emits recovery events with taxonomy bucket
      "storage corruption", failure mode ID "FM-STORAGE-001", and reason code
      "storage_recovery_applied". Produces storageMutation objects with action
      "none" (valid), "set" (recovered to default), or "remove" (fallback is null).
      Recovery events include flowId for traceability.
  - id: storage-corruption-patterns
    coverage: full
    notes: >
      Handles 5 corruption patterns: (1) literal "null"/"undefined" strings from
      JSON.stringify(null), (2) malformed JSON from interrupted writes, (3) type
      mismatches (string instead of array), (4) whitespace/newlines in business IDs
      from copy-paste, (5) serialized payloads (starting with [{") in identity fields.
      Business ID validator also rejects values longer than 128 characters.

description: >
  Validates and recovers corrupted localStorage values used by the dashboard.
  The sanitizer reads a localStorage key, validates it against type-specific rules
  (non-empty string, valid JSON array, boolean, etc.), and if invalid, replaces it
  with a safe default. Each recovery emits a QFM event with taxonomy bucket
  "storage corruption" for observability. The storage contract module defines key
  ownership, identity-bearing status, and provides owner-based cleanup for logout
  flows. Identity-bearing keys (targetId, downloadPdfKey) require special handling:
  they are committed only after successful persistence and must be cleaned up on
  logout.

state_machine: null

conditions:
  - id: key-normalization
    description: >
      Normalizes the input key against the allowed DASHBOARD_STORAGE_KEYS list.
      Unknown or empty keys are treated as unsupported and trigger recovery with
      the "unsupported_key" validation reason.
    trigger: sanitizeDashboardPersistedKey() called with options.key
    guards:
      - field: key
        condition: >
          Key must be a non-empty string that matches one of the 7 dashboard
          storage keys: targetId, db_businessid, downloadPdfKey, downloadingpdf,
          questionnaireSteps, currentStepper, LastformValues.
    then:
      - Proceed to type-specific validation via validateStorageValueByKey()
    else:
      - Return recovery result with validationReason "unsupported_key"
      - Emit "qfm.storage.recovered" event

  - id: validation-dispatch
    description: >
      Dispatches to the appropriate type-specific validator based on the key name.
      Each validator returns {valid, reason, value} where valid indicates whether
      the raw value meets the contract.
    trigger: Key normalization succeeds
    guards:
      - field: key
        condition: >
          Key is one of the 7 recognized dashboard storage keys.
    then:
      - targetId/downloadPdfKey → validateNonEmptyIdentity()
      - db_businessid → validatePersistedBusinessId()
      - downloadingpdf → validateBooleanStorageValue()
      - questionnaireSteps → validateJsonArray()
      - currentStepper/LastformValues → validateJsonObject()
    else:
      - Return passthrough with reason "unknown_key_passthrough"

  - id: business-id-validation
    description: >
      Multi-rule validation for db_businessid: rejects empty strings, values
      longer than 128 characters, reserved literals ("null", "undefined"),
      whitespace/newlines, and serialized payloads (strings starting with [{").
    trigger: validatePersistedBusinessId() called
    guards:
      - field: normalized_value
        condition: Non-empty string after trim
      - field: length
        condition: <= 128 characters
      - field: reserved_literal
        condition: Does not match /^(null|undefined)$/i
      - field: whitespace
        condition: No \r, \n, \t, or \s characters
      - field: serialized_payload
        condition: Does not start with [{"
    then:
      - "Return valid=true, reason=valid, value=normalized"
    else:
      - "Return valid=false with specific failure reason, value=null"

  - id: recovery-event-emission
    description: >
      When validation fails (recovered=true), emits a recovery event with full
      QFM taxonomy integration. The event includes taxonomy bucket, failure mode
      ID, reason code, validation reason, previous value type, and recovery action.
      When valid, emits a "qfm.storage.valid" event with null taxonomy fields.
    trigger: Validation completes with recovered=true
    guards:
      - field: recovered
        condition: validation.valid !== true
    then:
      - Set eventName to "qfm.storage.recovered"
      - Set taxonomyBucket to "storage corruption"
      - Set failureModeId to "FM-STORAGE-001"
      - Set reasonCode to "storage_recovery_applied"
      - Set recoveryAction based on storageMutation.action
    else:
      - Set eventName to "qfm.storage.valid"
      - Set taxonomyBucket, failureModeId to null
      - Set reasonCode to "storage_value_valid"

  - id: owner-based-cleanup
    description: >
      Builds a cleanup plan for a given owner by checking each key's contract.
      Keys owned by the caller are removable; keys owned by others are blocked;
      unknown keys are flagged separately. applyOwnedCleanup() executes the plan
      by deleting removable keys from a storage snapshot.
    trigger: buildOwnedCleanupPlan() or applyOwnedCleanup() called
    guards:
      - field: owner
        condition: Non-empty string
      - field: keys
        condition: Array of non-empty strings
    then:
      - For each key: check STORAGE_KEY_CONTRACTS[key].owners.includes(owner)
      - If owner matches → add to removableKeys
      - If contract exists but owner doesn't match → add to blockedKeys
      - If no contract → add to unknownKeys
    else:
      - Throw TypeError for invalid owner or keys

  - id: identity-key-commitment
    description: >
      After a persistence operation, commits identity-bearing key values only
      if persistence succeeded AND the candidate value is non-empty. If
      persistence failed or the candidate is empty, retains the previous value.
      Throws if key is not in STORAGE_IDENTITY_KEYS.
    trigger: commitIdentityKeyAfterPersistence() called
    guards:
      - field: key
        condition: Must be an identity-bearing key (targetId or downloadPdfKey)
      - field: persistenceSucceeded
        condition: Boolean indicating if the write to storage succeeded
      - field: candidateValue
        condition: >
          After normalization, must be a non-empty string for targetId/downloadPdfKey
    then:
      - "Return committed=true, value=normalizedCandidate, previousValue=normalizedPersisted"
    else:
      - "Return committed=false with reason, value=normalizedPersisted"

inputs:
  - id: storage_key
    type: "string — one of 7 dashboard localStorage key names"
    source: "Caller of sanitizeDashboardPersistedKey() — typically dashboard initialization or storage change handlers"
    required: true
    validation:
      allowed_values: "targetId, db_businessid, downloadPdfKey, downloadingpdf, questionnaireSteps, currentStepper, LastformValues"

  - id: raw_value
    type: "string | null — raw localStorage value"
    source: "localStorage.getItem() or equivalent storage read"
    required: false
    validation:
      note: "null indicates key does not exist in storage"

  - id: fallback_value
    type: "any — explicit fallback override"
    source: "Caller-provided default, overrides DEFAULT_KEY_FALLBACKS"
    required: false
    validation:
      note: "If undefined, uses DEFAULT_KEY_FALLBACKS[key]"

  - id: flow_id
    type: "string — traceability identifier"
    source: "Caller-provided or defaults to 'dashboard.storage.sanitizer'"
    required: false

  - id: owner
    type: "string — module name requesting cleanup"
    source: "Auth flow or logout handler"
    required: true
    validation:
      note: "Must be a non-empty string matching a known owner in STORAGE_KEY_CONTRACTS"

  - id: cleanup_keys
    type: "string[] — keys to evaluate for cleanup"
    source: "Caller-provided list of storage keys"
    required: true

  - id: storage_snapshot
    type: "object — current storage state"
    source: "In-memory snapshot of localStorage contents"
    required: true
    validation:
      note: "Must be a plain object for applyOwnedCleanup()"

outputs:
  - id: sanitization_result
    type: "{ schema: string, key: string, value: any, recovered: boolean, storageMutation: { action: 'none'|'set'|'remove', key: string, value: string|null }, recovery: { schema: string, eventName: string, flowId: string, key: string, recovered: boolean, taxonomyBucket: string|null, failureModeId: string|null, reasonCode: string, validationReason: string, previousValueType: string, recoveryAction: string } }"
    destination: "Caller of sanitizeDashboardPersistedKey() — drives storage writes and QFM event emission"
    lifespan: "immediate"

  - id: cleanup_plan
    type: "{ owner: string, removableKeys: string[], blockedKeys: string[], unknownKeys: string[] }"
    destination: "Caller of buildOwnedCleanupPlan() — drives logout cleanup logic"
    lifespan: "immediate"

  - id: cleanup_result
    type: "{ owner: string, removableKeys: string[], blockedKeys: string[], unknownKeys: string[], nextStorageSnapshot: object }"
    destination: "Caller of applyOwnedCleanup() — updated storage snapshot after cleanup"
    lifespan: "immediate"

  - id: identity_commitment
    type: "{ key: string, committed: boolean, reason: string, value: any, previousValue: any }"
    destination: "Caller of commitIdentityKeyAfterPersistence() — drives identity state updates"
    lifespan: "immediate"

