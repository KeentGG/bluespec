  - path: src/shared/lib/qfm/failureTaxonomy.js
    snippet: |
      function collectFailureSignals(failureLike = {}) {
        const descriptor = isPlainObject(failureLike) ? failureLike : {};
        const nestedError = descriptor.error instanceof Error ? descriptor.error : null;
        const directError = failureLike instanceof Error ? failureLike : null;
        const error = nestedError ?? directError;

        const explicitBucket =
          canonicalizeQfmFailureBucket(
            descriptor.taxonomyBucket ?? descriptor.bucket ?? descriptor.category,
            { allowNull: true },
          ) ?? null;

        const statusCode = toStatusCode(
          descriptor.statusCode ?? descriptor.status ?? descriptor.response?.status ?? error?.statusCode,
        );

        const signalParts = [
          descriptor.reason,
          descriptor.reasonCode,
          descriptor.message,
          descriptor.code,
          descriptor.operation,
          descriptor.source,
          descriptor.signal,
          error?.name,
          error?.message,
          error?.code,
        ]
          .map(normalizeSignalPart)
          .filter(Boolean);

        const reasonCode =
          normalizeReasonCode(descriptor.reasonCode) ||
          normalizeReasonCode(descriptor.code) ||
          normalizeReasonCode(error?.code);

        return {
          explicitBucket,
          statusCode,
          signal: signalParts.join(" | "),
          reasonCode,
        };
      }
    covers:
      - "condition:signal-extraction"
    line_range:
      start: 209
      end: 251

  - path: src/shared/lib/qfm/failureTaxonomy.js
    snippet: |
      function resolveBucket({ explicitBucket, statusCode, signal }) {
        if (explicitBucket) {
          return explicitBucket;
        }

        if (AUTH_FAILURE_STATUS_CODES.includes(statusCode)) {
          return "auth/session";
        }

        if (includesKeyword(signal, AUTH_KEYWORDS)) {
          return "auth/session";
        }

        if (includesKeyword(signal, STALE_KEYWORDS)) {
          return "stale state";
        }

        if (includesKeyword(signal, STORAGE_KEYWORDS)) {
          return "storage corruption";
        }

        if (includesKeyword(signal, IMPORT_KEYWORDS)) {
          return "import mapping";
        }

        if (includesKeyword(signal, PDF_KEYWORDS)) {
          return "PDF";
        }

        if (includesKeyword(signal, ROUTING_KEYWORDS)) {
          return "routing";
        }

        if (includesKeyword(signal, CONTRACT_KEYWORDS)) {
          return "data contract";
        }

        return "data contract";
      }
    covers:
      - "condition:bucket-resolution-priority"
    line_range:
      start: 253
      end: 291

  - path: src/shared/lib/qfm/failureTaxonomy.js
    snippet: |
      export function classifyQfmFailure(failureLike = {}) {
        const failureSignals = collectFailureSignals(failureLike);
        const bucket = resolveBucket(failureSignals);
        const details = QFM_TAXONOMY_DETAILS[bucket];

        return {
          bucket,
          failureModeId: details.failureModeId,
          userBehavior: details.userBehavior,
          reasonCode: failureSignals.reasonCode || details.defaultReasonCode,
        };
      }
    covers:
      - "output:classification_result"
    line_range:
      start: 313
      end: 324

  - path: src/shared/lib/qfm/failureTaxonomy.js
    snippet: |
      const AUTH_FAILURE_STATUS_CODES = [401, 403];

      const AUTH_KEYWORDS = Object.freeze([
        "auth", "session", "token", "cookie", "unauthorized",
        "forbidden", "login", "no-access",
      ]);

      const ROUTING_KEYWORDS = Object.freeze([
        "route", "routing", "handoff", "gate", "calculatorid",
        "navigation", "url", "missing_target",
      ]);

      const CONTRACT_KEYWORDS = Object.freeze([
        "contract", "envelope", "schema", "statuscode", "missing _id",
        "missing_id", "required field", "invalid response", "payload",
      ]);

      const IMPORT_KEYWORDS = Object.freeze([
        "import", "mapping", "mapper", "source report",
        "target field", "unresolved required",
      ]);

      const PDF_KEYWORDS = Object.freeze([
        "pdf", "download", "generate-pdf", "poller",
        "downloadingpdf", "email delivery",
      ]);

      const STORAGE_KEYWORDS = Object.freeze([
        "storage", "localstorage", "persist", "json parse",
        "malformed json", "corrupt",
      ]);

      const STALE_KEYWORDS = Object.freeze([
        "stale", "out of order", "out-of-order", "race",
        "superseded", "abort", "canceled", "cancelled", "version",
      ]);
    covers:
      - "condition:bucket-resolution-priority"
      - "condition:signal-extraction"
    line_range:
      start: 102
      end: 175

  - path: src/shared/lib/qfm/responseAdapter.js
    snippet: |
      export function normalizeQfmResponse(responseOrPayload, options = {}) {
        const transportResponse = isTransportResponseLike(responseOrPayload) ? responseOrPayload : null;
        const payload = transportResponse
          ? hasOwn(transportResponse, "data")
            ? transportResponse.data
            : undefined
          : responseOrPayload;
        const transportStatus = transportResponse ? transportResponse.status : options.transportStatus;
        const normalized = normalizeMixedEnvelope(payload, { transportStatus });
        const contractFailure = detectContractFailure({
          normalized,
          transportResponse,
          originalInput: responseOrPayload,
        });

        return {
          ok: contractFailure ? false : normalized.ok,
          statusCode: normalized.statusCode,
          message: normalized.message || contractFailure?.message || "",
          data: normalized.data,
          envelopeType: normalized.envelopeType,
          raw: normalized.raw,
          taxonomyBucket: contractFailure ? CONTRACT_BUCKET : null,
          contractFailure,
        };
      }
    covers:
      - "condition:envelope-detection"
      - "condition:contract-violation-detection"
      - "output:normalized_response"
    line_range:
      start: 108
      end: 133

  - path: src/shared/lib/qfm/responseAdapter.js
    snippet: |
      function detectContractFailure({ normalized, transportResponse, originalInput }) {
        if (!isValidHttpStatusCode(normalized.statusCode)) {
          return createContractFailure(
            "invalid_normalized_status",
            "Normalized response statusCode is not a valid HTTP status code.",
          );
        }

        if (transportResponse && !hasOwn(transportResponse, "data")) {
          return createContractFailure(
            "missing_transport_data",
            "Transport response is missing required data payload.",
          );
        }

        if (normalized.envelopeType === "wrapped") {
          const wrapped = normalized.raw;

          if (!isPlainObject(wrapped) || !hasOwn(wrapped, "statusCode")) {
            return createContractFailure(
              "missing_envelope_status_code",
              "Wrapped response envelope is missing statusCode.",
            );
          }

          if (!isValidHttpStatusCode(wrapped.statusCode)) {
            return createContractFailure(
              "invalid_envelope_status_code",
              "Wrapped response envelope contains an invalid statusCode.",
            );
          }

          if (!hasOwn(wrapped, "data")) {
            return createContractFailure(
              "missing_envelope_data",
              "Wrapped response envelope is missing required data field.",
            );
          }
        }

        if (typeof normalized.data === "undefined") {
          return createContractFailure(
            "missing_normalized_data",
            "Normalized response data is undefined.",
          );
        }

        if (typeof originalInput === "undefined") {
          return createContractFailure("missing_payload", "Response payload is undefined.");
        }

        return null;
      }
    covers:
      - "condition:contract-violation-detection"
    line_range:
      start: 54
      end: 106

  - path: src/shared/lib/qfm/responseAdapter.js
    snippet: |
      function isTransportResponseLike(candidate) {
        return isPlainObject(candidate) && hasOwn(candidate, "status");
      }

      function isValidHttpStatusCode(rawStatusCode) {
        const parsed = toStatusCode(rawStatusCode);
        return parsed !== null && parsed >= HTTP_STATUS_MIN && parsed <= HTTP_STATUS_MAX;
      }

      function createContractFailure(reasonCode, message) {
        return {
          bucket: CONTRACT_BUCKET,
          failureModeId: CONTRACT_FAILURE_MODE_ID,
          reasonCode,
          message,
        };
      }
    covers:
      - "condition:envelope-detection"
      - "condition:contract-violation-detection"
    line_range:
      start: 36
      end: 52

  - path: src/shared/lib/qfm/index.js
    snippet: |
      // --- Error classification ---
      export {
        QFM_TAXONOMY_BUCKETS,
        QFM_TAXONOMY_DETAILS,
        canonicalizeQfmFailureBucket,
        isQfmFailureBucket,
        classifyQfmFailure,
      } from "./failureTaxonomy";

      // --- Response normalization ---
      export {
        normalizeQfmResponse,
        QFM_CONTRACT_BUCKET,
        QFM_CONTRACT_FAILURE_MODE_ID,
      } from "./responseAdapter";
    covers:
      - "output:classification_result"
      - "output:normalized_response"
    line_range:
      start: 1
      end: 15

confidence: 0.93
confidence_rationale: >
  All three discovered behaviors are fully evidenced across 3 primary source files
  with direct code snippets. Failure bucketing confirmed in failureTaxonomy.js with
  7 buckets, keyword priority ordering, signal extraction from multiple failure
  shapes, and static bucket details. Response normalization confirmed in
  responseAdapter.js with wrapped/raw detection, contract violation detection (6
  distinct failure modes), and consistent output shape. User behavior mapping
  confirmed via BUCKET_DETAILS with 7 static mappings. The normalizeMixedEnvelope
  dependency in api-contract.ts was also inspected to confirm envelope detection
  logic. Deducted 0.07 because: (1) the isWrappedEnvelope detection in
  api-contract.ts uses a simple hasOwn(payload, "statusCode") check that could
  false-positive on non-envelope objects with a statusCode property, (2) the
  keyword matching is first-match-wins with no disambiguation for signals that
  match multiple buckets (e.g., "routing" + "stale" keywords both present),
  (3) the "data contract" default fallback means genuinely unrecognized errors
  are silently classified as contract violations rather than flagged as unknown.

unresolved_questions:
  - "What happens when a signal matches keywords from multiple buckets? The resolveBucket() function uses first-match-wins priority (auth > stale > storage > import > PDF > routing > contract), but there is no logging or telemetry for ambiguous classifications."
  - "Is the 'data contract' default fallback intentional for truly unrecognized errors, or should there be an 'unknown' bucket to surface classification gaps?"
  - "How do callers consume the userBehavior string? The spec documents the mapping but not the downstream dispatch logic that translates userBehavior into actual UI actions."
  - "The BUCKET_ALIAS_TO_CANONICAL map includes aliases like 'auth', 'session', 'contract' — are these used by external callers or only internally by canonicalizeQfmFailureBucket?"
  - "The normalizeMixedEnvelope function in api-contract.ts has its own isWrappedEnvelope check (hasOwn 'statusCode') that may differ from the responseAdapter's isTransportResponseLike check (hasOwn 'status'). Are these intentionally different?"

status: complete
