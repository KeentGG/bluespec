id: qfm.error-classification
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: qfm-failure-bucketing
    coverage: full
    notes: >
      Classifies any error/failure object into one of 7 predefined buckets via
      classifyQfmFailure(). Extracts signals from the failure object (reason codes,
      error messages, status codes, nested Error objects) and matches them against
      keyword lists in priority order. Auth/status-code checks run first, followed
      by stale, storage, import, PDF, routing, and contract keyword matching.
      Falls back to "data contract" when no signals match. Each bucket carries a
      static failureModeId, userBehavior, and defaultReasonCode.
  - id: qfm-response-normalization
    coverage: full
    notes: >
      Normalizes wrapped API envelopes ({statusCode, data, message}) and raw
      payloads into a consistent shape ({ok, statusCode, message, data,
      envelopeType, raw}). Detects contract violations (missing statusCode,
      invalid HTTP status, missing data field, undefined payload) and tags them
      with the "data contract" bucket and FM-CONTRACT-001 failure mode ID.
      Transport-level response detection (axios-like {status, data}) is handled
      before envelope normalization.
  - id: qfm-user-behavior-mapping
    coverage: full
    notes: >
      Each of the 7 failure buckets maps to a predefined userBehavior string
      that prescribes the UI recovery action. The mapping is static and defined
      in BUCKET_DETAILS. Behaviors include redirect_to_login, block_navigation,
      block_success_ui, block_submit, transition_pdf_state, reset_to_safe_defaults,
      and ignore_stale_result. The classification output includes the behavior
      string alongside failureModeId and reasonCode for downstream consumers.

description: >
  QFM (Query/Failure/Mutation) error classification system that categorizes any
  failure into one of 7 buckets (auth/session, routing, data contract, import
  mapping, PDF, storage corruption, stale state) based on signal extraction and
  keyword matching. Each bucket maps to a predefined user behavior for consistent
  UI recovery. The system also normalizes wrapped vs raw API response envelopes
  into a consistent shape and detects contract violations when the response
  structure is broken. The classification is purely functional with no side
  effects — it returns a classification result that callers use to drive UI
  behavior.

state_machine: null

conditions:
  - id: signal-extraction
    description: >
      Extracts failure signals from a failure-like object by collecting reason
      codes, error messages, status codes, and nested Error properties into a
      normalized signal string. Handles plain objects, Error instances, and
      nested {error: Error} shapes. Explicit bucket overrides (taxonomyBucket,
      bucket, category) are canonicalized before signal extraction.
    trigger: classifyQfmFailure() called with a failure-like object
    guards:
      - field: input_type
        condition: >
          Input is a plain object (via isPlainObject) or an Error instance.
          Non-object inputs default to empty descriptor.
    then:
      - Extract explicitBucket from descriptor.taxonomyBucket, .bucket, or .category
      - Extract statusCode from descriptor.statusCode, .status, .response.status, or error.statusCode
      - Collect signal parts from: reason, reasonCode, message, code, operation, source, signal, error.name, error.message, error.code
      - Normalize all signal parts to lowercase trimmed strings, filter empty
      - Join signal parts with " | " separator
      - Extract reasonCode from descriptor.reasonCode, .code, or error.code (normalized to snake_case)
    else:
      - Return empty signals with no bucket match

  - id: bucket-resolution-priority
    description: >
      Resolves the failure bucket using a strict priority order. Explicit bucket
      overrides always win. Status codes 401/403 always map to auth/session.
      Keyword matching follows: auth > stale > storage > import > PDF > routing >
      contract. Default fallback is "data contract" when no signals match.
    trigger: Signal extraction complete
    guards:
      - field: explicit_bucket
        condition: If explicitBucket is set, use it directly (skip all keyword matching)
      - field: status_code
        condition: If statusCode is 401 or 403, bucket is "auth/session"
    then:
      - Return the resolved bucket
    else:
      - Match signal string against keyword lists in priority order
      - First matching keyword list determines the bucket
      - If no keywords match, default to "data contract"

  - id: envelope-detection
    description: >
      Detects whether an API response is a "wrapped" envelope (has statusCode
      property) or a "raw" payload. Transport-level responses (axios-like with
      status property) are unwrapped first. Wrapped envelopes are validated for
      statusCode presence and validity. Raw payloads use the transport status
      code as fallback.
    trigger: normalizeQfmResponse() called with a response or payload
    guards:
      - field: transport_response
        condition: >
          Input has a "status" property (isTransportResponseLike) — treated as
          transport response. Payload extracted from .data property.
    then:
      - Extract payload from transportResponse.data
      - Use transportResponse.status as transportStatus
    else:
      - Treat input as direct payload
      - Use options.transportStatus as fallback status

  - id: contract-violation-detection
    description: >
      After normalization, checks the normalized response for contract violations.
      Returns a contractFailure object with bucket "data contract" and
      FM-CONTRACT-001 failure mode ID. Checks run in order: invalid normalized
      status code, missing transport data, missing/wrapped envelope statusCode,
      invalid envelope statusCode, missing envelope data, missing normalized
      data, undefined original payload.
    trigger: Envelope normalization complete
    guards:
      - field: normalized_status
        condition: Normalized statusCode must be a valid HTTP status (100-599)
      - field: transport_data
        condition: If transport response exists, it must have a "data" property
      - field: envelope_integrity
        condition: If envelopeType is "wrapped", raw must be a plain object with statusCode
    then:
      - Return contractFailure with specific reasonCode and message
      - Set taxonomyBucket to "data contract" on the output
      - Set ok to false
    else:
      - Return null (no contract failure)

inputs:
  - id: failure_object
    type: "Plain object, Error instance, or {error: Error} wrapper"
    source: "Any failing operation (API call, navigation, storage, PDF generation)"
    required: true
    validation:
      taxonomyBucket: "string (optional) — explicit bucket override"
      statusCode: "number (optional) — HTTP status code"
      reason: "string (optional) — human-readable reason"
      reasonCode: "string (optional) — machine-readable reason code"
      message: "string (optional) — error message"
      error: "Error instance (optional) — nested error object"

  - id: api_response
    type: "Transport response (axios-like {status, data}) or raw payload"
    source: "API client fetch/axios response"
    required: true
    validation:
      status: "number (optional) — HTTP transport status code"
      data: "unknown (optional) — response payload"
      statusCode: "number (optional) — wrapped envelope status code"

outputs:
  - id: classification_result
    type: "{ bucket: string, failureModeId: string, userBehavior: string, reasonCode: string }"
    destination: "Caller of classifyQfmFailure() — drives UI behavior selection"
    lifespan: "immediate"

  - id: normalized_response
    type: "{ ok: boolean, statusCode: number, message: string, data: unknown, envelopeType: 'wrapped'|'raw', raw: unknown, taxonomyBucket: string|null, contractFailure: object|null }"
    destination: "Caller of normalizeQfmResponse() — drives UI rendering and error handling"
    lifespan: "immediate"

