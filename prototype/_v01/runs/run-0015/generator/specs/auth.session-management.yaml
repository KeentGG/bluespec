  - path: src/features/auth/lib/crossTab.js
    snippet: |
      export const CHANNEL_NAME = "eoyt-auth-sync";

      export function isBroadcastSupported() {
        const isEdgeRuntime = typeof EdgeRuntime !== "undefined";
        return (
          !isEdgeRuntime &&
          typeof window !== "undefined" &&
          typeof globalThis.BroadcastChannel !== "undefined"
        );
      }

      export function broadcastMessage({
        channelName = CHANNEL_NAME, eventType, data, storageKey, cleanupMs = 500,
      }) {
        if (typeof window === "undefined") return;
        // BroadcastChannel path (preferred)
        if (isBroadcastSupported()) {
          try {
            const BC = getBroadcastChannelConstructor();
            if (BC) {
              const channel = new BC(channelName);
              channel.postMessage({ type: eventType, data });
              channel.close();
            }
          } catch (_error) { /* fallback handles it */ }
        }
        // localStorage fallback (universal support)
        if (typeof localStorage !== "undefined") {
          try {
            const payload = typeof data === "string" ? data : JSON.stringify(data);
            localStorage.setItem(storageKey, payload);
            setTimeout(() => { localStorage.removeItem(storageKey); }, cleanupMs);
          } catch (_error) { /* best-effort */ }
        }
      }
    covers:
      - "condition:cross-tab-refresh-lock"
      - "output:refresh_result_broadcast"
      - "output:logout_broadcast_output"
      - "output:login_broadcast_output"
    line_range:
      start: 7
      end: 85

  - path: src/features/auth/lib/crossTab.js
    snippet: |
      export function waitForResult({
        storageKey, channelName = CHANNEL_NAME, eventType, timeoutMs = 8000, pollIntervalMs = 100,
      }) {
        return new Promise((resolve) => {
          if (typeof window === "undefined") { resolve(null); return; }
          const startTime = Date.now();
          const checkStorage = () => {
            try {
              const raw = localStorage.getItem(storageKey);
              if (raw) { try { return JSON.parse(raw); } catch (_e) { return raw; } }
            } catch (_error) { /* localStorage unavailable */ }
            return null;
          };
          const immediate = checkStorage();
          if (immediate !== null) { resolve(immediate); return; }
          // Listen for BroadcastChannel message
          let channel = null;
          if (eventType && isBroadcastSupported()) {
            try {
              const BC = getBroadcastChannelConstructor();
              if (BC) {
                channel = new BC(channelName);
                channel.addEventListener("message", (event) => {
                  if (event.data?.type === eventType) {
                    cleanup();
                    try { resolve(JSON.parse(event.data.data)); }
                    catch (_e) { resolve(event.data.data); }
                  }
                });
              }
            } catch (_error) { channel = null; }
          }
          // Poll localStorage as fallback
          const interval = setInterval(() => {
            const result = checkStorage();
            if (result !== null) { cleanup(); resolve(result); return; }
            if (Date.now() - startTime > timeoutMs) { cleanup(); resolve(null); }
          }, pollIntervalMs);
          function cleanup() {
            clearInterval(interval);
            if (channel) { try { channel.close(); } catch (_e) { /* ignore */ } }
          }
        });
      }
    covers:
      - "condition:cross-tab-refresh-lock"
    line_range:
      start: 169
      end: 256

  - path: src/features/auth/lib/authBroadcast.js
    snippet: |
      const LOGOUT_EVENT = "logout";
      const LOGIN_EVENT = "login";
      const LOGOUT_KEY_PREFIX = "eoyt-logout-";
      const LOGIN_KEY_PREFIX = "eoyt-login-";
