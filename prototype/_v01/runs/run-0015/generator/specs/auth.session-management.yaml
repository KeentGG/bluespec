id: auth.session-management
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: auth-session-lifecycle
    coverage: full
    notes: >
      JWT access tokens stored in JS memory variable, refresh token in HTTP-only
      cookie (backend-set, unreadable by JS), user profile in regular cookie for
      middleware SSR access. Session normalized on set with required _id and
      accessToken fields. Token applied as Bearer header on all requests.
  - id: auth-cross-tab-coordination
    coverage: full
    notes: >
      Cross-tab login/logout sync via BroadcastChannel with localStorage fallback
      for Safari/Edge Runtime compatibility. Logout redirects protected routes;
      login redirects from /login page. Debounce protection prevents redirect loops.
  - id: auth-token-refresh-coordination
    coverage: full
    notes: >
      Cross-tab token refresh uses localStorage-based mutex (10s timeout) to prevent
      simultaneous refresh calls. Promise-based lock prevents in-tab duplicates.
      Refresh result broadcast to waiting tabs. 10s API timeout prevents hangs.
  - id: auth-csrf-protection
    coverage: full
    notes: >
      CSRF token read from regular cookie, injected as x-csrf-token header for all
      state-changing requests. Proactive refresh triggered when CSRF token missing.
      Max 1 retry on CSRF failure. 403 with CSRF message triggers token refresh + retry.

description: >
  Manages the complete authentication session lifecycle for a frontend SPA.
  JWT access tokens are stored in a JavaScript memory variable (not localStorage)
  to prevent XSS access. The refresh token lives in an HTTP-only cookie set by
  the backend and is inaccessible to JavaScript. A user profile cookie enables
  SSR middleware access. Cross-tab coordination uses BroadcastChannel with a
  localStorage fallback for Safari compatibility, synchronizing login/logout events
  and token refresh operations across browser tabs. A localStorage-based mutex
  prevents multiple tabs from refreshing tokens simultaneously. CSRF protection
  is enforced by reading a csrfToken cookie and injecting it as an x-csrf-token
  header on all state-changing requests, with proactive refresh when the token
  is missing.

state_machine:
  initial: anonymous
  states:
    - id: anonymous
      description: No session exists. User is not authenticated.
    - id: authenticating
      description: Login request in progress, awaiting backend response with token payload.
    - id: authenticated
      description: Valid session in memory with accessToken and user data. Token applied to requests.
    - id: refreshing
      description: Access token expired or 401 received. Refresh in progress via HTTP-only cookie.
    - id: logging_out
      description: Logout in progress. Session cleared, cookies removed, cross-tab broadcast sent.
  transitions:
    - id: login_success
      from: anonymous
      to: authenticated
      trigger: Backend returns valid token payload on login
      guards:
        - field: token_payload
          condition: Contains non-empty _id and accessToken strings
      effects:
        - Store normalized session in memory variable
        - Write user profile cookie (7-day TTL, SameSite=Lax)
        - Broadcast login event to other tabs
    - id: token_expired
      from: authenticated
      to: refreshing
      trigger: API request returns 401 or 500 with "jwt expired" message
      guards:
        - field: response_status
          condition: Status is 401, or status is 500 with message containing "jwt expired"
    - id: refresh_success
      from: refreshing
      to: authenticated
      trigger: /auth/refresh endpoint returns new token payload
      guards:
        - field: refresh_response
          condition: Response contains userData with valid _id and accessToken
      effects:
        - Store new token in memory and user cookie
        - Broadcast TOKEN_REFRESHED to waiting tabs
        - Release cross-tab refresh lock
    - id: refresh_failure
      from: refreshing
      to: anonymous
      trigger: /auth/refresh fails, times out (10s), or returns error
      effects:
        - Clear in-memory session
        - Clear user cookie
        - Redirect to /login
        - Release cross-tab refresh lock
    - id: logout_initiated
      from: authenticated
      to: logging_out
      trigger: User clicks logout or clearToken() called
      effects:
        - Broadcast logout event to other tabs
        - Clear in-memory session
        - Clear user profile cookie
    - id: logout_broadcast_received
      from: authenticated
      to: anonymous
      trigger: Another tab broadcasts logout event
      guards:
        - field: current_route
          condition: On protected route (/companies or /reports)
      effects:
        - Clear in-memory session
        - Clear user profile cookie
        - Redirect to /login with base path preserved
    - id: logout_broadcast_received_unprotected
      from: authenticated
      to: anonymous
      trigger: Another tab broadcasts logout event
      guards:
        - field: current_route
          condition: NOT on protected route
      effects:
        - Clear in-memory session
        - Clear user profile cookie
        - No redirect (page stays)

conditions:
  - id: csrf-token-missing
    description: >
      For state-changing requests (POST, PATCH, DELETE), if the CSRF token is
      absent from the cookie, trigger a proactive token refresh to obtain a
      fresh CSRF token before sending the request.
    trigger: State-changing API request initiated without existing x-csrf-token header
    guards:
      - field: request_method
        condition: Method is POST, PATCH, or DELETE (not GET/HEAD)
      - field: csrf_token
        condition: No csrfToken cookie value found
      - field: already_retried
        condition: Not already retried after refresh (retriedAfterRefresh is false)
      - field: is_refresh_endpoint
        condition: Request path is NOT /auth/refresh
    then:
      - Call refreshAccessToken() to obtain fresh CSRF token via refresh response
      - Re-read csrfToken cookie after successful refresh
      - Attach x-csrf-token header if token now present
    else:
      - Attach existing csrfToken cookie value as x-csrf-token header

  - id: csrf-failure-retry
    description: >
      When a request fails with 403 and a CSRF-related error message, retry the
      request after refreshing the token. Use the CSRF token from the refresh
      response if available, otherwise clear stale headers to force re-read.
    trigger: API response returns 403 with message containing "csrf"
    guards:
      - field: response_status
        condition: Status is 403
      - field: response_message
        condition: Message contains "csrf" (case-insensitive)
      - field: already_retried
        condition: Not already retried after refresh
    then:
      - Call refreshAccessToken() to get new token + CSRF token
      - If refresh succeeds: retry request with new token and CSRF token from refresh response
      - If CSRF token not in refresh response: clear stale x-csrf-token headers to force re-read
    else:
      - Do not retry; return error result

  - id: cross-tab-refresh-lock
    description: >
      When a tab needs to refresh, it acquires a localStorage-based lock.
      If another tab holds the lock (< 10s old), this tab waits for the
      result via BroadcastChannel/localStorage polling (8s timeout).
      Lock auto-expires after 10s to prevent deadlocks.
    trigger: refreshAccessToken() called while another tab may be refreshing
    guards:
      - field: lock_holder
        condition: localStorage lock key exists and is less than 10 seconds old
    then:
      - Wait for TOKEN_REFRESHED result via crossTab.waitForResult() with 8s timeout
      - If result received with success=true: apply token from other tab
      - If timeout or failure: attempt to acquire lock again and proceed with own refresh
    else:
      - Acquire lock and perform refresh directly

  - id: login-broadcast-redirect
    description: >
      When a login broadcast is received from another tab, redirect to /companies
      only if the current page is the login page. Otherwise, just refresh auth state.
    trigger: Login broadcast received from another tab
    guards:
      - field: current_path
        condition: Path includes "/login"
    then:
      - Redirect to /companies (with base path preserved)
      - Call login callback to refresh auth state
    else:
      - Do not redirect
      - Call login callback to refresh auth state

inputs:
  - id: login_credentials
    type: "object with email and password fields"
    source: "user login form submission"
    required: true
    validation:
      email: "non-empty string"
      password: "non-empty string"

  - id: refresh_cookie
    type: "HTTP-only refreshToken cookie"
    source: "browser cookie jar (set by backend on login/refresh)"
    required: true
    validation:
      format: "JWT (validated by backend)"

  - id: csrf_cookie
    type: "csrfToken cookie value"
    source: "browser cookie jar (set by backend on login/refresh)"
    required: false
    validation:
      min_length: "10 characters for valid token"

  - id: user_cookie
    type: "JSON-encoded user profile cookie"
    source: "browser cookie jar (set by frontend on login)"
    required: false
    validation:
      format: "JSON with _id, email, accessToken fields"

  - id: cross_tab_event
    type: "BroadcastChannel message or localStorage storage event"
    source: "other browser tab"
    required: false
    validation:
      event_types: ["logout", "login", "TOKEN_REFRESHED"]

outputs:
  - id: session_token
    type: "JWT access token string"
    destination: "in-memory JavaScript variable (authSession)"
    lifespan: "session (cleared on logout or tab close)"

  - id: user_cookie_output
    type: "JSON-encoded user profile"
    destination: "browser cookie named 'user'"
    lifespan: "7 days"

  - id: auth_header
    type: "Authorization: Bearer {accessToken} header"
    destination: "HTTP request headers on all API calls"
    lifespan: "per-request"

  - id: user_id_header
    type: "userId header"
    destination: "HTTP request headers on all API calls"
    lifespan: "per-request"

  - id: csrf_header
    type: "x-csrf-token header"
    destination: "HTTP request headers on state-changing requests"
    lifespan: "per-request"

  - id: refresh_result_broadcast
    type: "TOKEN_REFRESHED event with token payload"
    destination: "BroadcastChannel + localStorage (eoyt-refresh-result key)"
    lifespan: "500ms (auto-cleaned)"

  - id: logout_broadcast_output
    type: "logout event with timestamp"
    destination: "BroadcastChannel + localStorage (eoyt-logout-{timestamp} key)"
    lifespan: "100ms (auto-cleaned)"

  - id: login_broadcast_output
    type: "login event with timestamp"
    destination: "BroadcastChannel + localStorage (eoyt-login-{timestamp} key)"
    lifespan: "100ms (auto-cleaned)"

evidence_refs:
  - path: src/features/auth/api/authMemorySession.js
    snippet: |
      let authSession = null;
      let logoutListenerInitialized = false;
      let loginListenerInitialized = false;

      function normalizeSessionPayload(candidate) {
        if (!isPlainObject(candidate)) {
          return null;
        }
        const userId = normalizeOptionalString(candidate._id).trim();
        const accessToken = normalizeOptionalString(candidate.accessToken).trim();
        if (!userId || !accessToken) {
          return null;
        }
        const email = normalizeOptionalString(candidate.email);
        return {
          _id: userId,
          email,
          accessToken,
          user: { ...candidate, _id: userId, email, accessToken },
        };
      }

      export function setAuthSession(candidate) {
        const normalized = normalizeSessionPayload(candidate);
        authSession = normalized;
        return authSession;
      }

      export function getAuthSession() {
        return authSession;
      }

      export function clearAuthSession() {
        authSession = null;
      }
    covers:
      - "state:authenticated"
      - "state:anonymous"
      - "transition:login_success"
      - "transition:refresh_success"
      - "transition:logout_initiated"
      - "output:session_token"
    line_range:
      start: 42
      end: 105

  - path: src/features/auth/api/authMemorySession.js
    snippet: |
      function initLogoutListenerLazy(callbacks = {}) {
        if (typeof window === "undefined") return;
        if (logoutListenerInitialized) return;
        logoutListenerInitialized = true;
        import("../lib/authBroadcast")
          .then(({ initLogoutListener }) => {
            initLogoutListener(() => {
              clearAuthSession();
              if (typeof callbacks.onLogout === "function") {
                callbacks.onLogout();
              }
            });
          })
          .catch((error) => {
            logoutListenerInitialized = false;
          });
      }

      export function initAuthSessionListeners(callbacks = {}) {
        if (typeof window === "undefined") return;
        initLogoutListenerLazy(callbacks);
        initLoginListenerLazy(callbacks);
      }
    covers:
      - "condition:cross-tab-refresh-lock"
      - "transition:logout_broadcast_received"
    line_range:
      start: 107
      end: 187

  - path: src/features/auth/api/tokenService.js
    snippet: |
      export function setToken(tokenPayload) {
        const normalized = setAuthSession(tokenPayload);
        if (!normalized) return;
        setBrowserUserCookie(normalized);
        broadcastAuthChange("login");
      }

      export function clearToken() {
        broadcastAuthChange("logout");
        clearAuthSession();
        clearBrowserUserCookie();
      }

      export function applyAuthHeaders(baseHeaders = {}, tokenPayload) {
        const headers = { ...baseHeaders };
        if (!tokenPayload || typeof tokenPayload.accessToken !== "string"
            || tokenPayload.accessToken.length === 0) {
          return headers;
        }
        headers.Authorization = `Bearer ${tokenPayload.accessToken}`;
        if (typeof tokenPayload._id === "string" && tokenPayload._id.length > 0) {
          headers.userId = tokenPayload._id;
        }
        return headers;
      }
    covers:
      - "transition:login_success"
      - "transition:logout_initiated"
      - "output:auth_header"
      - "output:user_id_header"
      - "output:user_cookie_output"
    line_range:
      start: 200
      end: 261

  - path: src/features/auth/api/tokenService.js
    snippet: |
      // Cookie Contract
      // | Cookie      | Value                | HttpOnly | SameSite | TTL   |
      // |-------------|----------------------|----------|----------|-------|
      // | user        | JSON-encoded profile | No       | Lax      | 7 days|
      // | csrfToken   | Random token         | No       | Lax      | 7 days|
      // | refreshToken| JWT refresh token    | Yes      | Lax      | backend|

      export const USER_COOKIE_KEY = "user";
      export const USER_COOKIE_TTL_DAYS = 7;

      function setBrowserUserCookie(tokenPayload) {
        if (typeof document === "undefined") return;
        if (!tokenPayload || typeof tokenPayload._id !== "string" || !tokenPayload.accessToken) return;
        const cookieValue = JSON.stringify({
          _id: tokenPayload._id,
          email: tokenPayload.email || "",
          accessToken: tokenPayload.accessToken,
        });
        document.cookie = createCookieString(USER_COOKIE_KEY, cookieValue, USER_COOKIE_TTL_DAYS, {
          path: "/", sameSite: "Lax",
        });
      }
    covers:
      - "output:user_cookie_output"
      - "input:user_cookie"
    line_range:
      start: 1
      end: 198

  - path: src/features/auth/api/tokenRefresher.js
    snippet: |
      const REFRESH_LOCK_KEY = "eoyt-refresh-lock";
      const REFRESH_RESULT_KEY = "eoyt-refresh-result";
      const LOCK_TIMEOUT_MS = 10000;

      function acquireRefreshLock() {
        if (typeof window === "undefined") return true;
        try {
          const now = Date.now();
          const existing = localStorage.getItem(REFRESH_LOCK_KEY);
          if (existing) {
            const { timestamp } = JSON.parse(existing);
            if (now - timestamp < LOCK_TIMEOUT_MS) {
              return false; // Another tab holds lock
            }
          }
          localStorage.setItem(REFRESH_LOCK_KEY, JSON.stringify({ timestamp: now, tabId: getTabId() }));
          return true;
        } catch (error) {
          return true; // Proceed if localStorage fails
        }
      }

      function releaseRefreshLock() {
        if (typeof window === "undefined") return;
        try {
          localStorage.removeItem(REFRESH_LOCK_KEY);
        } catch (error) { /* ignore */ }
      }
    covers:
      - "condition:cross-tab-refresh-lock"
      - "transition:refresh_success"
      - "transition:refresh_failure"
    line_range:
      start: 48
      end: 113

  - path: src/features/auth/api/tokenRefresher.js
    snippet: |
      export async function refreshAccessToken(options = {}) {
        if (isRefreshing || refreshPromise) {
          return refreshPromise || Promise.resolve({ success: false, error: "Refresh in progress", token: null });
        }
        const { apiClient } = options;
        isRefreshing = true;
        refreshPromise = performCoordinatedRefresh(apiClient).finally(() => {
          isRefreshing = false;
          refreshPromise = null;
        });
        return refreshPromise;
      }

      async function performCoordinatedRefresh(apiClient) {
        const hasLock = acquireRefreshLock();
        if (!hasLock) {
          const { waitForResult } = await getCrossTab();
          const result = await waitForResult({
            storageKey: REFRESH_RESULT_KEY,
            eventType: "TOKEN_REFRESHED",
            timeoutMs: 8000,
          });
          if (result && result.success) {
            setToken(result.token);
            return result;
          }
          // Fallback: try to acquire lock again
          if (!acquireRefreshLock()) { /* proceed with caution */ }
        }
        try {
          const result = await performRefresh(apiClient);
          if (result.success) {
            const { broadcastMessage } = await getCrossTab();
            broadcastMessage({
              eventType: "TOKEN_REFRESHED",
              data: result,
              storageKey: REFRESH_RESULT_KEY,
              cleanupMs: 500,
            });
          }
          return result;
        } finally {
          releaseRefreshLock();
        }
      }
    covers:
      - "state:refreshing"
      - "condition:cross-tab-refresh-lock"
      - "transition:refresh_success"
      - "transition:refresh_failure"
      - "output:refresh_result_broadcast"
    line_range:
      start: 139
      end: 222

  - path: src/features/auth/api/tokenRefresher.js
    snippet: |
      const REFRESH_TIMEOUT_MS = 10000;

      async function performRefresh(apiClient) {
        try {
          const timeoutPromise = new Promise((resolve) => {
            setTimeout(() => resolve({ __timeout: true }), REFRESH_TIMEOUT_MS);
          });
          const result = await Promise.race([
            refreshToken({}, apiClient ? { client: apiClient } : {}),
            timeoutPromise,
          ]);
          if (result && result.__timeout) {
            return { success: false, error: `Token refresh timed out after ${REFRESH_TIMEOUT_MS}ms`, token: null };
          }
          // ... validate response, extract newTokenPayload, csrfToken
          setToken(newTokenPayload);
          return { success: true, token: newTokenPayload, csrfToken, message: raw?.message || "Token refreshed successfully" };
        } catch (error) {
          return { success: false, error: error?.message || "Token refresh error", token: null };
        }
      }
    covers:
      - "transition:refresh_success"
      - "transition:refresh_failure"
    line_range:
      start: 224
      end: 296

  - path: src/features/auth/api/csrfHelper.js
    snippet: |
      const CSRF_COOKIE_NAME = "csrfToken";
      export const MAX_CSRF_RETRIES = 1;

      export function hasCsrfToken(cookieString) {
        const token = getCsrfToken(cookieString);
        return token !== null && token.length > 0;
      }

      export function isCsrfTokenValid(token) {
        if (typeof token !== "string") return false;
        return token.length >= 10;
      }

      export function getCsrfToken(cookieString) {
        const raw = typeof cookieString === "string"
          ? cookieString
          : typeof document !== "undefined" ? document.cookie : "";
        if (!raw) return null;
        const match = raw.match(new RegExp(`(?:^|;\\s*)${CSRF_COOKIE_NAME}=([^;]*)`));
        if (!match) return null;
        try { return decodeURIComponent(match[1]); }
        catch (_error) { return match[1] || null; }
      }

      export function applyCsrfHeaders(baseHeaders = {}, cookieString) {
        const token = getCsrfToken(cookieString);
        if (!token) return baseHeaders;
        return { ...baseHeaders, "x-csrf-token": token };
      }
    covers:
      - "condition:csrf-token-missing"
      - "condition:csrf-failure-retry"
      - "input:csrf_cookie"
      - "output:csrf_header"
    line_range:
