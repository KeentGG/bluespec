  - path: src/shared/lib/api/apiClient.ts
    snippet: |
      const shouldRetryAfterRefresh =
        !retriedAfterRefresh &&
        !skipRefresh &&
        !isRefreshEndpoint &&
        (Number(result.statusCode ?? result.status) === 401 ||
          (Number(result.statusCode ?? result.status) === 500 &&
            typeof result.message === "string" &&
            result.message.includes("jwt expired")) ||
          isCsrfFailure);

      if (shouldRetryAfterRefresh) {
        const refreshAccessToken = await getRefreshAccessToken();
        const refreshResult = await refreshAccessToken({
          apiClient: { request, get, post, patch, delete: remove },
        });
        if (refreshResult.success && refreshResult.token) {
          const retryOptions = { ...requestOptions, token: refreshResult.token };
          if (isCsrfFailure) {
            const retryHeaders = { ...(retryOptions.headers || {}) };
            if (refreshResult.csrfToken) {
              retryHeaders["x-csrf-token"] = refreshResult.csrfToken;
            } else {
              delete retryHeaders["x-csrf-token"];
              delete retryHeaders["X-CSRF-Token"];
            }
            retryOptions.headers = retryHeaders;
          }
          return executeRequest<T>(retryOptions, { retriedAfterRefresh: true });
        }
        if (!requestOptions.skipAuthErrorHandling) {
          await handleAuthError({ redirectUrl: "/login", reason: "session_expired", skipRedirect: false });
        }
      }
    covers:
      - "state:refreshing"
