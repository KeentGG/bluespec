      export function isRouterReady(router) {
        if (!router || typeof router !== "object") {
          return false;
        }
        if (typeof router.isReady === "boolean") {
          return router.isReady;
        }
        return typeof router.push === "function" || typeof router.replace === "function";
      }

      export function createOneShotGuard() {
        const executedKeys = new Set();

        function shouldRun(intentKey = "default") {
          const normalizedKey = normalizeIntentKey(intentKey);
          if (executedKeys.has(normalizedKey)) {
            return false;
          }
          executedKeys.add(normalizedKey);
          return true;
        }

        function runOnce(intentKey = "default", callback = () => undefined) {
          if (!shouldRun(intentKey)) {
            return { didRun: false, reason: "duplicate_intent", value: undefined };
          }
          return { didRun: true, reason: null, value: callback() };
        }

        return { shouldRun, runOnce, hasRun, reset };
      }

      export function runOnceWhenRouterReady({ router, guard, intentKey = "default", callback = () => undefined }) {
        if (!isRouterReady(router)) {
          return { didRun: false, reason: "router_not_ready", value: undefined };
        }
        return guard.runOnce(intentKey, callback);
      }
    covers:
      - "condition:one-shot-guard-edit"
