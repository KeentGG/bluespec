  - path: src/shared/lib/routing/gate-new-contract.js
    snippet: |
      export function validateGateNewEntry(options = {}) {
        const {
          query = {},
          currentOrigin = "",
          referrer = "",
          allowedOrigins = [],
          allowedReferrerPathPrefixes = GATE_NEW_ALLOWED_REFERRER_PATH_PREFIXES,
        } = options;

        const gateQuery = validateGateQuery(query);
        if (!gateQuery.isValid) {
          return {
            isValid: false, reason: gateQuery.reason, gateQuery,
            currentOrigin: null, referrerOrigin: null, referrerPath: null,
            referrerState: "invalid_query",
            allowedOrigins: resolveGateNewAllowedOrigins({ currentOrigin, allowedOrigins }),
          };
        }

        const resolvedAllowedOrigins = resolveGateNewAllowedOrigins({ currentOrigin, allowedOrigins });
        const normalizedCurrentOrigin = normalizeOrigin(currentOrigin);

        if (!normalizedCurrentOrigin || !resolvedAllowedOrigins.includes(normalizedCurrentOrigin)) {
          return {
            isValid: false, reason: "blocked_origin", gateQuery,
            currentOrigin: normalizedCurrentOrigin, referrerOrigin: null,
            referrerPath: null, referrerState: "blocked",
            allowedOrigins: resolvedAllowedOrigins,
          };
        }

        const normalizedReferrer = normalizeString(referrer);
        if (!normalizedReferrer) {
          return {
            isValid: true, reason: null, gateQuery,
            currentOrigin: normalizedCurrentOrigin, referrerOrigin: null,
            referrerPath: null, referrerState: "missing",
            allowedOrigins: resolvedAllowedOrigins,
          };
        }

        let parsedReferrer = null;
        try {
          parsedReferrer = new URL(normalizedReferrer);
        } catch (_error) {
          parsedReferrer = null;
        }

        if (!parsedReferrer) {
          return {
            isValid: false, reason: "invalid_referrer", gateQuery,
            currentOrigin: normalizedCurrentOrigin, referrerOrigin: null,
            referrerPath: null, referrerState: "invalid",
            allowedOrigins: resolvedAllowedOrigins,
          };
        }

        const referrerOrigin = normalizeOrigin(parsedReferrer.origin);
        if (!referrerOrigin || !resolvedAllowedOrigins.includes(referrerOrigin)) {
          return {
            isValid: false, reason: "blocked_referrer_origin", gateQuery,
            currentOrigin: normalizedCurrentOrigin, referrerOrigin,
            referrerPath: parsedReferrer.pathname, referrerState: "blocked",
            allowedOrigins: resolvedAllowedOrigins,
          };
        }

