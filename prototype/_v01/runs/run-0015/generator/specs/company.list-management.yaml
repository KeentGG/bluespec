    snippet: |
      export function createCompanySearchDebouncer(onDebouncedSearch, options = {}) {
        if (typeof onDebouncedSearch !== "function") {
          throw new TypeError("onDebouncedSearch must be a function.");
        }

        const delayMs = normalizeDebounceDelay(options.delayMs);
        const schedule =
          typeof options.schedule === "function"
            ? options.schedule
            : (callback, delay) => setTimeout(callback, delay);
        const cancelSchedule =
          typeof options.cancelSchedule === "function"
            ? options.cancelSchedule
            : (timerId) => clearTimeout(timerId);

        let timerId = null;
        let latestSearchQuery = "";

        function debounceSearch(nextSearchQuery) {
          latestSearchQuery = normalizeSearchQuery(nextSearchQuery);
          clearPendingTimer();
          timerId = schedule(() => {
            emitLatestSearchQuery();
          }, delayMs);
          return latestSearchQuery;
        }

        debounceSearch.cancel = () => {
          clearPendingTimer();
          return latestSearchQuery;
        };
        debounceSearch.flush = () => {
          if (timerId === null) {
            return null;
          }
          clearPendingTimer();
          return emitLatestSearchQuery();
        };

        return debounceSearch;
      }
    covers:
      - "transition:debounce_fired"
      - "condition:search-debounce-tracking"
      - "input:search_input"
