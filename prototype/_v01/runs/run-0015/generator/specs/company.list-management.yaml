confidence_rationale: >
  All three discovered behaviors are fully evidenced across 5 source files with
  direct code snippets. SWR-based fetching confirmed in useCompanyListQuery.ts
  with query key composition and SWR options. Debounce mechanism confirmed in
  useCompaniesPage.ts and list-contract.js with 300ms delay, timer management,
  and cancel/flush support. Logo error tracking confirmed with idempotent guard
  and reset-on-fetch behavior. List state machine (loading/ready/empty-search/
  empty-dataset) confirmed in list-contract.js toListStateId. Rollback gate
  check confirmed in useCompaniesPage.ts mount effect. API contract confirmed in
  list-service.js with multi-key collection resolution and endpoint construction.
  Deducted 0.12 because: (1) the actual CompaniesTable and CompanyModals
  component internals are not in scope (only their props), (2) the
  useCompanyUrlEntry hook implementation is not in these files, (3) the
  resolveRollbackRouteContract and resolveBrowserStorage implementations are
  external, (4) the fetchCompanyListRuntime error handling paths reference
  apiClient internals not fully visible here.

