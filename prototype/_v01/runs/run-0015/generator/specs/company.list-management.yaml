      function toListStateId({ isLoading, hasRows, hasSearchQuery }) {
        if (isLoading) {
          return "loading";
        }

        if (hasRows) {
          return "ready";
        }

        return hasSearchQuery ? "empty-search" : "empty-dataset";
      }

      export function resolveCompanyListContract(options = {}) {
        const isLoading = options.isLoading === true;
        // ...
        const state = toListStateId({
          isLoading,
          hasRows: visibleRows.length > 0,
          hasSearchQuery: request.searchKey !== null,
        });

        return {
          rows: visibleRows,
          counts: { total: normalizedRows.length, visible: visibleRows.length },
          ui: {
            showSkeleton: state === "loading",
            showTable: state === "ready",
            showNoResults: state === "empty-search",
            showOnboardingEmpty: state === "empty-dataset",
          },
        };
      }
    covers:
