      const companyListQuery = useCompanyListQuery({
        debouncedSearchQuery,
        sortBy,
        sortOrder,
      });

      const refetchList = useCallback(async () => {
        await companyListQuery.revalidate();
      }, [companyListQuery]);

      useEffect(() => {
        const result = companyListQuery.data;
        if (!result) {
          return;
        }

        if (result.ok) {
          const businesses = Array.isArray(result.businesses)
            ? (result.businesses as readonly CompanyRecord[])
            : EMPTY_COMPANY_LIST;

          setCompanyList(businesses);
          setLogoLoadFailuresByBusinessId(Object.create(null));
          setRuntimeErrorMessage("");
          return;
        }

        setCompanyList(EMPTY_COMPANY_LIST);
        if (result.reason !== "aborted") {
          setRuntimeErrorMessage(result.message || "Unable to load companies.");
        }
      }, [companyListQuery.data]);
