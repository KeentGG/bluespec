    snippet: |
      const COMPANY_LIST_COLLECTION_KEYS = Object.freeze([
        "businesses",
        "businessList",
        "companies",
        "items",
        "rows",
        "results",
      ]);

      function resolveBusinessCollection(candidate, depth = 0) {
        if (Array.isArray(candidate)) {
          return candidate;
        }

        if (!isPlainObject(candidate) || depth > 4) {
          return null;
        }

        for (const key of COMPANY_LIST_COLLECTION_KEYS) {
          if (Array.isArray(candidate[key])) {
            return candidate[key];
          }
        }

        if (Object.prototype.hasOwnProperty.call(candidate, "data")) {
          const nested = resolveBusinessCollection(candidate.data, depth + 1);
          if (nested) {
            return nested;
          }
        }

        if (Object.prototype.hasOwnProperty.call(candidate, "payload")) {
          const nested = resolveBusinessCollection(candidate.payload, depth + 1);
          if (nested) {
            return nested;
          }
        }

        return null;
      }
    covers:
      - "output:company_list"
      - "transition:data_received"
    line_range:
