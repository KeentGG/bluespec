id: company.list-management
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: company-list-fetching
    coverage: full
    notes: >
      Company list fetched via SWR with query key composed of userId, debounced
      search query, sortBy, and sortOrder. Endpoint is GET /businesses/user/:userId
      with searchKey, sortBy, sortOrder as query params. Response normalized through
      multi-key collection resolution (businesses, businessList, companies, items,
      rows, results) with recursive data/payload unwrapping. SWR configured with
      keepPreviousData=false, revalidateOnMount=true, shouldRetryOnError=false.
      Query disabled when userId is absent.
  - id: company-search-debounce
    coverage: full
    notes: >
      300ms debounce on search input before sending to API. Debouncer created via
      createCompanySearchDebouncer with configurable delay (default 300ms). Tracks
      pending state by comparing trimmed searchQuery vs debouncedSearchQuery. Timer
      cancelled on component unmount. Debouncer supports cancel, flush, and pending
      introspection.
  - id: company-logo-error-handling
    coverage: full
    notes: >
      Per-business logo load failure tracking via logoLoadFailuresByBusinessId state
      (Record<string, boolean>). On logo error, businessId is marked as failed with
      idempotent guard (skip if already true). Failures reset on successful data
      fetch. Failed business IDs passed to CompaniesTable for fallback UI rendering.

description: >
  Manages the company list page: fetching, searching, sorting, and error handling.
  Company data is fetched via SWR from GET /businesses/user/:userId with server-side
  search and sort. Search input is debounced at 300ms before triggering API calls.
  Sort supports four options (A-Z, Z-A, Last Updated ascending/descending) with
  updatedAt:desc as default. Logo load failures are tracked per business ID and
  reset on each successful fetch. The list resolves into four visual states:
  loading, ready, empty-search, or empty-dataset. A rollback gate check runs on
  mount to redirect to v1 if a threshold is breached. URL entry parameters can
  auto-open add or create-report modals.

state_machine:
  initial: idle
  states:
    - id: idle
      description: Initial state before any data fetch or user interaction.
    - id: loading
      description: >
        Data fetch in progress or search debounce pending. SWR isLoading=true
        or searchQuery differs from debouncedSearchQuery.
    - id: ready
      description: >
        Company list loaded with one or more businesses. Table is visible with
        rows, sort controls, and search input.
    - id: empty-search
      description: >
        Data loaded but no businesses match the current search query.
        Shows "no results" message.
    - id: empty-dataset
      description: >
        Data loaded but user has zero companies. Shows onboarding/empty state
        with add company prompt.
  transitions:
    - id: fetch_initiated
      from: idle
      to: loading
      trigger: Component mounts or SWR revalidates
      guards:
        - field: user_id
          condition: Token contains valid non-empty _id string
      effects:
        - SWR issues GET /businesses/user/:userId with sort params
    - id: data_received
      from: loading
      to: ready
      trigger: SWR returns successful response with businesses array
      guards:
        - field: result_ok
          condition: result.ok is true AND businesses array length > 0
      effects:
        - Set companyList state with normalized businesses
        - Reset logoLoadFailuresByBusinessId to empty object
        - Clear runtimeErrorMessage
    - id: data_received_empty_search
      from: loading
      to: empty-search
      trigger: SWR returns successful response with zero businesses and search active
      guards:
        - field: result_ok
          condition: result.ok is true AND businesses array length === 0
        - field: has_search
          condition: debouncedSearchQuery is non-empty
      effects:
        - Set companyList to empty array
        - Clear runtimeErrorMessage
    - id: data_received_empty_dataset
      from: loading
      to: empty-dataset
      trigger: SWR returns successful response with zero businesses and no search
      guards:
        - field: result_ok
          condition: result.ok is true AND businesses array length === 0
        - field: has_search
          condition: debouncedSearchQuery is empty
      effects:
        - Set companyList to empty array
        - Clear runtimeErrorMessage
    - id: fetch_failed
      from: loading
      to: idle
      trigger: SWR returns error response
      guards:
        - field: result_ok
          condition: result.ok is false AND result.reason is not "aborted"
      effects:
        - Set companyList to empty array
        - Set runtimeErrorMessage to result.message or "Unable to load companies."
    - id: search_input_changed
      from: ready
      to: loading
      trigger: User types in search input
      effects:
        - Update searchQuery state immediately
        - Schedule debounced search (300ms)
    - id: debounce_fired
      from: loading
      to: loading
      trigger: 300ms debounce timer expires
      effects:
        - Update debouncedSearchQuery state
        - SWR revalidates with new search key
    - id: sort_changed
      from: ready
      to: loading
      trigger: User selects different sort option
      effects:
        - Update sortBy and sortOrder state
        - SWR revalidates with new sort params
    - id: rollback_redirect
      from: idle
      to: idle
      trigger: Rollback gate check on mount
      guards:
        - field: should_redirect
          condition: resolveRollbackRouteContract returns shouldRedirect=true
      effects:
        - window.location.replace to rollback destination with base path

conditions:
  - id: rollback-gate-check
    description: >
      On mount, checks rollback gate status via resolveRollbackRouteContract.
      If threshold is breached, redirects to v1 fallback route using
      window.location.replace (hard navigation, no history entry).
    trigger: Component mount (useEffect with empty deps)
    guards:
      - field: should_redirect
        condition: rollbackRoute.shouldRedirect is true
      - field: destination
        condition: rollbackRoute.destination is non-empty string
      - field: not_already_on_destination
        condition: window.location.pathname !== rollbackDestination
    then:
      - Compute rollbackDestination with withBasePath()
      - Execute window.location.replace(rollbackDestination)
    else:
      - No redirect, proceed with normal page load

  - id: search-debounce-tracking
    description: >
      Tracks whether a search debounce is pending by comparing trimmed
      searchQuery against trimmed debouncedSearchQuery. When they differ,
      isLoading includes the debouncing flag to show loading state.
    trigger: User types in search input
    guards:
      - field: search_query_trimmed
        condition: searchQuery.trim() !== debouncedSearchQuery.trim()
    then:
      - isDebouncingSearch becomes true
      - isLoading becomes true (shows skeleton/spinner)
    else:
      - isDebouncingSearch becomes false
      - isLoading depends only on SWR isLoading

  - id: logo-error-idempotent
    description: >
      Logo load errors are tracked per business ID with idempotent guard.
      If a business ID is already marked as failed, the state update is skipped
      to prevent unnecessary re-renders.
    trigger: onCompanyLogoError callback fires from CompaniesTable
    guards:
      - field: business_id
        condition: businessId is non-empty string after trim
      - field: already_failed
        condition: logoLoadFailuresByBusinessId[businessId] is not already true
    then:
      - Set logoLoadFailuresByBusinessId[businessId] = true
    else:
      - Skip state update (return current state reference)

  - id: logo-failures-reset-on-fetch
    description: >
      When a successful data fetch completes, all logo load failures are
      reset to an empty object. This ensures stale failure tracking from
      previous fetches does not persist.
    trigger: companyListQuery.data changes and result.ok is true
    guards:
      - field: result_ok
        condition: result.ok is true
    then:
      - setLogoLoadFailuresByBusinessId(Object.create(null))
    else:
      - No reset (error or abort case)

  - id: url-entry-auto-open
    description: >
      URL entry parameters can trigger auto-opening of modals (add company
      or create report). Handled by useCompanyUrlEntry hook which receives
      loading/data state and callback functions.
    trigger: URL contains query parameters for modal auto-open
    guards:
      - field: has_data
        condition: companyListQuery.data is truthy (data loaded)
      - field: not_loading
        condition: isLoading is false
    then:
      - Call onAutoOpenAddModal or onAutoOpenCreateReport(calculatorId)
      - Clear URL params via clearUrlParams()
    else:
      - Wait for data to load before processing URL params

inputs:
  - id: search_input
    type: string
    source: user search text input field
    required: false
    validation:
      min_length: "0 (empty string allowed)"
      normalization: "trimmed before comparison, normalized via normalizeOptionalString"

  - id: sort_selection
    type: "string in format 'sortBy:sortOrder' (e.g. 'name:asc', 'updatedAt:desc')"
    source: SelectFilter dropdown component
    required: false
    validation:
      allowed_values: ["name:asc", "name:desc", "updatedAt:asc", "updatedAt:desc"]
      fallback: "updatedAt:desc (COMPANY_LIST_DEFAULT_SORT)"

  - id: auth_token
    type: "token object with _id and accessToken fields"
    source: getToken() from auth tokenService
    required: true
    validation:
      user_id: "token._id must be non-empty string for query to be enabled"

  - id: rollback_env
    type: "process.env object"
    source: Next.js environment variables
    required: false
    validation:
      checked_by: "resolveRollbackRouteContract"

  - id: browser_storage
    type: "localStorage wrapper via resolveBrowserStorage()"
    source: browser localStorage
    required: false
    validation:
      used_for: "rollback gate state persistence"

outputs:
  - id: company_list
    type: "readonly array of CompanyRecord objects"
    destination: "React state (companyList), passed to CompaniesTable"
    lifespan: "session (reset on new fetch or component unmount)"

  - id: list_state
    type: "resolved view model with rows, counts, ui flags"
    destination: "CompaniesTable component props"
    lifespan: "derived from companyList + search + sort + loading state"
    fields:
      rows: "normalized company rows with businessId, name, reportCount, logoUrl, navigation"
      counts: "{ total, visible }"
      ui: "{ showSkeleton, showTable, showNoResults, showOnboardingEmpty }"

  - id: logo_load_failures
    type: "Record<string, boolean> mapping businessId to failure status"
    destination: "CompaniesTable component for fallback avatar rendering"
    lifespan: "per-fetch (reset on successful data load)"

  - id: runtime_error_message
    type: "string error message"
    destination: "CompaniesTable component for error display"
    lifespan: "per-fetch (cleared on successful data load)"

  - id: sort_options
    type: "frozen array of sort option objects"
    destination: "SelectFilter component for sort dropdown"
    lifespan: "static (module-level constant)"

  - id: create_report_cta
    type: "{ disabled: boolean } contract"
    destination: "New Report button disabled state"
    lifespan: "derived from listState.counts.total"

  - id: api_request
    type: "GET /businesses/user/:userId with query params"
    destination: "Backend API via apiClient.get()"
    lifespan: "per-fetch (SWR managed)"
    params:
      searchKey: "debounced search query or null"
      sortBy: "name or updatedAt"
      sortOrder: "asc or desc"

