  - path: src/shared/lib/qfm/pdfLifecycle.js
    snippet: |
      function beginPolling(input = {}) {
        const nextPdfKey = normalizePdfKey(input.pdfKey ?? input.key);
        if (!nextPdfKey) {
          return createTransitionResult({
            ok: false,
            reason: "missing_pdf_key",
            state,
            activePdfKey,
          });
        }

        if (activePdfKey && state === QFM_PDF_STATES.WAITING) {
          return createTransitionResult({
            ok: false,
            reason: nextPdfKey === activePdfKey ? "duplicate_poller_active" : "poller_already_active",
            state,
            activePdfKey,
          });
        }

        activePdfKey = nextPdfKey;
        state = QFM_PDF_STATES.WAITING;
        publicUrl = null;

        return createTransitionResult({
          ok: true,
          reason: "poller_started",
          state,
          activePdfKey,
          cleanup: [],
        });
      }
    covers:
      - "transition:begin_polling"
      - "condition:duplicate-poller-guard"
      - "input:pdf_key"
    line_range:
      start: 128
      end: 159

  - path: src/shared/lib/qfm/pdfLifecycle.js
    snippet: |
      function transitionStatus(input = {}) {
        if (!activePdfKey) {
          return createTransitionResult({
            ok: false,
            reason: "no_active_poller",
            state,
            activePdfKey,
          });
        }

        const normalizedStatus = normalizePdfState(input.status ?? input.state);
        const nextPublicUrl = normalizeString(input.publicUrl ?? input.url);

        if (!normalizedStatus) {
          state = QFM_PDF_STATES.FAILED;
          publicUrl = null;
          const cleanup = resolveTerminalCleanupInstructions();
          activePdfKey = null;

          return createTransitionResult({
            ok: false,
            reason: "unknown_status_failed",
            state,
            terminal: true,
            shouldRetry: true,
            cleanup,
          });
        }

        if (normalizedStatus === QFM_PDF_STATES.WAITING) {
          state = QFM_PDF_STATES.WAITING;

          return createTransitionResult({
            ok: true,
            reason: "polling_in_progress",
            state,
            activePdfKey,
          });
        }

        if (normalizedStatus === QFM_PDF_STATES.FINISHED) {
          if (!nextPublicUrl) {
            state = QFM_PDF_STATES.FAILED;
            publicUrl = null;
            const cleanup = resolveTerminalCleanupInstructions();
            activePdfKey = null;

            return createTransitionResult({
              ok: false,
              reason: "finished_missing_public_url",
              state,
              terminal: true,
              shouldRetry: true,
              cleanup,
            });
          }

          state = QFM_PDF_STATES.FINISHED;
          publicUrl = nextPublicUrl;
          const cleanup = resolveTerminalCleanupInstructions();
          activePdfKey = null;

          return createTransitionResult({
            ok: true,
            reason: "polling_finished",
            state,
            terminal: true,
            shouldRetry: false,
            publicUrl,
            cleanup,
          });
        }

        state = QFM_PDF_STATES.FAILED;
        publicUrl = null;
        const cleanup = resolveTerminalCleanupInstructions();
        activePdfKey = null;

        return createTransitionResult({
          ok: false,
          reason: "polling_failed",
          state,
          terminal: true,
          shouldRetry: true,
          cleanup,
        });
      }
    covers:
      - "transition:polling_in_progress"
      - "transition:polling_finished"
      - "transition:polling_failed"
      - "condition:unknown-status-fails"
      - "condition:finished_requires_url"
    line_range:
      start: 161
      end: 247

