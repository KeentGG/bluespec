  - path: src/features/pdf/api/pdf-service.ts
    snippet: |
      export async function startPdfGeneration(
        { userId, reportId, email }: PdfGenerationParams,
        options?: { client?: ReturnType<typeof createDefaultApiClient> }
      ) {
        const client = getClient(options);
        return client.post({
          path: `/calculator-reports-pdf/start-generate-pdf/${userId}/user/${reportId}/report`,
          body: email ? { email } : null,
        });
      }

      export async function getPdfStatus(
        { userId }: PdfStatusParams,
        options?: { client?: ReturnType<typeof createDefaultApiClient> }
      ) {
        const client = getClient(options);
        return client.get({
          path: `/calculator-reports-pdf/user/${userId}/status`,
        });
      }

      export function getPdfDownloadUrl(apiBaseUrl: string, publicUrl: string, toolId: string): string {
        const baseUrl = apiBaseUrl.replace(/\/+$/, "");
        const encodedSource = encodeURIComponent(publicUrl);
        const encodedId = encodeURIComponent(toolId);
        return `${baseUrl}/calculator-reports/get-file?source=${encodedSource}&id=${encodedId}`;
      }
    covers:
      - "transition:begin_polling"
      - "transition:polling_in_progress"
      - "input:backend_status_response"
      - "output:pdf_download_url"
    line_range:
      start: 26
      end: 52

