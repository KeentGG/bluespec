  - path: src/features/pdf/store/useDownloadStore.ts
    snippet: |
      startDownload: async ({ userId, reportId, cid, email }) => {
        try {
          // Set generating state first
          get().setIsGenerating(true);
          get().setDlStatus("waiting");
          get().setPdfKey(userId);
          get().setCid(cid);
          get().setCurrentReportId(reportId);
          get().setPublicUrl("");

          // Call API to start generation
          const response = await startPdfGeneration({ userId, reportId, email });

          // Fix: response.data contains userId directly, not nested under .data
          if (response.ok && response.data?.userId) {
            // Generation started successfully
            return true;
          } else {
            // API returned error
            get().setDlStatus("failed");
            return false;
          }
        } catch (error) {
          console.error("Failed to start PDF generation:", error);
          get().setDlStatus("failed");
          return false;
        }
      },
    covers:
      - "transition:begin_polling"
      - "input:pdf_key"
      - "input:report_id"
    line_range:
      start: 107
      end: 134

