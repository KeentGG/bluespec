id: pdf.lifecycle
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: pdf-state-machine
    coverage: full
    notes: >
      Complete state machine documented across pdfLifecycle.js (core logic),
      PdfGenerationOverlay.tsx (UI rendering per state), and useDownloadStore.ts
      (state persistence). Four canonical states: IDLE, WAITING, FINISHED, FAILED.
      Backend status aliases normalized to canonical states. Terminal states trigger
      localStorage cleanup. All transitions and guards confirmed in code.
  - id: pdf-polling-mechanism
    coverage: full
    notes: >
      Polling implemented in PdfGenerationOverlay.tsx via setInterval at 3-second
      intervals with max 60 attempts (3 minutes total). Calls getPdfStatus API
      endpoint. Stops on finished/failed status or max attempts exceeded. The
      pdfLifecycle.js module provides the state machine that the polling drives.
  - id: pdf-user-feedback
    coverage: full
    notes: >
      PdfGenerationOverlay.tsx renders distinct UI for each state: loading animation
      during WAITING, celebration GIF for 5 seconds then download button on FINISHED,
      error message with retry and close buttons on FAILED. Close button hidden during
      WAITING state. Retry sets status back to WAITING to re-trigger polling.

description: >
  Manages the asynchronous PDF report generation lifecycle for a frontend SPA.
  When a user initiates PDF download, the backend queues a generation job and the
  frontend polls for completion. A four-state machine (IDLE, WAITING, FINISHED,
  FAILED) tracks the lifecycle. Backend status strings are normalized to canonical
  states via alias sets. Polling occurs every 3 seconds with a 60-attempt maximum.
  Terminal states trigger localStorage cleanup. The overlay component renders
  distinct UI for each state: loading animation, celebration with download, or
  error with retry. State is persisted to localStorage via Zustand store to survive
  page refreshes.

state_machine:
  initial: idle
  states:
    - id: idle
      description: No PDF generation in progress. User can initiate a download.
    - id: waiting
      description: PDF generation job submitted to backend. Frontend is polling for status.
    - id: finished
      description: PDF generation completed successfully. Download URL available.
    - id: failed
      description: PDF generation failed or timed out. Retry button shown to user.
  transitions:
    - id: begin_polling
      from: idle
      to: waiting
      trigger: User clicks "Download PDF" and startDownload() is called
      guards:
        - field: pdf_key
          condition: Non-empty pdfKey/userId provided
      effects:
        - Set isGenerating=true in Zustand store
        - Set dlStatus="waiting" in Zustand store
        - Persist downloadingpdf="true" and downloadPdfKey to localStorage
        - Call startPdfGeneration API endpoint
    - id: polling_in_progress
      from: waiting
      to: waiting
      trigger: Backend returns status alias in WAITING_ALIASES set (queued, processing, in_progress, waiting)
      effects:
        - Continue polling at 3-second interval
    - id: polling_finished
      from: waiting
      to: finished
      trigger: Backend returns status="finished" or publicUrl is present
      guards:
        - field: public_url
          condition: publicUrl is non-empty string
      effects:
        - Store publicUrl in Zustand store and localStorage
        - Set dlStatus="finished"
        - Trigger terminal cleanup (downloadingpdf=false, remove downloadPdfKey)
    - id: polling_failed
      from: waiting
      to: failed
      trigger: Backend returns status in FAILED_ALIASES set (failed, error) OR status is unrecognizable OR publicUrl missing on finished status
      effects:
        - Set dlStatus="failed"
        - Trigger terminal cleanup (downloadingpdf=false, remove downloadPdfKey)
    - id: max_attempts_exceeded
      from: waiting
      to: failed
      trigger: Polling reaches 60 attempts (3 minutes) without terminal status
      effects:
        - Clear polling interval
        - Set dlStatus="failed"
    - id: retry
      from: failed
      to: waiting
      trigger: User clicks "Try Again" button
      effects:
        - Set dlStatus="waiting" which re-triggers polling useEffect
    - id: reset
      from: finished
      to: idle
      trigger: User clicks close button or download link
      effects:
        - Clear all Zustand store state
        - Remove all PDF-related localStorage keys
    - id: reset_from_failed
      from: failed
      to: idle
      trigger: User clicks "Close" button
      effects:
        - Clear all Zustand store state
        - Remove all PDF-related localStorage keys

conditions:
  - id: duplicate-poller-guard
    description: >
      Prevents starting a new poller when one is already active in WAITING state.
      If the same pdfKey is provided, returns "duplicate_poller_active". If a
      different pdfKey is provided, returns "poller_already_active". Both prevent
      the transition from IDLE to WAITING.
    trigger: beginPolling() called while state is already WAITING
    guards:
      - field: current_state
        condition: State is WAITING and activePdfKey is non-null
    then:
      - Return transition result with ok=false and appropriate reason
      - Do not start new polling
    else:
      - Proceed with transition to WAITING

  - id: unknown-status-fails
    description: >
      When the backend returns a status string that cannot be normalized to any
      canonical state (not in WAITING_ALIASES, FINISHED_ALIASES, or FAILED_ALIASES),
      the state machine treats it as a failure. This is a defensive guard against
      unexpected backend responses.
    trigger: transitionStatus() receives unrecognizable status string
    guards:
      - field: normalized_status
        condition: normalizePdfState() returns null
    then:
      - Set state to FAILED
      - Set terminal=true, shouldRetry=true
      - Trigger terminal cleanup
    else:
      - Process status normally through alias resolution

  - id: finished_requires_url
    description: >
      When the backend reports "finished" but no publicUrl is provided, the state
      machine treats it as a failure. A finished state without a download URL is
      useless to the user.
    trigger: transitionStatus() receives FINISHED status but publicUrl is empty/null
    guards:
      - field: public_url
        condition: normalizedStatus is FINISHED but nextPublicUrl is empty/null
    then:
      - Set state to FAILED
      - Set terminal=true, shouldRetry=true
      - Trigger terminal cleanup
    else:
      - Set state to FINISHED with the publicUrl

  - id: celebration-animation-timer
    description: >
      On FINISHED state, a celebration GIF (Yehey) is shown for 5 seconds before
      replacing with the download button. This provides positive feedback to the
      user before presenting the download action.
    trigger: dlStatus transitions to "finished"
    guards:
      - field: dlStatus
        condition: dlStatus equals "finished"
    then:
      - Set showAnimation=true
      - Start 5-second timer (ANIMATION_DURATION=5000)
      - After timer expires, set showAnimation=false to show download button
    else:
      - Set showAnimation=false

  - id: close-button-visibility
    description: >
      The close (X) button is hidden during the WAITING state to prevent the user
      from dismissing the overlay while polling is active. It is shown in FINISHED
      and FAILED states.
    trigger: Overlay renders based on current dlStatus
    guards:
      - field: dlStatus
        condition: dlStatus is NOT "waiting"
    then:
      - Render close button in top-right corner
    else:
      - Do not render close button

inputs:
  - id: pdf_key
    type: "string (userId or job identifier)"
    source: "useDownloadStore.startDownload() parameter"
    required: true
    validation:
      format: "non-empty string after normalization"

  - id: report_id
    type: "string"
    source: "useDownloadStore.startDownload() parameter"
    required: true
    validation:
      format: "non-empty string"

  - id: calculator_type
    type: "string (cid value: 1-4)"
    source: "useDownloadStore state, set by caller"
    required: false
    validation:
      enum: ["1", "2", "3", "4"]
      mapping:
        "1": "Value-Estimate"
        "2": "Discretionary-Earnings"
        "3": "Value-Gap-Analysis"
        "4": "Net-Proceeds"

  - id: backend_status_response
    type: "API response with status and publicUrl fields"
    source: "GET /calculator-reports-pdf/user/{userId}/status"
    required: true
    validation:
      fields:
        status: "string in WAITING_ALIASES, FINISHED_ALIASES, or FAILED_ALIASES"
        publicUrl: "string URL (required for FINISHED state)"

outputs:
  - id: pdf_download_url
    type: "constructed URL string"
    destination: "browser download link (target=_blank, download attribute)"
    lifespan: "immediate (used once for download)"
    notes: >
      Constructed as: {NEXT_PUBLIC_APP_API_URL}/calculator-reports/get-file?source={publicUrl}&id={tool}

  - id: localStorage_downloadingpdf
    type: "string 'true' or 'false'"
    destination: "window.localStorage key 'downloadingpdf'"
    lifespan: "persists across page refreshes until reset()"

  - id: localStorage_downloadPdfKey
    type: "string (job/user identifier)"
    destination: "window.localStorage key 'downloadPdfKey'"
    lifespan: "persists across page refreshes until terminal state or reset()"

  - id: localStorage_downloadPdfStatus
    type: "string (waiting/finished/failed)"
    destination: "window.localStorage key 'downloadPdfStatus'"
    lifespan: "persists across page refreshes until reset()"

  - id: localStorage_downloadPdfPublicUrl
    type: "string (URL)"
    destination: "window.localStorage key 'downloadPdfPublicUrl'"
    lifespan: "persists across page refreshes until reset()"

  - id: localStorage_downloadPdfCid
    type: "string (calculator type id)"
    destination: "window.localStorage key 'downloadPdfCid'"
    lifespan: "persists across page refreshes until reset()"

  - id: localStorage_downloadPdfReportId
    type: "string (report identifier)"
    destination: "window.localStorage key 'downloadPdfReportId'"
    lifespan: "persists across page refreshes until reset()"

