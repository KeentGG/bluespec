  - path: src/features/pdf/components/PdfGenerationOverlay.tsx
    snippet: |
      useEffect(() => {
        if (!isGenerating || !pdfKey) return;
        if (dlStatus === "finished" || dlStatus === "failed") return;

        let attempts = 0;

        const poll = async () => {
          try {
            const status = await getPdfStatus({ userId: pdfKey });
            const statusData = status?.raw?.data;

            if (statusData?.status === "finished" || statusData?.publicUrl) {
              setDlStatus("finished");
              setPublicUrl(statusData.publicUrl || "#");
              return true;
            }

            if (statusData?.status === "failed" || statusData?.status?.includes("failed")) {
              setDlStatus("failed");
              return true;
            }

            if (status?.raw?.message?.includes("Unknown")) {
              setDlStatus("failed");
              return true;
            }

            return false;
          } catch {
            return false;
          }
        };

        const intervalId = setInterval(async () => {
          attempts++;

          if (attempts >= MAX_ATTEMPTS) {
            clearInterval(intervalId);
            setDlStatus("failed");
            return;
          }

          const shouldStop = await poll();
          if (shouldStop) {
            clearInterval(intervalId);
          }
        }, POLL_INTERVAL);

        return () => clearInterval(intervalId);
      }, [isGenerating, pdfKey, dlStatus, setDlStatus, setPublicUrl]);
    covers:
      - "transition:polling_in_progress"
      - "transition:polling_finished"
      - "transition:polling_failed"
      - "transition:max_attempts_exceeded"
      - "input:backend_status_response"
    line_range:
      start: 108
      end: 157

