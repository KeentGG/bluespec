ecosystem: frontend
prior_context: |
  Main agent exploration notes:
  - JWT access tokens stored in JavaScript memory variable (authMemorySession.js), NOT localStorage
  - Refresh token stored in HTTP-only cookie set by backend (cannot be read by JS)
  - User profile stored in regular cookie for middleware SSR access
  - CSRF token stored in regular cookie, injected as x-csrf-token header
  - Cross-tab coordination via BroadcastChannel with localStorage fallback
  - Token refresh uses localStorage-based mutex to prevent multiple tabs from refreshing
  - AuthSyncBootstrap component initializes cross-tab listeners on mount
  - Token refresh has 10s timeout and broadcasts result to other tabs
  - Login broadcasts to other tabs, logout broadcasts and redirects protected routes
