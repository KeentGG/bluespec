  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/reports/hooks/useReportNavigation.ts
    snippet: |
      export function useReportNavigation() {
        const router = useRouter();

        function navigateToReportGate(
          report: Report,
          options: NavigateToReportOptions = {},
        ) {
          const handoff = resolveGateHandoffRoute({
            intent: "edit",
            target: report?._id,
            calculatorId: report?.calculatorId,
            env: process.env,
            gatePathsByCalculatorId: GATE_PATHS_BY_CALCULATOR_ID,
          });

          if (!handoff.ok || !handoff.destination) {
            toast.error("Unable to open the selected report.");
            if (handoff.fallbackDestination) {
              router.push(handoff.fallbackDestination);
            }
            return;
          }

          if (handoff.destination.startsWith("http")) {
            window.location.replace(handoff.destination);
            return;
          }

          router.push(handoff.destination);
        }
