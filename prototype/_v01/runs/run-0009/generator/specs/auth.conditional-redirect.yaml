  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/queryValidators.js
    snippet: |
      export function validateGateQuery(query) {
        const rawTarget = readQueryValue(query, "target");
        const rawSource = readQueryValue(query, "source");
        const rawName = readQueryValue(query, "name");

        const target = rawTarget?.trim() ?? "";
        if (!target) {
          return {
            isValid: false,
            reason: "missing_target",
            target: null,
            source: null,
            name: null,
            raw: {
              target: rawTarget,
              source: rawSource,
              name: rawName,
            },
          };
        }

        const source = rawSource?.trim() ? rawSource.trim() : null;
        const name = rawName ?? null;

        return {
          isValid: true,
          reason: null,
          target,
          source,
          name,
          raw: {
            target: rawTarget,
            source: rawSource,
            name: rawName,
          },
        };
      }
