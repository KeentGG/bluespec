id: auth.conditional-redirect.yaml
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: auth-conditional-redirect
    coverage: partial
    notes: >
      The live code implements the report-edit handoff and resume redirect, but the
      inspected files contain no agreement-state gate. Redirect behavior is driven by
      query validation, supported calculator IDs, report fetch success, progress-route
      mapping, and rollback/fallback routing.
description: >
  Editing an existing dashboard report resolves a calculator gate handoff, validates
  the /gate/edit request, fetches the report, maps saved progress to a calculator-
  specific resume route, and redirects the user to continue editing. If validation,
  fetch, or route resolution fails, the flow falls back to reports/companies or a
  rollback destination; no agreement-state gate appears in the listed code.
state_machine:
  initial: pending_router
  states:
    - id: pending_router
      description: Router/search params are not yet ready for gate-edit initialization.
    - id: initializing
      description: The flow is validating the request, checking rollback, fetching the report, and resolving the resume route.
    - id: redirecting
      description: A valid calculator gate or resume destination has been selected and navigation is being issued.
    - id: duplicate
      description: The one-shot guard suppressed a repeated resume attempt, so the intent is already processed.
    - id: fallback
      description: The flow cannot safely resume the report and must send the user to a fallback destination.
    - id: error
      description: An initialization exception interrupted the flow before a safe redirect completed.
  transitions:
    - id: router_ready
      from: pending_router
      to: initializing
      trigger: Router becomes ready and the gate-edit effect starts
      effects:
        - Begin rollback check
        - Validate gate-edit query inputs
        - Fetch the report record
    - id: rollback_short_circuit
      from: pending_router
      to: fallback
      trigger: Rollback route contract requests redirect
      guards:
        - field: rollback_enabled
          condition: resolveRollbackRouteContract.shouldRedirect is true and a destination exists
      effects:
        - Replace browser location with the rollback destination
    - id: resume_route_ready
      from: initializing
      to: redirecting
      trigger: Report progress maps to a valid calculator resume route
      guards:
        - field: gate_query
          condition: target is present and calculatorId is supported
        - field: report_progress
          condition: saved progress route maps to a valid calculator route
      effects:
        - Navigate to the calculator gate resume URL
    - id: guard_suppressed_rerun
      from: initializing
      to: duplicate
      trigger: One-shot guard blocks a repeated initialization for the same intent key
      effects:
        - Keep the fallback destination available
        - Render the already-processed resume state
    - id: validation_or_fetch_failure
      from: initializing
      to: fallback
      trigger: Query validation, report fetch, or progress mapping fails
      effects:
        - Navigate to the fallback destination
    - id: unexpected_error
      from: initializing
      to: error
      trigger: Initialization throws unexpectedly
      effects:
        - Route to the fallback destination after marking the error state
conditions:
  - id: edit_handoff_resolves_gate_url
    description: A dashboard report edit intent resolves to the target calculator gate URL before navigation.
    trigger: dashboard report edit action
    guards:
      - field: target
        condition: report._id is present
      - field: calculator_id
        condition: calculatorId maps to a supported calculator gate
      - field: gate_path
        condition: a gate path is available from explicit mapping, env, or default fallback
    then:
      - Resolve the gate handoff route for edit intent
      - Navigate to the calculator gate URL
    else:
      - Show an error toast
      - Push the fallback destination if one exists
  - id: gate_edit_query_requires_target
    description: Gate edit entry refuses to continue without a non-empty target query parameter.
    trigger: /gate/edit initialization
    guards:
      - field: target
        condition: target query trims to a non-empty string
    then:
      - Continue gate edit initialization
    else:
      - Resolve a reports fallback destination and navigate there
  - id: report_resume_uses_saved_progress
    description: The edit/resume flow redirects to a calculator step derived from the report's saved progress route.
    trigger: Report fetch completes
    guards:
      - field: report_progress
        condition: saved progress route is recognized for the report's calculator
    then:
      - Navigate to the mapped calculator resume route
    else:
      - Resolve a fallback destination and navigate there
  - id: rollback_gate_short_circuits_entry
    description: A rollback contract can bypass gate-edit initialization and send the user to the prior dashboard route.
    trigger: /gate/edit page load
    guards:
      - field: rollback_route
        condition: rollback contract requests redirect
    then:
      - Replace browser location with the rollback destination
    else:
      - Continue gate edit initialization
inputs:
  - id: dashboard_report
    type: report object with _id and calculatorId
    source: dashboard report row / selected report
    required: true
  - id: gate_target
    type: report ID string
    source: gate-edit query parameter or handoff route
    required: true
  - id: calculator_id
    type: supported calculator ID string
    source: dashboard report data or gate-edit query
    required: true
    validation:
      supported_values: "1,2,3,4"
  - id: gate_paths_by_calculator_id
    type: calculatorId→gate path map
    source: environment config / dashboard navigation defaults
    required: false
  - id: public_env
    type: public environment values for gate paths and API base URL
    source: process.env
    required: false
  - id: auth_session
    type: bearer access token and user id credentials
    source: auth token service
    required: false
  - id: persisted_business_id
    type: business ID string
    source: browser localStorage
    required: false
  - id: report_progress
    type: saved progress route string
    source: fetched report payload
    required: true
outputs:
  - id: gate_handoff_destination
    type: URL or in-app route
    destination: browser navigation via router.push or window.location.replace
    lifespan: immediate
  - id: fallback_destination
    type: in-app route or rollback URL
    destination: router.push or window.location.replace
    lifespan: immediate
  - id: resume_route
    type: calculator-specific edit route string
    destination: calculator gate URL query / redirect target
    lifespan: immediate
  - id: error_toast
    type: toast notification
    destination: react-toastify UI
    lifespan: ephemeral
