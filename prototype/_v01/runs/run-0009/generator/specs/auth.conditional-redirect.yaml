    snippet: |
      export function resolveGateEditUiState(result, options = {}) {
        const fallback = resolveGateEditFallbackDestination({
          preferredRoute: options.preferredRoute ?? REPORTS_ROUTE,
          businessId: options.businessId ?? null,
        });
        const fallbackDestination = normalizeString(result?.fallbackDestination) ?? fallback.destination;

        if (!result || result.phase === "pending_router") {
          return {
            heading: "Preparing report resume",
            detail: "Validating route target before loading report progress.",
            fallbackDestination,
          };
        }

        if (result.phase === "redirecting") {
          return {
            heading: "Redirecting",
            detail: `Continuing to ${result.nextDestination}.`,
            fallbackDestination: normalizeString(result.nextDestination) ?? fallbackDestination,
          };
        }

        if (result.phase === "duplicate") {
          return {
            heading: "Resume already processed",
            detail: `This resume intent already ran. Continue to ${fallbackDestination} if needed.`,
            fallbackDestination,
          };
        }

        return {
          heading: "Unable to resume report",
          detail: `Redirecting to ${fallbackDestination} due to ${result.reason ?? "resume failure"}.`,
          fallbackDestination,
        };
      }
