    snippet: |
      export function resolveGateEditFallbackDestination(options = {}) {
        const { preferredRoute = REPORTS_ROUTE } = options;
        const primaryDestination = normalizeInAppRoute(preferredRoute, REPORTS_ROUTE);
        const businessId = readBusinessId(options);
        const destination =
          primaryDestination === REPORTS_ROUTE && businessId
            ? `${REPORTS_ROUTE}#${encodeURIComponent(businessId)}`
            : primaryDestination;

        return {
          destination,
        };
      }

      export function resolveGateEditProgressRoute(report = {}) {
        if (!isPlainObject(report)) {
          return {
            isValid: false,
            reason: "invalid_report",
            route: null,
            calculatorId: null,
            reportProgress: null,
          };
        }

        const calculatorId = normalizeCalculatorId(report.calculatorId);
        if (!calculatorId || !SUPPORTED_CALCULATOR_IDS.has(calculatorId)) {
          return {
            isValid: false,
            reason: "unknown_calculator",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const reportProgress = normalizeProgressRoute(report.reportProgress);
        if (!reportProgress) {
          return {
            isValid: false,
            reason: "missing_report_progress",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const route = resolveMappedProgressRoute(calculatorId, reportProgress);
        if (!route) {
          return {
            isValid: false,
            reason: "unknown_progress",
            route: null,
            calculatorId,
            reportProgress,
          };
        }

        return {
          isValid: true,
          reason: null,
          route,
          calculatorId,
          reportProgress,
        };
      }
