    snippet: |
      function buildValidatedActionRoute(options, mode) {
        const producerQueryPayload = resolveProducerQueryPayload(options);
        const producerQueryValidation = validateGateQuery(producerQueryPayload);

        if (!producerQueryValidation.isValid) {
          return createBaseFailure(producerQueryValidation.reason);
        }

        const target = producerQueryValidation.target;

        if (!target) {
          return createBaseFailure("missing_target");
        }

        const gatePathResolution = resolveGatePathForCalculator(options.calculatorId, options);
        if (!gatePathResolution.ok) {
          return {
            ok: false,
            reason: gatePathResolution.reason,
            destination: null,
          };
        }

        try {
          const destination =
            mode === "new"
              ? buildGateNewUrl(gatePathResolution.gatePath, {
                  target,
                  source: producerQueryValidation.source,
                  name: producerQueryValidation.name,
                })
              : buildGateEditUrl(gatePathResolution.gatePath, { target });
          const queryValidation = validateGateQuery(parseUrlSearchParams(destination));

          if (!queryValidation.isValid) {
            return {
              ok: false,
              reason: queryValidation.reason,
              destination: null,
            };
          }

          return {
            ok: true,
            reason: null,
            destination,
          };
        } catch (_error) {
          return {
            ok: false,
            reason: "build_failed",
            destination: null,
          };
        }
      }

      export function resolveGateHandoffRoute(options = {}) {
        const intent = normalizeHandoffIntent(options.intent);
        const fallbackDestination = resolveHandoffFallbackDestination(
          intent ?? GATE_HANDOFF_INTENTS.EDIT,
          options,
        );

        if (!intent) {
          return {
            ok: false,
            reason: "invalid_intent",
            destination: null,
            fallbackDestination,
          };
        }

        const routeResolution =
          intent === GATE_HANDOFF_INTENTS.NEW
            ? buildGateNewActionRoute(options)
            : buildGateEditActionRoute(options);

        if (!routeResolution.ok) {
          return {
            ok: false,
            reason: routeResolution.reason,
            destination: null,
            fallbackDestination,
          };
        }

        return {
          ok: true,
          reason: null,
          destination: routeResolution.destination,
          fallbackDestination,
        };
      }
    line_range:
      start: 236
      end: 335
    covers:
