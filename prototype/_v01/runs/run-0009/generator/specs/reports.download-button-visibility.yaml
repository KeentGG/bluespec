id: reports.download-button-visibility.yaml
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: download-button-visibility
    coverage: partial
    notes: >
      The legacy golden expects the download button to become visible only at
      the download stage, but current code keeps the button mounted on every
      report row and only gates disabled/enabled state. The threshold behavior
      is present; the hidden-vs-visible claim is not.

description: >
  Each report row always shows a Download action in the reports table. The
  button is rendered on every row, stays disabled until the raw progress value
  is exactly 100, and switches to a loading/disabled state while a download is
  in flight. The progress value comes from the report progress contract, which
  resolves terminal routes to 100.

state_machine:
  initial: rendered_locked
  states:
    - id: rendered_locked
      description: >
        The Download button is mounted in the row but disabled because the
        progress is below 100%; there is no hidden state in current code.
    - id: rendered_ready
      description: >
        The Download button is mounted and enabled because progress is exactly
        100% and no download is active.
    - id: rendered_downloading
      description: >
        The Download button remains mounted but disabled while the row download
        is running, and the label changes to "Downloading...".
  transitions:
    - id: progress_becomes_100
      from: rendered_locked
      to: rendered_ready
      trigger: ReportsTable rerenders the row with `progressPercentage === 100`
      guards:
        - field: progressPercentage
          condition: equals 100
        - field: isDownloading
          condition: false
      effects:
        - The button becomes clickable.
        - The label shows "Download".
        - The title shows "Download report".
    - id: click_download
      from: rendered_ready
      to: rendered_downloading
      trigger: user clicks the Download button
      guards:
        - field: progressPercentage
          condition: equals 100
        - field: isDownloading
          condition: false
      effects:
        - rowController.handleDownload(report._raw) runs.
        - actionStore.setDownloading(report._id, true) is set.
        - useDownloadStore.startDownload begins PDF generation.
    - id: download_settles
      from: rendered_downloading
      to: rendered_ready
      trigger: reportActions.download resolves
      guards:
        - field: progressPercentage
          condition: equals 100
      effects:
        - actionStore.setDownloading(report._id, false) is set after the awaited call returns.
        - The button returns to the enabled state if progress remains 100.

conditions:
  - id: button_always_rendered
    description: The Download button is never hidden by progress; every report row mounts the actions control.
    trigger: ReportsTable renders a report row
    then:
      - Render the Download button in the actions cell.
      - Keep it in the DOM even before progress reaches 100.
  - id: button_enabled_only_at_100
    description: The Download button is interactive only when progressPercentage is exactly 100 and the row is not already downloading.
    trigger: ReportSplitActions renders
    guards:
      - field: progressPercentage
        condition: equals 100
      - field: isDownloading
        condition: false
    then:
      - Set disabled=false.
      - Set the title to "Download report".
      - Use the enabled brand-primary styling.
    else:
      - Keep the button visible but disabled.

inputs:
  - id: reportProgressPercentage
    type: number
    source: "ReportsTable row data (`report.reportProgressPercentage`)"
    required: true
  - id: isDownloading
    type: boolean
    source: "useReportRowController / row action store (`rowController.isDownloading(report.reportId)`)"
    required: true
  - id: reportRecord
    type: report row object
    source: "ReportsTable row `_raw`"
    required: true

outputs:
  - id: download_button_render_state
    type: rendered action button
    destination: "ReportsTable actions cell / ReportSplitActions primary button"
    lifespan: while the row is rendered
  - id: download_button_disabled_state
    type: boolean disabled flag
    destination: "ReportSplitActions button `disabled` prop and styling"
    lifespan: per render
  - id: pdf_generation_request
    type: PDF generation start request
    destination: "useDownloadStore.startDownload -> startPdfGeneration"
    lifespan: immediate on enabled click

evidence_refs:
