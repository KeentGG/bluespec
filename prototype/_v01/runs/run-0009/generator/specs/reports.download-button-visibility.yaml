  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/pdf/store/useDownloadStore.ts
    snippet: |
      startDownload: async ({ userId, reportId, cid, email }) => {
        try {
          // Set generating state first
          get().setIsGenerating(true);
          get().setDlStatus("waiting");
          get().setPdfKey(userId);
          get().setCid(cid);
          get().setCurrentReportId(reportId);
          get().setPublicUrl("");

          // Call API to start generation
          const response = await startPdfGeneration({ userId, reportId, email });

          // Fix: response.data contains userId directly, not nested under .data
          if (response.ok && response.data?.userId) {
            // Generation started successfully
            return true;
          } else {
            // API returned error
            get().setDlStatus("failed");
            return false;
          }
        } catch (error) {
          console.error("Failed to start PDF generation:", error);
          get().setDlStatus("failed");
          return false;
        }
      },
    covers: [transition:click_download, output:pdf_generation_request]
    line_range: {start:107, end:133}
  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      function resolveProgressPercentageByCalculatorId(calculatorId, route) {
        if (calculatorId === CALCULATOR_IDS.VE) {
          return resolveVeProgressPercentage(route);
        }

        if (calculatorId === CALCULATOR_IDS.DE) {
          return resolveDeProgressPercentage(route);
        }

        if (calculatorId === CALCULATOR_IDS.VGA) {
          return resolveVgaProgressPercentage(route);
        }

        if (calculatorId === CALCULATOR_IDS.NP) {
          return resolveNpProgressPercentage(route);
        }

        return null;
      }
    covers: [input:reportProgressPercentage]
    line_range: {start:301, end:318}
  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/report-route-progress-contract.js
    snippet: |
      function resolveNpProgressPercentage(route) {
        const companyInformationStep = toStepNumber(route, /^\/company-information\/(\d+)(?:\/|$)/);
        if (companyInformationStep !== null) {
          return clampPercent(5 + (companyInformationStep - 1) * 7);
        }

        // Optional questions appear after download page - treat as 100% complete
        if (route.includes("optional-questions")) {
          return 100;
        }

        if (route.startsWith("/adjustment-categories")) {
          return 55;
        }

        if (route === "/assumption-summary") {
          return 45;
        }

        if (route === "/customize-report-1") {
          return 72;
        }

        if (route === "/company-logo") {
          return 78;
        }

        if (route === "/average") {
          return 84;
        }

        if (route === "/summary") {
          return 90;
        }

        if (route === "/chart") {
          return 94;
        }

        if (route === "/working-capital") {
          return 96;
        }

        if (route === "/ordinary-vs-cap-gains") {
          return 97;
        }

        if (route === "/purchase-price-allocation") {
          return 98;
        }

        if (route === "/net-proceeds-overview" || route === "/thankyou" || route === "/value-estimate") {
          return 100;
        }

        return null;
      }
    covers: [condition:button_enabled_only_at_100, transition:progress_becomes_100, input:reportProgressPercentage]
    line_range: {start:243, end:296}
confidence: 0.94
confidence_rationale: >
  The render-vs-disabled gate is directly confirmed in ReportsTable and
  ReportSplitActions, and the click path into PDF generation is confirmed in
  useReportRowController, useReportActions, and useDownloadStore. The report
  progress contract confirms that terminal routes resolve to 100 and that the
  percentage is calculator-aware. I did not inspect helper files imported by
  these modules because they were not in the manifest, so the spec is precise
  about the visible/disabled gate but does not claim broader app-wide coverage.
unresolved_questions:
  - Whether any other report action surface outside the listed files hides the Download control cannot be confirmed from the manifest-scoped evidence.
  - The exact relationship between `report.reportId` and `report._id` is not proven in the inspected files, so the click-path input is described generically as a report record handoff.
status: partial
