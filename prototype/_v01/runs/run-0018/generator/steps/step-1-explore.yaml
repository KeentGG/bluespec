      - src/features/company/components/CompaniesPageClient.tsx
      - src/features/pdf/components/PdfGenerationOverlay.tsx
      - src/features/auth/components/LoginPageContent.tsx
    confidence: 0.95
  - id: api_data_fetching
    description: >
      Centralized HTTP client (apiClient.ts) with automatic JWT injection, CSRF
      handling, token refresh retry, and normalized response format. SWR-based
      data hooks for companies, reports, and user profiles. Service modules for
      auth, company, report, and PDF APIs.
    evidence_refs:
      - src/shared/lib/api/apiClient.ts
      - src/shared/lib/api/authBehaviorTypes.js
      - src/features/auth/api/auth-service.js
      - src/features/company/api/company-service.js
      - src/features/company/api/list-service.js
      - src/features/reports/api/list-service.js
      - src/features/reports/api/report-service.js
      - src/features/pdf/api/pdf-service.ts
      - src/features/auth/api/user-service.js
      - src/features/company/hooks/useCompanyListQuery.ts
      - src/features/auth/hooks/useUserQuery.ts
      - src/features/reports/hooks/useReportsListQuery.ts
    confidence: 0.92
  - id: route_guarding
    description: >
      Middleware-level and component-level route protection. Middleware checks
      protected paths (/companies, /reports), attempts silent token refresh, and
      redirects unauthenticated users. AuthGuard component wraps dashboard pages
      with session verification. Route entry contracts handle gate/new and
      gate/edit navigation.
    evidence_refs:
      - middleware.js
      - src/features/auth/api/authGuard.js
      - src/features/auth/components/AuthGuard.tsx
      - src/features/auth/hooks/useAuthRedirect.ts
      - src/app/(dashboard)/layout.tsx
      - src/shared/lib/routing/gate-edit-contract.js
      - src/shared/lib/routing/gate-new-contract.js
      - src/shared/lib/routing/entryContracts.js
      - src/shared/lib/routing/initGuards.js
      - src/features/routing/hooks/useGateEditEntryState.ts
      - src/features/routing/hooks/useGateNewEntryState.ts
      - src/features/routing/hooks/useRootRedirect.ts
    confidence: 0.94
  - id: cross_tab_sync
    description: >
      Cross-tab authentication synchronization using BroadcastChannel API with
      localStorage fallback. When a user logs out in one tab, all other tabs
      receive the event and clear their session. Token refresh coordination uses
      localStorage-based locks to prevent multiple tabs from refreshing
      simultaneously.
    evidence_refs:
      - src/features/auth/lib/authBroadcast.js
      - src/features/auth/lib/crossTab.js
      - src/features/auth/api/tokenRefresher.js
      - src/features/auth/api/authMemorySession.js
      - src/shared/components/AuthSyncBootstrap.tsx
    confidence: 0.96
  - id: csrf_protection
    description: >
      CSRF token management for state-changing requests. Tokens are stored in
      cookies, injected into headers via apiClient, and refreshed when missing
      or invalid. Includes proactive refresh before POST/PATCH/DELETE requests.
    evidence_refs:
      - src/features/auth/api/csrfHelper.js
      - src/shared/lib/api/apiClient.ts
      - src/features/auth/api/tokenService.js
      - middleware.js
    confidence: 0.88
  - id: form_state_management
    description: >
      Complex form state management patterns including multi-field forms with
      validation, file upload handling, drag-and-drop state, and submission
      lifecycle. Company form handles logo upload with preview, crop, and remove
      operations.
    evidence_refs:
      - src/features/company/hooks/useCompanyForm.ts
      - src/features/auth/components/LoginPageContent.tsx
      - src/features/auth/components/SignupPageContent.tsx
      - src/features/auth/components/ResetPasswordPageContent.tsx
      - src/features/reports/components/CreateReportModal.tsx
      - src/features/reports/components/EmailReportModal.tsx
      - src/features/reports/components/DeleteReportModal.tsx
    confidence: 0.9
  - id: modal_dialog_system
    description: >
      Modal and dialog state management using Radix UI Dialog primitives with
      Framer Motion animations. Zustand stores manage open/close state for
      report creation, email, and deletion modals. Component-local state for
      company modals.
