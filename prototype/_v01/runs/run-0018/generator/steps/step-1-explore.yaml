  - id: pdf_generation_flow
    description: >
      PDF generation lifecycle with async status tracking. Download store
      persists generation state to localStorage for page-refresh resilience.
      Overlay component shows generation progress.
    evidence_refs:
      - src/features/pdf/store/useDownloadStore.ts
      - src/features/pdf/api/pdf-service.ts
