    confidence: 0.85
  - id: qfm_response_normalization
    description: >
      Query/Response normalization layer (QFM) that handles inconsistent backend
      response formats, failure taxonomy classification, rollback gates, and
      storage sanitization. Provides normalized ApiResult<T> type across all API
      calls.
