      - src/features/reports/hooks/useReportDeleteDialog.ts
      - src/features/company/hooks/useCompanyModals.ts
      - src/features/company/components/CompanyModals.tsx
      - src/features/pdf/components/PdfGenerationOverlay.tsx
    confidence: 0.91
  - id: data_list_state
    description: >
      List/table state management with search, sort, filter, pagination, and
      loading states. Reports list uses Zustand for filter state, SWR for data
      fetching, and controller pattern for complex state derivation. Companies
      list uses SWR with search/sort parameters.
