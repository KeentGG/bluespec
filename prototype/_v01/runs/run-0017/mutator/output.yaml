confidence_rationale: >
  Confidence is high because the analyzer and evaluator converge on the same
  mechanism: nearby evidence is being allowed to stand in for the named golden
  predicate. The current formula already has predicate-oriented language, which
  lowers uncertainty about the diagnosis and points toward missing gates rather
  than missing concepts. Confidence is not absolute because improved discovery
  may still find renamed or missing surfaces, but the proposed mutation produces
  a better outcome either way: real evidence if present, explicit unsupported
  status if absent.

