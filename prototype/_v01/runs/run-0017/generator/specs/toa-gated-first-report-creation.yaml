id: toa-gated-first-report-creation
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: toa-gated-first-report-creation
    coverage: partial
    notes: >-
      The inspected dashboard-v2 code fully evidences the dashboard-side gate: local
      validation, TOA lookup, redirect to the calculator introduction page with
      businessId/reportname, and the dashboard's willingness to accept later
      /gate/new returns whose referrer comes from /introduction or /commitment.
      The calculator-side TOA acceptance action and a real persisted post-acceptance
      report creation call are not present in the examined files, so end-to-end
      post-TOA creation remains partially inferred.
description: >-
  When a user starts first-time report creation from the dashboard, the flow first
  validates the requested company and report name, then looks up the user's TOA
  status. If TOA has not been agreed, the dashboard does not create the report in
  this hook and instead redirects the browser to the selected calculator's
  introduction page with businessId and lowercase reportname query params. If TOA
  has already been agreed, the dashboard creates the report immediately and routes
  the user into the calculator gate. The dashboard contracts also preserve and
  validate introduction/commitment return context for later /gate/new handoff.
state_machine:
  initial: idle
  states:
    - id: idle
      description: Report creation UI is waiting for a submit attempt.
    - id: validating_request
      description: The hook is checking local inputs and fetching user TOA state.
    - id: toa_redirect_pending
      description: TOA is missing and a browser redirect to the calculator introduction page is scheduled.
    - id: dashboard_creation_in_progress
      description: TOA is already agreed and the dashboard is creating the report record.
    - id: gate_redirect_pending
      description: Report creation succeeded and navigation to the calculator gate is scheduled.
    - id: failed
      description: The current creation attempt terminated with a validation, redirect, fetch, or create error.
  transitions:
    - id: reject_missing_name
      from: idle
      to: failed
      trigger: User submits create-report request without a non-empty trimmed report name.
      guards:
        - field: name
          condition: name.trim() is empty
      effects:
        - Show the "Report name is required." toast.
        - 'Return { success: false, reason: "missing_name" }.'
    - id: reject_missing_business
      from: idle
      to: failed
      trigger: User submits create-report request without a businessId.
      guards:
        - field: businessId
          condition: businessId is missing or empty
      effects:
        - Show the "Select a company." toast.
        - 'Return { success: false, reason: "missing_business" }.'
    - id: begin_toa_check
      from: idle
      to: validating_request
      trigger: User submits a create-report request with required local inputs present.
      guards:
        - field: name
          condition: name.trim() is non-empty
        - field: businessId
          condition: businessId is present
      effects:
        - Set isCreating to true.
        - Read the current token.
        - Fetch the current user record before deciding whether to redirect or create.
    - id: redirect_when_toa_missing
      from: validating_request
      to: toa_redirect_pending
      trigger: User TOA lookup succeeds and agreedToa is not true.
      guards:
        - field: userResult.data.agreedToa
          condition: agreedToa !== true
        - field: introduction_url
          condition: buildIntroductionUrl resolves ok=true and returns a URL
      effects:
        - Show the TOA redirect toast.
        - Schedule window.location.replace(introductionUrl) after 2000 ms.
        - 'Return { success: true, redirected: true, reason: "toa_redirect" }.'
    - id: fail_when_intro_redirect_cannot_be_built
      from: validating_request
      to: failed
      trigger: User TOA lookup succeeds, TOA is missing, but the calculator introduction URL cannot be built.
      guards:
        - field: userResult.data.agreedToa
          condition: agreedToa !== true
        - field: introduction_url
          condition: buildIntroductionUrl returns ok=false or url is null
      effects:
        - Show the "Unable to redirect to introduction page. Please try again." toast.
        - 'Return { success: false, reason: "intro_redirect_failed" }.'
    - id: create_immediately_when_toa_agreed
      from: validating_request
      to: dashboard_creation_in_progress
      trigger: User TOA lookup succeeds and agreedToa is true.
      guards:
        - field: userResult.data.agreedToa
          condition: agreedToa === true
      effects:
        - Call createReport with businessId, trimmed name, calculatorId, token._id, and default report progress.
    - id: fail_user_lookup
      from: validating_request
      to: failed
      trigger: Fetching or validating the current user record fails.
      guards:
        - field: userResult.ok
          condition: userResult.ok is false OR fetchUserData throws
      effects:
        - Surface the fetch failure via the catch handler.
        - Show an error toast.
        - 'Return { success: false, reason: "error", error }.'
    - id: create_success
      from: dashboard_creation_in_progress
      to: gate_redirect_pending
      trigger: Report creation succeeds.
      guards:
        - field: createReport result
          condition: result.ok is true
      effects:
        - Show the success toast.
        - Extract the created report and report id from the API result.
        - Schedule navigateToReportGate after 2000 ms when a report id exists.
        - Call onSuccess if provided.
        - 'Return { success: true, reportId, report }.'
    - id: create_failure
      from: dashboard_creation_in_progress
      to: failed
      trigger: Report creation fails or throws.
      guards:
        - field: createReport result
          condition: result.ok is false OR createReport throws
      effects:
        - Surface the create failure via the catch handler.
        - Show an error toast.
        - 'Return { success: false, reason: "error", error }.'
conditions:
  - id: toa_redirect_contract
    description: A valid TOA contract redirects only when user data is valid and agreedToa is not true.
    trigger: A caller resolves a TOA redirect route from userData, calculatorId, businessId, and reportName.
    guards:
      - field: userData
        condition: userData must be a plain object or the contract returns ok=false with reason invalid_user_data
      - field: userData.agreedToa
        condition: agreedToa === true disables redirect; agreedToa !== true requires introduction URL resolution
    then:
      - Return ok=true, shouldRedirect=true, reason=toa_not_agreed, and the built introduction URL when TOA is not agreed and the introduction URL can be built.
    else:
      - Return ok=true, shouldRedirect=false, url=null when agreedToa === true.
      - Return ok=false when user data or introduction URL prerequisites are invalid.
  - id: introduction_url_payload
    description: The introduction redirect always carries the selected company and, when present, the trimmed report name using the lowercase reportname key.
    trigger: The dashboard builds a calculator introduction URL for a TOA-gated creation attempt.
    guards:
      - field: calculatorId
        condition: calculatorId must resolve to a supported gate path
      - field: businessId
        condition: businessId must normalize to a non-empty string
      - field: reportName
        condition: reportName is optional, but when present it is added under the lowercase query key reportname
    then:
      - Remove the trailing /gate segment from the calculator gate path.
      - Append /introduction/.
      - Set businessId and optional reportname query params.
    else:
      - Return ok=false with reason missing_gate_path, invalid_gate_path, or missing_business_id.
  - id: introduction_commitment_query_contract
    description: Introduction and commitment routes require businessId and the lowercase reportname query key, and commitment preserves the introduction query unchanged.
    trigger: Calculator introduction/commitment routes validate or forward query params.
    guards:
      - field: businessId
        condition: businessId must exist and trim to a non-empty string
      - field: reportname
        condition: query must contain lowercase reportname; reportName is rejected as invalid_reportname_key
    then:
      - Treat the query as valid for introduction handling.
      - Forward the same query object when building the commitment URL.
    else:
      - Return isValid=false with reason missing_businessId, missing_reportname, invalid_reportname_key, or invalid_query.
  - id: gate_new_return_referrer_allowlist
    description: Dashboard /gate/new accepts return traffic only from allowed origins, and calculator introduction/commitment pages are explicitly allowlisted referrers.
    trigger: The dashboard validates a /gate/new entry request.
    guards:
      - field: currentOrigin
        condition: currentOrigin must normalize and belong to the resolved allowed origin list
      - field: referrer
        condition: missing referrer is allowed; when present it must parse, share an allowed origin, and have a pathname starting with an allowed prefix
      - field: referrer.pathname
        condition: allowed prefixes include /companies, /reports, /gate/new, /gate/edit, /introduction, and /commitment
    then:
      - Allow the gate/new initialization flow to continue.
    else:
      - Reject the request with blocked_origin, invalid_referrer, blocked_referrer_origin, or blocked_referrer_path.
inputs:
  - id: businessId
    type: string
    source: Create-report form input and later introduction/commitment query param.
    required: true
    validation:
      create_flow: Must be present before the hook starts async work.
      introduction_flow: Must normalize to a non-empty string or introduction query validation fails.
  - id: report_name
    type: string
    source: Create-report form input.
    required: true
    validation:
      create_flow: name.trim() must be non-empty.
      introduction_flow: When forwarded to calculator introduction it is sent under lowercase reportname.
  - id: calculator_id
    type: string
    source: Selected calculator in the create-report UI.
    required: true
    validation:
      gate_resolution: Must map to a supported calculator gate path or introduction URL construction fails.
  - id: current_user_id
    type: string
    source: JWT token returned by getToken().
    required: false
    validation:
      user_lookup: fetchUserData needs a user id to call /users/:userId.
  - id: user_toa_record
    type: object with agreedToa boolean
    source: GET /users/:userId via fetchUserData.
    required: true
    validation:
      normalization: agreedToa is normalized to a strict boolean in normalizeUserData.
  - id: gate_environment
    type: public environment variables for calculator gate paths
    source: process.env / public NEXT_PUBLIC_* gate configuration.
    required: true
    validation:
      introduction_url: The selected calculator must resolve to a gate path before /introduction/ can be built.
  - id: gate_new_referrer
    type: URL string or empty
    source: document.referrer during /gate/new entry.
    required: false
    validation:
      return_flow: Missing referrer is allowed, but a present referrer must parse and satisfy same-origin + allowed-path checks.
outputs:
  - id: create_attempt_result
    type: structured result object
    destination: Returned from handleCreateReport to the caller.
    lifespan: Immediate for the current submit attempt.
  - id: introduction_redirect_url
    type: absolute or app-relative calculator introduction URL
    destination: Browser navigation via window.location.replace after a 2000 ms delay.
    lifespan: Immediate handoff to the calculator introduction page.
  - id: report_create_request
    type: API request body containing businessId, name, calculatorId, userId, and reportProgress
    destination: createReport report-service call.
    lifespan: One dashboard report-creation request.
  - id: gate_navigation
    type: calculator gate navigation target
    destination: navigateToReportGate after successful report creation, or /gate/new initialization after a later return flow.
    lifespan: Immediate redirect after the relevant creation or handoff step.
