    snippet: |-
      export function validateIntroductionCommitmentQuery(query) {
        const rawBusinessId = readQueryValue(query, "businessId");
        const rawReportname = readQueryValue(query, "reportname");
        const hasReportname = hasQueryKey(query, "reportname");
        const hasWrongCaseReportName = hasQueryKey(query, "reportName");

        if (!isPlainObject(query) && !isSearchParamsLike(query)) {
          return {
            isValid: false,
            reason: "invalid_query",
            businessId: null,
            reportname: null,
            raw: {
              businessId: null,
              reportname: null,
            },
          };
        }

        const businessId = rawBusinessId?.trim() ?? "";
        if (!businessId) {
          return {
            isValid: false,
            reason: "missing_businessId",
            businessId: null,
            reportname: rawReportname,
            raw: {
              businessId: rawBusinessId,
              reportname: rawReportname,
            },
          };
        }

        if (!hasReportname) {
          return {
            isValid: false,
            reason: hasWrongCaseReportName ? "invalid_reportname_key" : "missing_reportname",
            businessId,
            reportname: null,
            raw: {
              businessId: rawBusinessId,
              reportname: rawReportname,
            },
          };
        }

        if (rawReportname === null) {
          return {
            isValid: false,
            reason: "missing_reportname",
            businessId,
            reportname: null,
            raw: {
              businessId: rawBusinessId,
              reportname: rawReportname,
            },
          };
        }

        return {
          isValid: true,
          reason: null,
          businessId,
          reportname: rawReportname,
          raw: {
            businessId: rawBusinessId,
            reportname: rawReportname,
          },
        };
      }
  - path: src/shared/lib/contracts/query-contract.js
