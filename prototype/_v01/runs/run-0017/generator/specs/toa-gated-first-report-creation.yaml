      - "output: gate_navigation"
    snippet: |-
      const normalizedReferrer = normalizeString(referrer);
      if (!normalizedReferrer) {
        // Browser privacy policies can strip referrers; allow valid query/origin flows.
        return {
          isValid: true,
          reason: null,
          gateQuery,
          currentOrigin: normalizedCurrentOrigin,
          referrerOrigin: null,
          referrerPath: null,
          referrerState: "missing",
          allowedOrigins: resolvedAllowedOrigins,
        };
      }

      let parsedReferrer = null;
      try {
        parsedReferrer = new URL(normalizedReferrer);
      } catch (_error) {
        parsedReferrer = null;
      }

      if (!parsedReferrer) {
        return {
          isValid: false,
          reason: "invalid_referrer",
          gateQuery,
          currentOrigin: normalizedCurrentOrigin,
          referrerOrigin: null,
          referrerPath: null,
          referrerState: "invalid",
          allowedOrigins: resolvedAllowedOrigins,
        };
      }

      const referrerOrigin = normalizeOrigin(parsedReferrer.origin);
      if (!referrerOrigin || !resolvedAllowedOrigins.includes(referrerOrigin)) {
        return {
          isValid: false,
          reason: "blocked_referrer_origin",
          gateQuery,
          currentOrigin: normalizedCurrentOrigin,
          referrerOrigin,
          referrerPath: parsedReferrer.pathname,
          referrerState: "blocked",
          allowedOrigins: resolvedAllowedOrigins,
        };
      }

      if (!isAllowedReferrerPath(parsedReferrer.pathname, allowedReferrerPathPrefixes)) {
        return {
          isValid: false,
          reason: "blocked_referrer_path",
          gateQuery,
          currentOrigin: normalizedCurrentOrigin,
          referrerOrigin,
          referrerPath: parsedReferrer.pathname,
          referrerState: "blocked",
          allowedOrigins: resolvedAllowedOrigins,
        };
      }

      return {
        isValid: true,
        reason: null,
        gateQuery,
        currentOrigin: normalizedCurrentOrigin,
        referrerOrigin,
        referrerPath: parsedReferrer.pathname,
        referrerState: "validated",
        allowedOrigins: resolvedAllowedOrigins,
      };
confidence: 0.78
confidence_rationale: >-
  Confidence is moderate-high because the inspected files directly confirm the dashboard-side
  TOA gate, the exact introduction URL payload, the TOA boolean normalization, and the
  allowlisted /introduction and /commitment referrer handling for /gate/new. Confidence is
  not higher because the actual calculator-side acceptance step and a real post-acceptance
  persisted report creation path are not shown in the examined code; useGateNewEntryState
  currently injects a stub createReport implementation instead of a concrete API call.
unresolved_questions:
  - Where, in the calculator application(s), is TOA acceptance recorded and the user advanced from /introduction to /commitment or back into /gate/new?
  - What exact /gate/new query payload does the calculator send back after TOA acceptance, since the introduction flow uses businessId/reportname while gate-new validation expects target/source/name?
  - Is there a production implementation of executeGateNewInitialization that persists the first report after TOA acceptance, beyond the stub createReport callback used in useGateNewEntryState?
status: partial
