    snippet: |-
      export function buildCommitmentUrl(calculatorPath, introductionQuery) {
        const nextCalculatorPath = appendPathSegment(
          requirePath(calculatorPath, "calculatorPath"),
          "commitment",
        );
        const forwardedQuery = forwardIntroductionQuery(introductionQuery);
        const queryEntries = [];

        for (const [key, value] of Object.entries(forwardedQuery)) {
          pushQueryEntry(queryEntries, key, value);
        }

        return buildUrl(nextCalculatorPath, queryEntries);
      }
