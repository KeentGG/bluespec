  - src/features/auth/contracts/toa-contract.js
  - src/features/reports/hooks/useReportCreation.ts
  - src/shared/lib/routing/gate-new-contract.js
  - src/features/auth/hooks/useAuthRedirect.ts
  - src/features/auth/api/user-service.js
prior_context: |
  This is a Next.js frontend application with JWT-based authentication.
  The TOA (Terms of Agreement) flow gates first report creation for new accounts.
  The system checks TOA status and redirects to calculator introduction if needed.
