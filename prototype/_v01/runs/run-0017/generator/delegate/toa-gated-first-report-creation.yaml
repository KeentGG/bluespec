output_path: runs/run-0017/generator/specs/toa-gated-first-report-creation.yaml
discovered_behaviors:
  - id: toa-gated-first-report-creation
    description: >
      For newly registered accounts with no TOA (Terms of Agreement) check and no existing reports,
      any first report creation is deferred -- the dashboard does NOT persist the report until TOA is
      accepted. Instead, the calculator handles report creation on the specified company and report name
      after the user completes the TOA introduction/commitment flow. The dashboard redirects to the
      calculator introduction page with businessId and reportName as query params, and the calculator
      creates the report post-TOA-acceptance.
    priority: high
    category: conditional_flow
