      - runs/run-0017/generator/specs/download-button-visibility.yaml:5-20
      - runs/run-0017/inputs/formula.yaml:18-34

  - spec_id: toa-gated-first-report-creation
    golden_behavior_id: toa-gated-first-report-creation
    achieved_coverage: partial
    primary_failure_type: search_failure
    diagnosis: >
      The generator found the dashboard-side TOA gate, but it did not complete
      the second half of the behavior across the redirect boundary. The manifest
      asserts that the calculator creates the report after TOA acceptance, yet it
      does not include calculator-side acceptance/return-path files that would
      prove persisted post-acceptance creation. The generated spec therefore
      documents the pre-redirect contract well but leaves the post-redirect
      report-creation step partially inferred. Because the missing proof sits in
      unsearched downstream files rather than in malformed output, the failure is
      primarily search_failure.
    root_causes:
      delegation_manifest:
        - >
          The manifest mixed proven dashboard behavior and unproven calculator
          continuation into one description, but only supplied dashboard-side
          source_files plus a generic auth redirect hook.
        - >
          It omitted an explicit "both sides of redirect boundary required"
          constraint, so the downstream calculator handoff was optional instead of
          mandatory evidence.
        - >
          It did not seed likely continuation files such as the /gate/new entry
          state hook or initialization executor referenced by the evaluator.
      spec_generator:
        - >
          It responsibly called out the missing persisted calculator-side step,
          but it still kept the end-to-end behavior bundled as one partially
          evidenced spec rather than splitting proven dashboard gating from the
          unproven calculator completion path.
        - >
          It did not trigger a discovery retry when a redirect handoff lacked a
          proven downstream createReport persistence call.
    decision_tree_trace:
      search_failure: >
        Matched because the missing live proof identified by the evaluator
        (useGateNewEntryState and the real post-acceptance creation path) is not
        present in the delegation manifest's source_files.
      recognition_failure: >
        Not primary because the generator correctly recognized and documented the
        dashboard-side TOA gate; the main gap is the missing downstream search.
      format_failure: >
        Not primary because the artifact is structurally coherent and honest
        about the unresolved handoff gap.
      prompt_failure: >
        Not primary because the active formula already asks for conditional-flow
        predicates and explicit notes about partial matches.
      rubric_gap_failure: >
        Not primary because the current rubric already penalizes incomplete core
        behavior and recall across the handoff.
    actionable_recommendations:
      - >
        Mutate delegation to require a two-sided evidence plan for any deferred
        flow: pre-redirect trigger, redirect payload, downstream resume/entry
        hook, and persisted side effect.
      - >
        Mutate verify so full or partial end-to-end claims cannot stand without a
        cited persistence call after the redirect boundary; otherwise the output
        must split the behavior into "proven upstream" and "unproven
        downstream" artifacts.
      - >
        Add a search retry heuristic that follows createReport, gate/new, and
        return-path symbols whenever the manifest claims post-redirect completion.
    evidence_refs:
