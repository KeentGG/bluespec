primary_failure_type: search_failure
diagnosis: >
  Search scope is still the dominant failure mode in run-0017, but not the only
  one. Two specs failed because delegation did not include the decisive evidence
  surfaces for the named behavior (auth edit-route agreement gating and the
  calculator-side completion of TOA-gated creation). The third spec shows a
  secondary recognition problem: once the generator reached the right UI area, it
  treated adjacent live behavior as a partial match instead of enforcing an exact
  visibility-vs-enablement comparison against the golden wording. Across all
  three, the system is too willing to draft a polished spec from nearby evidence
  even when the unique predicate for the named behavior is unproven.
failure_tier: step_management

systemic_patterns:
  - id: manifest-conclusion-first
    pattern: >
      Delegation manifests state the expected business conclusion up front, but
      do not encode the evidence obligations required to prove or falsify it.
    impact: >
      Generators search too narrowly, then rationalize adjacent behavior instead
      of testing whether the named behavior actually exists.
  - id: no-zero-evidence-stop
    pattern: >
      The pipeline lacks a hard stop when a spec has zero direct evidence for its
      unique predicate or when only one side of a redirect boundary is proven.
    impact: >
      The system emits high-quality partial prose for unsupported behaviors
      instead of surfacing a discovery miss early.
  - id: thematic-substitution
    pattern: >
      Nearby live behavior is allowed to substitute for the golden claim when the
      UI domain is similar (auth redirects, download lifecycle, TOA handoff).
    impact: >
      Recall falls while precision stays relatively high, producing plausible but
      strategically wrong specs.
  - id: insufficient-surface-separation
    pattern: >
      Row actions, overlay actions, and pre-vs-post-redirect flows are not forced
      into separate predicate inventories or separate artifacts.
    impact: >
      Distinct behaviors get blended into one spec and mismatch classification is
      softened into partial coverage.

suggested_mutation: >
  Strengthen step management in three places. First, mutate delegate generation
  to emit an evidence plan per golden behavior: exact target files/evidence refs,
  adjacent fallback files, required unique predicates, and required boundary
  proofs (for example both sides of redirects). Second, mutate analyze/verify to
  produce a direct-evidence matrix that labels each claimed behavior element as
  direct, adjacent, or inferred and blocks draft when the unique predicate has no
  direct evidence. Third, mutate draft so merged behaviors are split whenever the
  render mode differs (hidden vs visible-disabled) or when upstream and
  downstream phases of a flow are proven by different files.
expected_effect: >
  Future runs should stop substituting generic auth infrastructure for edit-route
  agreement gates, separate row-button enablement from overlay-link visibility,
  and require downstream proof for post-TOA report creation before claiming
  end-to-end coverage. That should raise recall without sacrificing the current
  high precision.

mutation_recommendations:
  - id: delegate-evidence-plan
    target_step: explore_and_delegate
    priority: high
    recommendation: >
      For each golden behavior, require: named evidence refs, renamed-file
      fallback search, neighboring route/component/hook files, and a list of
      unique predicates that must be directly proven.
  - id: direct-evidence-matrix
    target_step: analyze_and_verify
    priority: high
    recommendation: >
      Add a machine-readable matrix of claimed behavior elements with
      direct/adjacent/inferred labels; fail verification if the behavior id is
      retained with zero direct evidence for its distinguishing predicate.
  - id: boundary-proof-requirement
    target_step: analyze_and_verify
    priority: high
    recommendation: >
      Require both sides of redirect/deferred workflows to be evidenced before an
      artifact can claim end-to-end behavior; otherwise force split artifacts or
      explicit unsupported status.
  - id: render-surface-splitting
    target_step: draft
    priority: medium
    recommendation: >
      Force separate predicate sections/specs when a row action, overlay action,
      or other UI surface has a different render mode or lifecycle trigger.
  - id: noise-pruning
    target_step: draft
    priority: medium
    recommendation: >
      Drop supporting implementation details that do not change the named gate or
      side effect, so the core behavior stays legible and mismatch signals are not
      buried.

