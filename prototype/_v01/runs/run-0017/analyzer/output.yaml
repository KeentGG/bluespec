spec_failure_diagnoses:
  - spec_id: auth-conditional-redirect
    golden_behavior_id: auth-conditional-redirect
    achieved_coverage: none
    primary_failure_type: search_failure
    diagnosis: >
      This failure starts at discovery. The delegation manifest names an
      edit-route agreement gate, but its source_files only cover generic auth
      guard, token, and auth-error infrastructure. The generated spec therefore
      backfilled the golden behavior id with adjacent login-routing behavior from
      authGuard/authErrorHandler instead of evidence from the claimed edit flow.
      Because the evaluator's cited missing evidence surface
      (src/routes/project-edit.tsx, or a renamed successor) never entered the
      manifest and no spec evidence shows an agreement-state branch on the edit
      route, the miss is best explained by search_failure, not by schema or
      rubric issues.
    root_causes:
      delegation_manifest:
        - >
          The manifest encoded the expected conclusion ("editing project routes
          through a gated edit flow only when agreement state is satisfied")
          without including the route, hook, or contract files that would need
          to prove that conclusion.
        - >
          It omitted any golden evidence refs, renamed-file fallback, or adjacent
          route exploration requirements, so the generator had no explicit path
          to src/routes/project-edit.tsx or its live replacement.
      spec_generator:
        - >
          It accepted thematic auth overlap as sufficient and produced a full
          generic auth redirect spec under the golden behavior id even after its
          own notes said no agreement-state or edit-route branch was found.
        - >
          It expanded into refresh-cookie/token-refresh support paths that did
          not sharpen the core behavior, which diluted attention away from the
          missing edit-flow gate.
        - >
          It did not escalate from "partial" to "coverage none / behavior not
          evidenced" when zero direct evidence existed for the named behavior.
    decision_tree_trace:
      search_failure: >
        Matched because the evaluator names src/routes/project-edit.tsx as the
        missing evidence surface, while the delegate source_files and generated
        spec evidence stay entirely inside generic auth infrastructure.
      recognition_failure: >
        Not primary because the relevant edit-route evidence never entered the
        discovered file set in the first place.
      format_failure: >
        Not primary because the spec is structurally valid; the failure is wrong
        search scope and substitution behavior.
      prompt_failure: >
        Not primary because the active formula already requires agreement-state
        gating, predicate inventory, and exact/partial/mismatch handling.
      rubric_gap_failure: >
        Not primary because golden_set_recall and coverage_core_behavior already
        penalize this miss.
    actionable_recommendations:
      - >
        Mutate delegate generation to require golden evidence refs plus
        neighboring route/hook candidates for every conditional redirect
        behavior; block delegation if the named route surface is absent.
      - >
        Mutate draft/verify so a spec cannot keep the golden behavior id when it
        has zero direct evidence for the behavior's unique predicate
        (here: edit-route + agreement-state).
      - >
        Mutate drafting to prune unrelated auth refresh/token details unless they
        directly participate in the named gate.
    evidence_refs:
      - runs/run-0017/evaluator/output.yaml:11-18
      - runs/run-0017/evaluator/shadow-findings.yaml:20-32
      - runs/run-0017/generator/delegate/auth-conditional-redirect.yaml:1-20
      - runs/run-0017/generator/specs/auth-conditional-redirect.yaml:6-25
      - runs/run-0017/inputs/formula.yaml:18-34

  - spec_id: download-button-visibility
    golden_behavior_id: download-button-visibility
    achieved_coverage: partial
    primary_failure_type: recognition_failure
    diagnosis: >
      The generator reached the right UI neighborhood and accurately documented
      live behavior, but it misclassified thematic overlap as partial coverage of
      the golden behavior. The live code it cited shows two different things:
      the row-level Download button is always rendered and merely disabled until
      progressPercentage === 100, while a later overlay link appears after PDF
      generation finishes. The golden behavior is stricter: button visibility
      itself should wait for a separate download-stage gate. Because the
      relevant UI surfaces were inspected and a dedicated spec was produced, the
      main failure is recognition: the generator did not cleanly separate
      "visible-but-disabled" and "later-visible" into a mismatch against the
      golden wording.
    root_causes:
      delegation_manifest:
        - >
          The manifest pre-committed to the golden claim ("becomes visible only
          after report progress reaches the download stage") but did not require
          proof of which component owns visibility versus enablement, so the
          search space mixed row actions and overlay lifecycle code.
        - >
          It lacked a proof obligation to find the exact render gate or else
          explicitly declare the golden behavior unsupported by live code.
      spec_generator:
        - >
          It preserved the hidden-vs-disabled distinction in narrative form, but
          still treated the row button and the overlay link as one partially
          matching behavior instead of escalating to a mismatch for the row-level
          visibility claim.
        - >
          It widened inputs to include dlStatus="completed" even though the cited
          UI branches do not render that state, showing drift from directly
          evidenced behavior.
        - >
          It did not split the artifact into two separate behaviors: row action
          enablement and overlay download-link visibility.
    decision_tree_trace:
      search_failure: >
        Not primary because the generator inspected the relevant UI path
        (ReportsTable, ReportSplitActions, PdfGenerationOverlay) and produced a
        dedicated behavioral artifact.
      recognition_failure: >
        Matched because the generator found the files but collapsed two distinct
        predicates into a partial match instead of classifying the golden claim
        as a mismatch on visibility.
      format_failure: >
        Not primary because the schema is satisfied, although the unsupported
        dlStatus="completed" value is a secondary precision issue.
      prompt_failure: >
        Not primary because the active formula explicitly says to preserve
        hidden-vs-disabled differences and mark relation to golden wording as
        exact, partial, or mismatch.
      rubric_gap_failure: >
        Not primary because the current rubric already penalizes recall and core
        behavior mismatch here.
    actionable_recommendations:
      - >
        Mutate analyze/draft to require one predicate inventory entry per render
        surface; if one control is always visible-disabled and another appears
        later, they must become separate behaviors rather than one merged spec.
      - >
        Add a verify rule: when the golden wording says "visible only after X,"
        the artifact must either cite a direct hidden→visible render branch or
        mark the relation as mismatch/unsupported.
      - >
        Tighten input extraction so unsupported enumerants like
        dlStatus="completed" cannot appear without direct evidence.
    evidence_refs:
      - runs/run-0017/evaluator/output.yaml:24-32
      - runs/run-0017/evaluator/shadow-findings.yaml:34-45
      - runs/run-0017/evaluator/shadow-findings.yaml:57-64
