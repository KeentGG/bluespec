prior_context: |
  Main agent exploration notes:
  - The frozen golden behavior points to src/components/ReportActions.tsx, but the current dashboard-v2 target uses ReportSplitActions.tsx and ReportsTable.tsx instead.
  - ReportsTable passes report.reportProgressPercentage into ReportSplitActions.
  - ReportSplitActions computes canDownload = progressPercentage === 100 and disables the Download button until that threshold is reached.
  - reportProgressPercentage is derived in list-service.js through resolveCalculatorAwareProgressPercentage(), which maps each reportProgress route to a percentage in report-route-progress-contract.js.
  - Some calculators treat terminal routes such as /summary, /value-estimate, /net-proceeds-overview, /thankyou, or optional-questions routes as 100% complete.
  - Clicking Download starts PDF generation through useReportActions/useDownloadStore, then PdfGenerationOverlay shows waiting/finished/failed states and exposes the final download link only after generation finishes.
