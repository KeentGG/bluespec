'predicate_inventory':
  - 'behavior_id': 'auth_flow'
    'predicates':
      - 'isProtectedRoute(pathname) - checks if path is in PROTECTED_PATHS array'
      - 'normalizedSession !== null - session has valid _id and accessToken'
      - 'resolvedPath === routes.login - user is at login page'
      - 'hasValidToken (token._id && token.accessToken) - token exists in memory'
      - 'attemptTokenRefresh === true - should attempt token refresh on auth check'
      - 'refreshResult.success - token refresh succeeded'
      - 'isRefreshing || refreshPromise - refresh already in progress in this tab'
      - 'acquireRefreshLock() returns true - cross-tab lock acquired via localStorage'
      - 'isBroadcastSupported() - BroadcastChannel API available (not Edge Runtime)'
      - 'typeof window !== "undefined" - client-side environment'
      - 'typeof EdgeRuntime !== "undefined" - Edge Runtime environment'
      - 'localStorage.getItem(REFRESH_LOCK_KEY) exists and not expired (10s timeout)'
      - 'shouldResolveSession(pathname) - login or protected path'
      - 'hasRefreshToken (cookie contains refreshToken=) - refresh cookie exists'
      - 'rollbackRoute.shouldRedirect - QFM rollback gate triggered'
      - 'parseJwtPayload(token) !== null - token has valid JWT structure'
      - 'hasCsrfToken(cookieString) - CSRF token exists in cookie'
      - 'isCsrfTokenValid(token) - CSRF token length >= 10'
      - 'createCsrfRetryTracker().canRetry() - CSRF retry not exhausted'
    'render_mode': 'hidden'
  - 'behavior_id': 'stateful_ui'
    'predicates':
      - 'enabled && userId && businessId - SWR query should execute'
      - 'swrQuery.data !== undefined - data loaded successfully'
      - 'swrQuery.isLoading - currently fetching data'
      - 'swrQuery.error - fetch error occurred'
      - 'actionStore.isDownloading - download in progress for specific report'
      - 'actionStore.isRenaming - rename in progress for specific report'
      - 'actionStore.isDeleting - delete in progress for specific report'
      - 'actionStore.isEmailing - email in progress for specific report'
      - 'actionStore.anyActionInProgress - any action currently running'
      - 'editingReportId !== null - report name is being edited'
      - 'editingName.length > 0 - edit input has content'
      - 'report.isDownloadable - report supports PDF download'
      - 'timeSinceEditStart < RENAME_COMMIT_DEBOUNCE_MS (500ms) - debounce active'
      - 'trimmedName === originalName - no change detected'
      - 'trimmedName.length === 0 - empty name validation'
      - 'isBroadcastSupported() - cross-tab communication available'
    'render_mode': 'visible-enabled'
'behaviors_to_spec':
  - 'auth_flow'
  - 'stateful_ui'
'needs_deeper_exploration':
  - 'auth_flow: authErrorHandler.js - need to understand error handling and redirect logic'
  - 'auth_flow: user-service.js - need to understand user data fetching and profile management'
  - 'auth_flow: toa-contract.js - need to understand Terms of Acceptance contract'
  - 'stateful_ui: useCreateReportStore.ts - need to understand report creation modal state'
  - 'stateful_ui: useDownloadStore.ts - need to understand PDF download queue state'
  - 'stateful_ui: useReportsToolbarController.ts - need to understand toolbar filter/sort state'
  - 'stateful_ui: inFlightMutationGuard.js - need to understand QFM mutation guarding'
  - 'stateful_ui: storageSanitizer.js - need to understand storage cleanup logic'
