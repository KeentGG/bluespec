      export async function refreshAccessToken(options = {}) {
        if (isRefreshing || refreshPromise) {
          return refreshPromise || Promise.resolve({ success: false, error: 'Refresh in progress', token: null });
        }
        
        isRefreshing = true;
        refreshPromise = performCoordinatedRefresh(apiClient).finally(() => {
          isRefreshing = false;
          refreshPromise = null;
        });
        
        return refreshPromise;
      }
      
      function acquireRefreshLock() {
        if (typeof window === 'undefined') return true;
        const now = Date.now();
        const existing = localStorage.getItem(REFRESH_LOCK_KEY);
        if (existing) {
          const { timestamp } = JSON.parse(existing);
          if (now - timestamp < LOCK_TIMEOUT_MS) {
            return false;
          }
        }
        localStorage.setItem(REFRESH_LOCK_KEY, JSON.stringify({ timestamp: now, tabId: getTabId() }));
        return true;
      }
