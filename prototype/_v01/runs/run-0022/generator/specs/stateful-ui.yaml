'description': 'Manages stateful UI behavior for reports list including SWR-based data fetching with conditional execution, per-report action states (download, rename, delete, email), inline rename editing with debounce validation, and cross-tab state synchronization.'
'conditions':
  - 'id': 'swr_query_execution'
    'description': 'Controls whether SWR query should execute based on auth and business context'
    'trigger': 'Component mount or dependency change'
    'guards':
      - 'field': 'enabled'
        'condition': 'Query enabled flag is true'
      - 'field': 'userId'
        'condition': 'User ID exists in token'
      - 'field': 'businessId'
        'condition': 'Business ID is provided and non-empty'
    'then':
      - 'Execute SWR query with queryKey'
      - 'Fetch data from API'
    'else':
      - 'Skip query execution'
      - 'Return undefined data'
  - 'id': 'action_state_management'
    'description': 'Tracks per-report action states to prevent concurrent operations'
    'trigger': 'User initiates download, rename, delete, or email action'
    'guards':
      - 'field': 'anyActionInProgress'
        'condition': 'No other action running for this report'
    'then':
      - 'Set specific action flag to true'
      - 'Execute action'
      - 'Clear flag on completion'
    'else':
      - 'Disable UI controls for that report'
      - 'Show loading state'
  - 'id': 'inline_rename_validation'
    'description': 'Validates rename input with debounce and empty name check'
    'trigger': 'User commits rename (blur or enter)'
    'guards':
      - 'field': 'timeSinceEditStart'
        'condition': 'At least 500ms since edit started'
      - 'field': 'trimmedName'
        'condition': 'Name is not empty and different from original'
    'then':
      - 'Call patchReport API'
      - 'Show success toast'
      - 'Refresh list'
    'else':
      - 'If too soon: ignore commit'
      - 'If empty: show error toast'
      - 'If no change: cancel edit silently'
  - 'id': 'download_capability'
    'description': 'Controls download button based on report downloadability'
    'trigger': 'Report row renders'
    'guards':
      - 'field': 'report.isDownloadable'
        'condition': 'report.pdfSummary exists or isDownloadable flag is true'
    'then':
      - 'Enable download button'
      - 'Allow email PDF action'
    'else':
      - 'Disable download button'
      - 'Show tooltip: Report must be 100% complete'
      - 'Disable email action'
  - 'id': 'cross_tab_state_sync'
    'description': 'Synchronizes logout/login events across tabs'
    'trigger': 'BroadcastChannel or localStorage event'
    'guards':
      - 'field': 'isBroadcastSupported'
        'condition': 'BroadcastChannel API available'
    'then':
      - 'Listen for logout events'
      - 'Clear session on logout'
      - 'Redirect to /login on protected routes'
    'else':
      - 'Fallback to localStorage polling'
