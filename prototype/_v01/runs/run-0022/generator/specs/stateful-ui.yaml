  - 'path': '/Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/reports/hooks/useReportRenameAction.ts'
    'snippet': |
      const handleRename = useCallback(
        async (params: { reportId: string; newName: string }) => {
          const trimmedName = params.newName.trim();
          
          if (!trimmedName) {
            toast.error('Name cannot be empty.');
            return { success: false as const, reason: 'empty' as const };
          }
          
          try {
            const token = getToken();
            await patchReport({ _id: params.reportId, userId: token?._id, name: trimmedName });
            toast.success('Report renamed.');
            onSuccess?.();
            return { success: true as const };
          } catch (err: any) {
            toast.error(err.message || 'Rename failed.');
            return { success: false as const, reason: 'error' as const };
          }
        },
        [onSuccess]
      );
    'covers':
      - 'condition:inline_rename_validation'
