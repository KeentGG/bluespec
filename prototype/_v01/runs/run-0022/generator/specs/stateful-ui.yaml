    'snippet': |
      const [editingReportId, setEditingReportId] = useState<string | null>(null);
      const [editingName, setEditingName] = useState('');
      
      const commitRename = useCallback(
        async (reportId: string, force = false) => {
          const trimmedName = editingName.trim();
          const timeSinceEditStart = Date.now() - editStartTimeRef.current;
          
          if (!force && timeSinceEditStart < RENAME_COMMIT_DEBOUNCE_MS) {
            return { success: false, reason: 'too_soon' };
          }
          
          if (!force && trimmedName === originalNameRef.current.trim()) {
            setEditingReportId(null);
            return { success: true, reason: 'no_change' };
          }
          
          if (!trimmedName) {
            return { success: false, reason: 'empty' };
          }
          
          const result = await renameAction.rename({ reportId, newName: trimmedName });
          if (!result.success) return result;
          
          setEditingReportId(null);
          return { success: true };
        },
        [editingName, renameAction]
      );
    'covers':
      - 'condition:inline_rename_validation'
