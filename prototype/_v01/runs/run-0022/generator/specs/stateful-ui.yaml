      type ReportSplitActionsProps = {
        reportName: string;
        isDownloadable?: boolean;
        isDownloading?: boolean;
        isRenaming?: boolean;
        isDeleting?: boolean;
        isEmailing?: boolean;
        onDownload: (event: React.MouseEvent<HTMLButtonElement>) => void;
        onEditReport: () => void;
        onRename: () => void;
        onEmailPdf: () => void;
        onDelete: () => void;
      };
      
      export function ReportSplitActions({ isDownloadable = false, ... }) {
        const anyActionInProgress = isDownloading || isRenaming || isDeleting || isEmailing;
        const canDownload = isDownloadable;
        
        return (
          <Button disabled={isDownloading || !canDownload} ...>
            {isDownloading ? <><Spinner /> Downloading...</> : 'Download'}
          </Button>
          ...
        );
      }
