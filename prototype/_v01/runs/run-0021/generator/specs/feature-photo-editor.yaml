  - path: src/features/photo-editor/hooks/useDragPan.ts
    snippet: |
      export function useDragPan({ cropRect, setCropRect, imageSize }) {
        const [isDragging, setIsDragging] = useState(false);
        const startPos = useRef({ x: 0, y: 0 });
        const startCrop = useRef({ x: 0, y: 0 });
        const handlePointerDown = useCallback((e) => {
          setIsDragging(true);
          startPos.current = { x: e.clientX, y: e.clientY };
          startCrop.current = { x: cropRect.x, y: cropRect.y };
        }, [cropRect]);
        const handlePointerMove = useCallback((e) => {
          if (!isDragging) return;
          const deltaX = e.clientX - startPos.current.x;
          const deltaY = e.clientY - startPos.current.y;
          const newX = startCrop.current.x + deltaX;
          const newY = startCrop.current.y + deltaY;
          const clamped = clampCropRect({ x: newX, y: newY, size: cropRect.size }, imageSize);
          setCropRect(clamped);
        }, [isDragging, cropRect.size, imageSize]);
        const handlePointerUp = useCallback(() => { setIsDragging(false); }, []);
        return { isDragging, handlePointerDown, handlePointerMove, handlePointerUp };
      }
    covers:
      - state: idle
      - state: dragging
    line_range:
      start: 1
      end: 98
  - path: src/features/photo-editor/lib/constants.ts
    snippet: |
