id: feature-photo-editor
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: feature_photo_editor
    coverage: full
    notes: Photo editor with drag/pan interaction and canvas-based image manipulation
description: >
  Photo editor component for company logo uploads. Provides square-crop
  editor with 256x256 viewport, 200x200 crop zone, zoom slider (1x-3x),
  drag-to-pan via useDragPan hook, canvas-based crop generation, and
  Reset/Remove controls. Integrated into CompanyModals for logo upload.
state_machine:
  initial: idle
  states:
    - id: idle
      description: Image loaded, ready for editing
    - id: dragging
      description: User is dragging to pan image
    - id: cropping
      description: Generating cropped image via canvas
    - id: error
      description: Image load or processing failed
  transitions:
    - id: image_loaded
      from: idle
      to: idle
      trigger: File selected or dropped
      effects:
        - Load image into canvas
        - Calculate initial crop rect
    - id: drag_start
      from: idle
      to: dragging
      trigger: Mouse/touch down on crop area
      effects:
        - Record start position
    - id: drag_end
      from: dragging
      to: idle
      trigger: Mouse/touch up
      effects:
        - Update crop rect with new position
        - Generate cropped image via canvas
    - id: zoom_changed
      from: idle
      to: idle
      trigger: User adjusts zoom slider
      effects:
        - Calculate new crop size
        - Clamp crop rect to image bounds
        - Generate cropped image
inputs:
  - id: file
    type: File
    source: file input
    required: true
outputs:
  - id: croppedFile
    type: File
    destination: parent component
    lifespan: session
