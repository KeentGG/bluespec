      export function resolveCanonicalPlan({ sourceCalculatorId, targetCalculatorId }) {
        const key = `${sourceCalculatorId}->${targetCalculatorId}`;
        const mapping = CANONICAL_PLAN_MAPPINGS[key];
        if (!mapping) return { success: false, error: "unsupported_mapping" };
        if (mapping.deferred) return { success: false, error: "deferred" };
        return { success: true, template: mapping.template, operations: mapping.operations, fieldPairs: mapping.fieldPairs };
      }
    covers:
