id: feature-reports-templates
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: feature_reports_templates
    coverage: full
    notes: Report template system for different calculator types (DE, NP, VE, VGA)
description: >
  Report template system for four calculator types: VE (Value Estimate),
  DE (Discretionary Earnings), VGA (Value Gap Analysis), and NP (Net Proceeds).
  Each template defines structured question sets. Import engine orchestrates
  cross-calculator field mapping with 17 bidirectional field pairs between
  DE and VGA. NP is deferred (stub implementation).
state_machine:
  initial: idle
  states:
    - id: idle
      description: No template selected
    - id: selected
      description: Template selected, ready for data entry
    - id: importing
      description: Cross-calculator import in progress
    - id: complete
      description: Import or mapping complete
  transitions:
    - id: template_selected
      from: idle
      to: selected
      trigger: User selects calculator type in CreateReportModal
      effects:
        - Load template structure
        - Initialize empty question answers
    - id: import_started
      from: selected
      to: importing
      trigger: User initiates cross-calculator import
      effects:
        - Resolve canonical plan via import engine
        - Map fields between source and target templates
    - id: import_complete
      from: importing
      to: complete
      trigger: Field mapping completes
      effects:
        - Apply mapped values to target template
inputs:
  - id: calculatorId
    type: string
    source: calculator type selection
    required: true
outputs:
  - id: template
    type: object
    destination: report creation form
    lifespan: session
