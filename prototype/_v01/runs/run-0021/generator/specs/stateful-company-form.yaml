id: stateful-company-form
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: stateful_company_form
    coverage: full
    notes: Company add/edit form state management with validation
description: >
  Company add/edit form state management with 9+ useState calls for
  company name, logo file, cropped logo, existing logo URL, logo changes
  flag, drag state, logo error, and submission state. Logo validation
  with file type check and 15MB size limit. Drag/drop state toggling.
state_machine:
  initial: idle
  states:
    - id: idle
      description: Form ready for input
    - id: submitting
      description: Save request in flight
    - id: success
      description: Company saved, modal closes
    - id: error
      description: Save failed, error displayed
  transitions:
    - id: form_submit
      from: idle
      to: submitting
      trigger: User clicks Save button
      guards:
        - field: companyName
          condition: non-empty
      effects:
        - If editBusinessId: PATCH /companies/:id
        - If no editBusinessId: POST /companies
    - id: save_success
      from: submitting
      to: success
      trigger: Backend returns 200
      effects:
        - Close modal
        - Revalidate company list
    - id: save_failure
      from: submitting
      to: error
      trigger: Backend returns error
      effects:
        - Show error message
inputs:
  - id: companyName
    type: string
    source: text input
    required: true
  - id: logoFile
    type: File
    source: file drop zone
    required: false
    validation:
      maxSize: 15MB
      acceptedTypes: image/*
outputs:
  - id: company_data
    type: object
    destination: company list
    lifespan: session
evidence_refs:
  - path: src/features/company/hooks/useCompanyForm.ts
    snippet: |
      export function useCompanyForm({ editBusinessId, onClose, onSuccess }) {
        const [companyName, setCompanyName] = useState("");
        const [logoFile, setLogoFile] = useState<File | null>(null);
        const [croppedLogoFile, setCroppedLogoFile] = useState<File | null>(null);
        const [existingLogoUrl, setExistingLogoUrl] = useState<string | null>(null);
        const [hasLogoChanges, setHasLogoChanges] = useState(false);
        const [isDragging, setIsDragging] = useState(false);
        const [logoError, setLogoError] = useState<string | null>(null);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const handleFileDrop = useCallback((file: File) => {
          if (!file.type.startsWith("image/")) { setLogoError("Please upload an image file."); return; }
          if (file.size > 15 * 1024 * 1024) { setLogoError("File size must be less than 15MB."); return; }
          setLogoFile(file);
          setLogoError(null);
        }, []);
        const handleSubmit = async () => {
          if (!companyName.trim()) return;
          setIsSubmitting(true);
          try {
            if (editBusinessId) {
              await updateCompany({ id: editBusinessId, name: companyName, logo: croppedLogoFile || logoFile });
            } else {
              await createCompany({ name: companyName, logo: croppedLogoFile || logoFile });
            }
            onSuccess();
          } finally {
            setIsSubmitting(false);
          }
        };
        return { companyName, setCompanyName, logoFile, handleFileDrop, isDragging, setIsDragging, logoError, isSubmitting, handleSubmit, ... };
      }
    covers:
      - state: idle
      - state: submitting
      - state: success
      - state: error
    line_range:
      start: 48
      end: 167
  - path: src/features/company/components/CompanyModals.tsx
    snippet: |
      <TextInput value={companyName} onChange={(e) => setCompanyName(e.target.value)} placeholder="Company Name" />
      <div onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={() => setIsDragging(false)} onDrop={handleDrop}>
        {logoFile ? <LogoPhotoEditor file={logoFile} onChange={handleLogoCrop} onRemove={handleLogoRemove} /> : <DropZone />}
      </div>
      {logoError && <p className="text-red-500">{logoError}</p>}
      <Button onClick={handleSubmit} disabled={isSubmitting || !companyName.trim()}>
        {isSubmitting ? "Saving..." : "Save"}
      </Button>
    covers:
      - state: idle
      - state: submitting
    line_range:
      start: 127
      end: 239
confidence: 0.8
confidence_rationale: >
  Company form fully traced across hook and component. Nine useState calls
  with validation confirmed. Logo upload with drag/drop and size limit
  verified. Edit vs create submission paths documented.
unresolved_questions: []
status: complete
