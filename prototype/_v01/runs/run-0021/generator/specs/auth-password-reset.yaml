id: auth-password-reset
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: auth_password_reset
    coverage: full
    notes: Two-step flow: request reset email, then update password with token
description: >
  Password reset request and update flow. Step 1: User submits email to
  POST /auth/request-link. Step 2: User clicks link in email, lands on
  reset page with token, submits new password to POST /auth/update-password.
  On success, redirects to /login.
state_machine:
  initial: request_form
  states:
    - id: request_form
      description: Email input form for reset request
    - id: request_submitting
      description: Reset request API call in flight
    - id: request_success
      description: Reset email sent, show confirmation
    - id: request_error
      description: Reset request failed
    - id: update_form
      description: New password form with token from URL
    - id: update_submitting
      description: Password update API call in flight
    - id: update_success
      description: Password updated, redirect to /login
    - id: update_error
      description: Password update failed
  transitions:
    - id: submit_request
      from: request_form
      to: request_submitting
      trigger: User clicks Reset Password button
      effects:
        - POST /auth/request-link with email
    - id: request_success
      from: request_submitting
      to: request_success
      trigger: Backend returns 200
      effects:
        - Show generic success message (does not reveal if email exists)
    - id: request_failure
      from: request_submitting
      to: request_error
      trigger: Backend returns non-200
      effects:
        - Show error message
    - id: submit_update
      from: update_form
      to: update_submitting
      trigger: User clicks Update Password button
      guards:
        - field: resetToken
          condition: present in URL search params
        - field: newPassword
          condition: non-empty
      effects:
        - POST /auth/update-password with newPassword
        - Authorization header: Bearer resetToken
    - id: update_success
      from: update_submitting
      to: update_success
      trigger: Backend returns 200
      effects:
        - bootstrapResetPasswordToLogin()
        - Redirect to /login
    - id: update_failure
      from: update_submitting
      to: update_error
      trigger: Backend returns non-200
      effects:
        - Show error message
inputs:
  - id: email
    type: string
    source: email input field
    required: true
  - id: resetToken
    type: string
    source: URL search params (?token=...)
    required: true
  - id: newPassword
    type: string
    source: password input field
    required: true
outputs:
  - id: redirect_to_login
    type: URL
    destination: router
    lifespan: immediate
evidence_refs:
  - path: src/features/auth/components/ResetPasswordPageContent.tsx
    snippet: |
      async function handleSubmit(event) {
        event.preventDefault();
        if (isLoading) return;
        setErrorMessage("");
        setSuccessMessage("");
        setIsLoading(true);
        const trimmedEmail = email.trim();
        try {
          const response = await requestPasswordReset({ email: trimmedEmail }, { client: apiClient });
          if (response.ok || response.statusCode === 200) {
            setSuccessMessage("If an account exists, a password reset link has been sent to your email.");
          } else {
            setErrorMessage(response.message || "Failed to request a password reset. Please try again.");
          }
        } finally {
          setIsLoading(false);
        }
      }
    covers:
      - transition: submit_request
      - transition: request_success
      - transition: request_failure
    line_range:
      start: 31
      end: 56
  - path: src/features/auth/api/auth-service.js
    snippet: |
      export async function requestPasswordReset({ email }, options = {}) {
        const client = getClient(options);
        return client.post({
          path: "/auth/request-link",
          body: { email },
          skipTokenRefresh: true,
          skipAuthErrorHandling: true,
        });
      }
      export async function updatePassword({ resetToken, newPassword }, options = {}) {
        const client = getClient(options);
        return client.post({
          path: "/auth/update-password",
          body: { newPassword },
          headers: {
            Authorization: `Bearer ${resetToken}`,
            RequestToken: `Bearer ${resetToken}`,
          },
          skipTokenRefresh: true,
          skipAuthErrorHandling: true,
        });
      }
    covers:
      - transition: submit_request
      - transition: submit_update
    line_range:
      start: 61
      end: 83
  - path: src/features/auth/api/sessionBootstrap.js
    snippet: |
      export async function bootstrapResetPasswordToLogin(options = {}) {
        const { resetPasswordResponse, routes } = options;
        const resolvedRoutes = resolveResetPasswordRoutes(routes);
        const isSuccess = parseResetPasswordSuccessEnvelope(resetPasswordResponse);
        if (!isSuccess) {
          return createDecision("none", null, "reset_password_envelope_not_success", false, false);
        }
        return createDecision("redirect", resolvedRoutes.login, "reset_password_success_redirect_login", false, false);
      }
    covers:
      - transition: update_success
    line_range:
      start: 211
      end: 227
confidence: 0.9
confidence_rationale: >
  Password reset flow fully traced across ResetPasswordPageContent, auth-service,
  and sessionBootstrap. Two-step flow confirmed with generic success message
  for security. Token-based password update verified.
unresolved_questions: []
status: complete
