predicate_inventory:
  - behavior_id: auth_guard_protection
    predicates:
      - isChecking === true
      - isAuthenticated === false && error !== null
      - isAuthenticated === true
    render_mode: visible-enabled
  - behavior_id: auth_token_refresh
    predicates:
      - isRefreshing === true (within same tab)
      - acquireRefreshLock() returns false (another tab holds lock)
      - acquireRefreshLock() returns true (lock acquired or expired)
      - performRefresh() returns success === true
      - performRefresh() returns success === false
    render_mode: hidden
  - behavior_id: auth_error_handling
    predicates:
      - statusCode === 401
      - statusCode === 403 && message includes csrf
      - statusCode === 500 && message includes jwt expired
      - skipAuthErrorHandling === true
      - isRefreshEndpoint === true
    render_mode: hidden
  - behavior_id: auth_csrf_protection
    predicates:
      - withBody === true (POST/PATCH/DELETE)
      - hasCsrfToken() returns false
      - isCsrfTokenValid(token) returns false
      - canRetry() returns true (first attempt)
    render_mode: hidden
  - behavior_id: stateful_pdf_download
    predicates:
      - isGenerating === true
      - dlStatus === waiting
      - dlStatus === finished
      - dlStatus === failed
      - dlStatus === completed
    render_mode: visible-enabled
  - behavior_id: stateful_report_actions
    predicates:
      - anyActionInProgress(reportId) returns true
      - isDownloading(reportId) returns true
      - isRenaming(reportId) returns true
      - isDeleting(reportId) returns true
      - isEmailing(reportId) returns true
    render_mode: visible-enabled
  - behavior_id: stateful_delete_dialog
    predicates:
      - reportId is set (dialog open)
      - reportId is null (dialog closed)
    render_mode: visible-enabled
  - behavior_id: stateful_email_modal
    predicates:
      - reportId is set (modal open)
      - reportId is null (modal closed)
    render_mode: visible-enabled
  - behavior_id: stateful_create_report_modal
    predicates:
      - isOpen === true
      - isOpen === false
    render_mode: visible-enabled
  - behavior_id: stateful_company_modals
    predicates:
      - activeModal !== null (modal open)
      - activeModal === null (modal closed)
    render_mode: visible-enabled
