  Drafted 31 behavioral specs for the EOYT dashboard-v2 codebase covering 10
  auth behaviors, 13 stateful UI behaviors, 5 infrastructure behaviors, and 3
  feature behaviors. Each spec includes id, type, version, golden_behaviors with
  coverage, state_machine or conditions where applicable, inputs/outputs,
  evidence_refs with actual code snippets and line ranges, confidence score, and
  confidence rationale. All evidence was gathered from direct source file reads
  across the codebase. Average confidence: 0.88. All specs use the schema
  defined in schemas/spec.schema.yaml.
