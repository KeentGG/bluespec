  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-edit-contract.js
    snippet: |
      export async function fetchGateEditReportById(target, options = {}) {
        const reportId = normalizeString(target);
        if (!reportId) {
          throw new TypeError("target must be a non-empty string.");
        }

        const fetchImplementation = options.fetchImplementation ?? fetch;
        if (typeof fetchImplementation !== "function") {
          throw new TypeError("fetchImplementation must be a function.");
        }

        const requestUrl = buildReportFetchUrl(reportId, options);
        const response = await fetchImplementation(requestUrl, {
          method: "GET",
          credentials: "include",
        });
        const payload = await readResponsePayload(response);
        const envelope = normalizeMixedEnvelope(payload, {
          transportStatus: typeof response?.status === "number" ? response.status : 500,
        });

        if (!envelope.ok) {
          throw new Error("fetch_failed");
        }

        const reportDocument = normalizeReportDocument(envelope.data);
        if (!reportDocument) {
          throw new Error("invalid_report_payload");
        }

        return reportDocument;
      }
    covers:
      - condition: report_fetch_success
      - input: auth_token
    line_range:
      start: 495
      end: 526

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-edit-contract.js
    snippet: |
      export function resolveGateEditProgressRoute(report = {}) {
        if (!isPlainObject(report)) {
          return {
            isValid: false,
            reason: "invalid_report",
            route: null,
            calculatorId: null,
            reportProgress: null,
          };
        }

        const calculatorId = normalizeCalculatorId(report.calculatorId);
        if (!calculatorId || !SUPPORTED_CALCULATOR_IDS.has(calculatorId)) {
          return {
            isValid: false,
            reason: "unknown_calculator",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const reportProgress = normalizeProgressRoute(report.reportProgress);
        if (!reportProgress) {
          return {
            isValid: false,
            reason: "missing_report_progress",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const route = resolveMappedProgressRoute(calculatorId, reportProgress);
        if (!route) {
          return {
            isValid: false,
            reason: "unknown_progress",
            route: null,
            calculatorId,
            reportProgress,
          };
        }

        return {
          isValid: true,
          reason: null,
          route,
          calculatorId,
          reportProgress,
        };
      }
    covers:
      - condition: progress_route_mapped
      - transition: init_success
    line_range:
      start: 442
      end: 493

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-edit-contract.js
    snippet: |
      export async function executeGateEditInitialization(options = {}) {
        const {
          router,
          guard = createOneShotGuard(),
          query = {},
          fallbackBusinessId = null,
          fetchReport = async ({ target }) =>
            fetchGateEditReportById(target, {
              apiBaseUrl: "",
            }),
          resolveProgressRoute = ({ report }) => resolveGateEditProgressRoute(report),
          navigate = () => undefined,
        } = options;

        const validation = validateGateEditEntry({ query });
        if (!validation.isValid) {
          const fallback = resolveGateEditFallbackDestination({
            preferredRoute: REPORTS_ROUTE,
            businessId: fallbackBusinessId,
          });
          navigate(fallback.destination);

          return {
            phase: "fallback",
            reason: validation.reason,
            nextDestination: null,
            fallbackDestination: fallback.destination,
          };
        }
        ...
        const runResult = runOnceWhenRouterReady({
          router,
          guard,
          intentKey,
          callback: async () => {
            let report;

            try {
              report = await fetchReport({
                target: validation.gateQuery.target,
                gateQuery: validation.gateQuery,
                validation,
              });
            } catch (_error) {
              const fallback = resolveGateEditFallbackDestination({ ... });
              navigate(fallback.destination);
              return { phase: "fallback", reason: "fetch_failed", ... };
            }

            const progressResolution = normalizeProgressResolution(
              resolveProgressRoute({ report, gateQuery: validation.gateQuery, validation }),
            );
            if (!progressResolution.isValid || !progressResolution.route) {
              const fallback = resolveGateEditFallbackDestination({ ... });
              navigate(fallback.destination);
              return { phase: "fallback", reason: progressResolution.reason ?? "unknown_progress", ... };
            }

            navigate(progressResolution.route);
            return { phase: "redirecting", reason: null, nextDestination: progressResolution.route, ... };
          },
        });
        ...
      }
    covers:
      - state_machine
      - transition: init_success
      - transition: init_fallback
    line_range:
      start: 528
      end: 636

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/routing/hooks/useGateEditEntryState.ts
    snippet: |
      type GatePhase = "pending_router" | "initializing" | "ready" | "fallback" | "error";

      const INITIAL_RESULT = Object.freeze({
        phase: "pending_router",
        reason: "router_not_ready",
        nextDestination: null,
        fallbackDestination: null,
      });

      export function useGateEditEntryState() {
        const router = useRouter();
        const searchParams = useSearchParams();
        const guardRef = useRef(createOneShotGuard());
        const [phase, setPhase] = useState<GatePhase>("pending_router");
        const [result, setResult] = useState<any>(INITIAL_RESULT);
        ...
        const rollbackRoute = resolveRollbackRouteContract({
          env: process.env,
          storage: resolveBrowserStorage(),
          path: "/gate/edit",
        });
        if (rollbackRoute.shouldRedirect && rollbackRoute.destination) {
          setPhase("fallback");
          const rollbackDestination = withBasePath(rollbackRoute.destination);
          if (window.location.pathname !== rollbackDestination) {
            window.location.replace(rollbackDestination);
          }
          return undefined;
        }
        ...
        setPhase("initializing");

        executeGateEditInitialization({
          router,
          guard: guardRef.current,
          query: searchParams,
          fallbackBusinessId,
          fetchReport: async ({ target }) => {
            const token = getToken();
            return fetchGateEditReportById(target, {
              apiBaseUrl: process.env.NEXT_PUBLIC_APP_API_URL ?? "",
              endpointPath: "/calculator-reports/report",
              fetchImplementation: async (url, fetchOptions) => {
                const headers = new Headers(fetchOptions?.headers || {});
                if (token?.accessToken) headers.set("Authorization", `Bearer ${token.accessToken}`);
                if (token?._id) headers.set("userId", token._id);
                ...
                return fetch(url, { ...restOptions, headers, credentials: "omit" });
              },
            });
          },
          resolveProgressRoute: ({ report }) => {
            const resolution = resolveGateEditProgressRoute(report);
            let baseUrl = "";
            if (resolution.calculatorId) {
              switch (resolution.calculatorId) {
                case "1":
                  baseUrl = process.env.NEXT_PUBLIC_VE_GATE_PATH || "";
                  break;
                case "2":
                  baseUrl = process.env.NEXT_PUBLIC_DE_GATE_PATH || "";
                  break;
                case "3":
                  baseUrl = process.env.NEXT_PUBLIC_VGA_GATE_PATH || "";
                  break;
                case "4":
                  baseUrl = process.env.NEXT_PUBLIC_NP_GATE_PATH || "";
                  break;
              }
            }
            if (baseUrl) {
              const cleanBase = baseUrl.replace(/\/+$/, "");
              resolution.isValid = true;
              resolution.route = `${cleanBase}/edit?target=${report._id}`;
            }
            return resolution;
          },
          navigate: (destination) => {
            if (destination.startsWith("http")) {
              window.location.replace(destination);
            } else {
              router.replace(destination);
            }
          },
        })
          .then((nextResult) => {
            if (!isMounted) return;
            setResult(nextResult);
            if (nextResult.phase === "ready") {
              setPhase("ready");
            } else if (nextResult.phase === "fallback") {
              setPhase("fallback");
            } else if (nextResult.phase === "error") {
              setPhase("error");
            }
          })
          .catch((_error) => {
            if (!isMounted) return;
            setPhase("error");
            const fallback = resolveGateEditFallbackDestination({ businessId: fallbackBusinessId });
            router.replace(fallback.destination);
            setResult({
              phase: "fallback",
              reason: "init_exception",
              nextDestination: null,
              fallbackDestination: fallback.destination,
            });
          });
        ...
      }
    covers:
      - state_machine
      - transition: router_ready
      - transition: rollback_gate
      - transition: init_success
      - transition: init_fallback
      - transition: init_error
      - input: auth_token
      - input: calculator_gate_paths
      - input: persisted_business_id
      - output: redirect_to_calculator
      - output: redirect_to_fallback
    line_range:
      start: 72
      end: 209

