confidence: 0.85
confidence_rationale: >
  State transitions and query param validation are fully confirmed in 4 source files.
  The report-fetch flow, progress route mapping for all 4 calculators, and fallback
  behavior are explicitly implemented. However, the "agreement state satisfied" guard
  from the golden behavior is NOT present in the edit flow — it only exists in the
  create flow (useReportCreation.ts). The spec therefore has partial coverage of the
  golden behavior. Additionally, the exact shape of the rollback route contract is
  imported but not fully inspected here.

unresolved_questions:
  - "Does the rollback route contract ever trigger for /gate/edit in production?"
  - "Is there any server-side TOA check before the client ever reaches /gate/edit?"
  - "What happens if the calculator gate path env var is missing — is there a secondary fallback?"
  - "Are there analytics or logging hooks in the gate flow that are not visible in these files?"

status: partial
