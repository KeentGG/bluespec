id: auth.conditional-redirect
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: auth-conditional-redirect
    coverage: partial
    notes: >
      The spec documents the gated edit flow (query param validation, report fetching,
      progress route mapping, and redirect) fully. However, the golden behavior states
      "only when agreement state is satisfied" — there is NO agreement state (TOA) check
      in the edit flow. The TOA check only exists in the CREATE flow (useReportCreation.ts).
      Therefore the conditional-gate aspect of the golden behavior is NOT evidenced.

description: >
  When a user clicks "Edit" on an existing report, the dashboard navigates to
  `/gate/edit?target=<reportId>&calculatorId=<1-4>`. The system validates the query
  parameters, fetches the report from the API to determine the last saved progress route,
  maps that route to a calculator-specific resume point, and redirects the user to the
  calculator's gate URL with the report ID. If validation fails, the report cannot be
  fetched, or the progress route is unmapped, the user is redirected to a fallback
  destination (typically `/reports`). There is no terms-of-agreement (TOA) gate in the
  edit flow.

state_machine:
  initial: pending_router
  states:
    - id: pending_router
      description: Waiting for Next.js router to be ready before beginning gate validation.
    - id: initializing
      description: Router is ready; query params are being validated and the report is being fetched.
    - id: ready
      description: Report progress resolved successfully; user is being redirected to the calculator resume point.
    - id: fallback
      description: Validation failed, report fetch failed, or progress unmapped; user is being redirected to the fallback destination.
    - id: error
      description: An unrecoverable exception occurred during initialization.
  transitions:
    - id: router_ready
      from: pending_router
      to: initializing
      trigger: Next.js router becomes ready and no rollback gate is active
      guards: []
      effects:
        - begin query param validation
        - initiate report fetch
    - id: init_success
      from: initializing
      to: ready
      trigger: executeGateEditInitialization resolves with phase "ready"
      guards:
        - field: query_params
          condition: target and calculatorId are valid
        - field: report_fetch
          condition: API returns a valid report document
        - field: progress_resolution
          condition: report progress maps to a known calculator route
      effects:
        - redirect browser to calculator gate URL with resume route
    - id: init_fallback
      from: initializing
      to: fallback
      trigger: executeGateEditInitialization resolves with phase "fallback"
      guards: []
      effects:
        - redirect browser to fallback destination (typically /reports)
    - id: init_error
      from: initializing
      to: error
      trigger: executeGateEditInitialization throws an unhandled exception
      guards: []
      effects:
        - redirect browser to fallback destination
    - id: rollback_gate
      from: pending_router
      to: fallback
      trigger: Rollback route contract indicates v1 dashboard redirect is active
      guards: []
      effects:
        - replace window.location with rollback destination

conditions:
  - id: query_param_validation
    description: Query parameters target and calculatorId must be present and valid.
    trigger: Page load or router ready
    guards:
      - field: target
        condition: non-empty string (report ID)
      - field: calculatorId
        condition: "1, 2, 3, or 4"
    then:
      - proceed to report fetch
    else:
      - redirect to fallback destination
  - id: report_fetch_success
    description: The report must be successfully retrieved from the API.
    trigger: After query param validation passes
    guards:
      - field: api_response
        condition: HTTP 200 with a valid report document in the envelope
    then:
      - proceed to progress route resolution
    else:
      - redirect to fallback destination with reason "fetch_failed"
  - id: progress_route_mapped
    description: The report's saved progress route must map to a known route for the calculator.
    trigger: After successful report fetch
    guards:
      - field: reportProgress
        condition: matches a known route pattern for the given calculatorId
    then:
      - redirect to calculator gate URL with mapped route
    else:
      - redirect to fallback destination with reason "unknown_progress"
  - id: rollback_gate_active
    description: If the rollback-to-v1-dashboard flag is active, redirect immediately.
    trigger: Page load before any initialization
    guards:
      - field: rollbackRouteContract
        condition: shouldRedirect is true and destination is set
    then:
      - replace location with rollback destination
    else:
      - continue normal gate initialization

inputs:
  - id: target
    type: string (report ID)
    source: URL query parameter
    required: true
    validation:
      non_empty: "must be a non-empty string"
  - id: calculatorId
    type: string ("1" | "2" | "3" | "4")
    source: URL query parameter
    required: true
    validation:
      one_of: "1, 2, 3, or 4"
  - id: source
    type: string
    source: URL query parameter
    required: false
    validation: {}
  - id: auth_token
    type: JWT access token + userId
    source: tokenService (localStorage / memory)
    required: true
    validation:
      bearer: "Authorization: Bearer <accessToken> header"
      userId: "userId header from token._id"
  - id: persisted_business_id
    type: string
    source: localStorage (REPORTS_PERSISTED_BUSINESS_KEY)
    required: false
    validation: {}
  - id: api_base_url
    type: string URL
    source: process.env.NEXT_PUBLIC_APP_API_URL
    required: true
    validation: {}
  - id: calculator_gate_paths
    type: string URLs
    source: process.env.NEXT_PUBLIC_VE_GATE_PATH, NEXT_PUBLIC_DE_GATE_PATH, NEXT_PUBLIC_VGA_GATE_PATH, NEXT_PUBLIC_NP_GATE_PATH
    required: true
    validation: {}

outputs:
  - id: redirect_to_calculator
    type: HTTP redirect (client-side router.replace or window.location.replace)
    destination: calculator gate URL with edit query parameter, e.g. `/business-value-estimate-calculator/gate/edit?target=<reportId>`
    lifespan: immediate
  - id: redirect_to_fallback
    type: HTTP redirect (client-side)
    destination: /reports or /reports#<businessId>
    lifespan: immediate
  - id: ui_state
    type: object { heading, detail, fallbackDestination }
    destination: GateStatusView component
    lifespan: session

