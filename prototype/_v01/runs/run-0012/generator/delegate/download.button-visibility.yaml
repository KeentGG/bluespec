prior_context: |
  Main agent exploration notes:
  - The evidence_ref `src/components/ReportActions.tsx` does NOT exist in this codebase.
  - The actual download button visibility behavior is in ReportSplitActions.tsx.
  - ReportSplitActions.tsx receives `progressPercentage` as a prop.
  - It computes `canDownload = progressPercentage === 100`.
  - The Download button is disabled (gray bg, cursor-not-allowed) when `!canDownload`.
  - The button title shows "Report must be 100% complete to download" when disabled.
  - useReportActions.ts provides the `handleDownloadReport` callback which calls
    `startDownload` from the PDF download store.
  - useReportActionStore.ts tracks per-report download loading states.
  - report-route-progress-contract.js maps calculator routes to progress percentages.
  - For all calculators, the `/report` route (or equivalent final routes like `/summary`,
    `/value-estimate`, `/thankyou`) map to 100% progress.
  - The download stage is implicitly defined as progressPercentage === 100.
