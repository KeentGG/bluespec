confidence_rationale: |
  High confidence because the generator explicitly self-reported the stale references,
  and the evaluator independently confirmed the resulting recall miss. The analyzer's
  diagnosis of search_failure is strongly grounded and points directly to a missing
  validation step in explore. The 0.12 uncertainty stems from two unknowns: (1) whether
  the correct edit-flow file exists elsewhere in the codebase and was simply not found,
  or (2) whether the TOA guard is genuinely absent from the implementation. In either
  case, the proposed mutation produces the correct outcome — either locating the evidence
  or explicitly flagging it as unrecoverable. The successful precedent of step_management
  on explore in run-0003 further supports viability.
