proposed_change:
  type: "step_management"
  target_step: "explore"
  current: |
    The explore step produces trace, exploration_notes, and state_machine_boundaries.
    It maps source files and behavior boundaries but does not validate that referenced
    file paths actually exist in the target codebase. When a mapped path is stale or
    renamed, the generator proceeds to analyze using the incorrect reference, leading
    to unevidenced behavior claims and recall misses.
  proposed: |
    Add a reference-validation and stale-reference-recovery sub-step to the explore phase:

    1. verify_references: After initial file mapping, verify every referenced file path
       exists in the target codebase. Flag any missing paths explicitly.

    2. ecosystem_recovery: For each missing path, trigger a secondary search using
       ecosystem-specific conventions:
       - Next.js app-router: check app/ vs pages/, route.ts vs page.tsx, [param] folders
       - Feature restructures: check src/features/*/components/, src/app/*/, src/routes/*/
       - Component renames: search for similar filenames, exported symbols, or route segments

    3. proceed_gate: Only proceed to the analyze step once all references are resolved
       to existing files or explicitly flagged as unrecoverable with a reason code
       (e.g., "file_deleted", "renamed_unfound", "ecosystem_mismatch").

    Add two new outputs to the explore step:
    - verified_references: list of resolved file paths with verification status
    - unresolved_references: list of stale/missing paths with reason codes and recovery attempts
  expected_improvement: |
    Eliminates recall misses caused by stale file paths. The generator will locate the
    correct edit-flow implementation (e.g., the actual Next.js app-router edit page)
    and accurately verify whether the TOA agreement-state guard exists in the edit flow.
    Expected recall for auth.conditional-redirect to rise from 0.50 to >=0.90. Similar
    recall improvements for any behavior whose evidence depends on correctly mapped
    source files.
  risk: |
    Low. The change adds validation overhead but prevents cascading failures from
    incorrect evidence refs. Minor risk of false negatives if recovery heuristics are
    too strict and reject valid but unconventional path patterns. Risk of increased
    token usage during the recovery search phase. If the correct file genuinely does
    not exist, the generator will now explicitly flag "unrecoverable" instead of
    silently using a stale ref, which improves precision even if recall remains partial.
  rationale: |
    The generator explicitly self-reported two stale references:
    - src/routes/project-edit.tsx (does not exist in this Next.js app-router codebase)
    - src/components/ReportActions.tsx (does not exist; actual file is in src/features/)
    The evaluator independently confirmed a high-severity recall miss on
    auth-conditional-redirect because the generator could not analyze the actual edit
    flow. The analyzer traced the root cause to search_failure in the explore step.
    Adding reference validation + ecosystem-aware recovery directly fixes the failure
    mode without changing prompts, rubric, or schema.
