  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/auth/contracts/toa-contract.js
    snippet: |
      export function resolveToaStatus(userData) {
        if (!isPlainObject(userData)) {
          return {
            hasAgreedToa: false,
            isValid: false,
            reason: "invalid_user_data",
          };
        }

        return {
          hasAgreedToa: userData.agreedToa === true,
          isValid: true,
          reason: null,
        };
      }

      export function resolveToaRedirectRoute(options = {}) {
        const { userData, calculatorId, businessId, reportName, env } = options;

        const toaStatus = resolveToaStatus(userData);

        if (!toaStatus.isValid) {
          return {
            ok: false,
            shouldRedirect: false,
            url: null,
            reason: toaStatus.reason,
          };
        }

        if (toaStatus.hasAgreedToa) {
          return {
            ok: true,
            shouldRedirect: false,
            url: null,
            reason: null,
          };
        }

        const introUrl = buildIntroductionUrl({
          calculatorId,
          businessId,
          reportName,
          env,
        });

        return {
          ok: true,
          shouldRedirect: true,
          url: introUrl.url,
          reason: "toa_not_agreed",
        };
      }
    line_range:
      start: 38
      end: 173
    covers:
      - condition:create_requires_agreement
      - output:introduction_redirect_url
  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/reports/hooks/useReportNavigation.ts
    snippet: |
      export function useReportNavigation() {
        const router = useRouter();

        function navigateToReportGate(
          report: Report,
          options: NavigateToReportOptions = {},
        ) {
          const handoff = resolveGateHandoffRoute({
            intent: "edit",
            target: report?._id,
            calculatorId: report?.calculatorId,
            env: process.env,
            gatePathsByCalculatorId: GATE_PATHS_BY_CALCULATOR_ID,
          });

          if (!handoff.ok || !handoff.destination) {
            toast.error("Unable to open the selected report.");
            if (handoff.fallbackDestination) {
              router.push(handoff.fallbackDestination);
            }
            return;
          }

          if (handoff.destination.startsWith("http")) {
            window.location.replace(handoff.destination);
            return;
          }

          router.push(handoff.destination);
        }
      }
    line_range:
      start: 24
      end: 53
    covers:
      - condition:edit_handoff_is_ordinary_route_resolution
      - output:gate_handoff_destination
      - output:fallback_destination
      - output:error_toast
  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-finder.js
    snippet: |
      function buildValidatedActionRoute(options, mode) {
        const producerQueryPayload = resolveProducerQueryPayload(options);
        const producerQueryValidation = validateGateQuery(producerQueryPayload);

        if (!producerQueryValidation.isValid) {
          return createBaseFailure(producerQueryValidation.reason);
        }

        const target = producerQueryValidation.target;

        if (!target) {
          return createBaseFailure("missing_target");
        }

        const gatePathResolution = resolveGatePathForCalculator(options.calculatorId, options);
        if (!gatePathResolution.ok) {
          return {
            ok: false,
            reason: gatePathResolution.reason,
            destination: null,
          };
        }

        try {
          const destination =
            mode === "new"
              ? buildGateNewUrl(gatePathResolution.gatePath, {
                  target,
                  source: producerQueryValidation.source,
                  name: producerQueryValidation.name,
                })
              : buildGateEditUrl(gatePathResolution.gatePath, { target });

          return {
            ok: true,
            reason: null,
            destination,
          };
        } catch (_error) {
          return {
            ok: false,
            reason: "build_failed",
            destination: null,
          };
        }
      }

      export function resolveGateHandoffRoute(options = {}) {
        const intent = normalizeHandoffIntent(options.intent);
        const fallbackDestination = resolveHandoffFallbackDestination(
          intent ?? GATE_HANDOFF_INTENTS.EDIT,
          options,
        );
    line_range:
      start: 236
      end: 335
    covers:
      - condition:edit_handoff_is_ordinary_route_resolution
      - output:gate_handoff_destination
      - output:fallback_destination
  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-edit-contract.js
    snippet: |
      export function resolveGateEditProgressRoute(report = {}) {
        if (!isPlainObject(report)) {
          return {
            isValid: false,
            reason: "invalid_report",
            route: null,
            calculatorId: null,
            reportProgress: null,
          };
        }

        const calculatorId = normalizeCalculatorId(report.calculatorId);
        if (!calculatorId || !SUPPORTED_CALCULATOR_IDS.has(calculatorId)) {
          return {
            isValid: false,
            reason: "unknown_calculator",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const reportProgress = normalizeProgressRoute(report.reportProgress);
        if (!reportProgress) {
          return {
            isValid: false,
            reason: "missing_report_progress",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const route = resolveMappedProgressRoute(calculatorId, reportProgress);
        if (!route) {
          return {
            isValid: false,
            reason: "unknown_progress",
            route: null,
            calculatorId,
            reportProgress,
          };
        }

        return {
          isValid: true,
          reason: null,
          route,
          calculatorId,
          reportProgress,
        };
      }

      export async function executeGateEditInitialization(options = {}) {
        const {
          router,
          guard = createOneShotGuard(),
          query = {},
          fallbackBusinessId = null,
          fetchReport = async ({ target }) =>
            fetchGateEditReportById(target, {
              apiBaseUrl: "",
            }),
          resolveProgressRoute = ({ report }) => resolveGateEditProgressRoute(report),
          navigate = () => undefined,
        } = options;

        const validation = validateGateEditEntry({ query });
        if (!validation.isValid) {
          const fallback = resolveGateEditFallbackDestination({
            preferredRoute: REPORTS_ROUTE,
            businessId: fallbackBusinessId,
          });
          navigate(fallback.destination);
          return {
            phase: "fallback",
            reason: validation.reason,
            nextDestination: null,
            fallbackDestination: fallback.destination,
          };
        }
    line_range:
      start: 442
      end: 635
    covers:
      - condition:edit_resume_uses_saved_progress
      - state:fallback
      - output:resume_route
      - output:fallback_destination
  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-edit-contract.js
    snippet: |
      export function resolveGateEditUiState(result, options = {}) {
        const fallback = resolveGateEditFallbackDestination({
          preferredRoute: options.preferredRoute ?? REPORTS_ROUTE,
          businessId: options.businessId ?? null,
        });
        const fallbackDestination = normalizeString(result?.fallbackDestination) ?? fallback.destination;

        if (!result || result.phase === "pending_router") {
          return {
            heading: "Preparing report resume",
            detail: "Validating route target before loading report progress.",
            fallbackDestination,
          };
        }

        if (result.phase === "redirecting") {
          return {
            heading: "Redirecting",
            detail: `Continuing to ${result.nextDestination}.`,
            fallbackDestination: normalizeString(result.nextDestination) ?? fallbackDestination,
          };
        }

        if (result.phase === "duplicate") {
          return {
            heading: "Resume already processed",
            detail: `This resume intent already ran. Continue to ${fallbackDestination} if needed.`,
            fallbackDestination,
          };
        }

        return {
          heading: "Unable to resume report",
          detail: `Redirecting to ${fallbackDestination} due to ${result.reason ?? "resume failure"}.`,
          fallbackDestination,
        };
      }
    line_range:
      start: 638
      end: 674
    covers:
      - condition:edit_resume_uses_saved_progress
      - state:fallback
