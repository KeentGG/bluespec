confidence_rationale: >
  The TOA agreement check, introduction redirect, edit handoff validation, and
  resume redirect are all confirmed in the explored files. The stale golden
  wording names an edit route and agreement state together, but the current code
  splits those concerns across create-report TOA gating and ordinary edit handoff
  logic.
unresolved_questions:
  - Whether the stale golden should be remapped to the create-flow TOA gate or split from the edit resume flow in downstream specs.
  - Whether the introduction / commitment redirect should be treated as part of the primary auth behavior or as a related precondition flow.
status: partial
