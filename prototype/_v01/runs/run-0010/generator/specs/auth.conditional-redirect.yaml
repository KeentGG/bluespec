id: auth.conditional-redirect.yaml
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: auth-conditional-redirect
    coverage: partial
    notes: >
      The live code implements TOA agreement gating in the report-creation flow and
      an ordinary report-edit handoff separately. The stale golden wording points at
      an edit route, but the agreement check actually lives in create-report logic.
description: >
  Report actions route through two separate branches. Create-report submits check
  whether the user has agreed to TOA: if not, the flow builds an introduction/
  commitment URL and redirects there; if yes, it creates the report and then hands
  off to the calculator gate. Edit actions resolve a gate handoff and resume route
  from saved report progress, but they do not consult the agreement flag.
state_machine:
  initial: awaiting_action
  states:
    - id: awaiting_action
      description: The user has not yet submitted a create or edit report action.
    - id: toa_redirect
      description: The create action is being redirected to the introduction page because agreement is missing.
    - id: creating_report
      description: The create action has passed agreement gating and is creating the report.
    - id: gate_handoff
      description: A successfully created report is being handed off to the calculator gate.
    - id: resume_redirect
      description: An edit action is resuming an existing report from saved progress.
    - id: fallback
      description: The flow cannot continue safely and returns to a fallback route.
  transitions:
    - id: create_without_agreement
      from: awaiting_action
      to: toa_redirect
      trigger: User submits Create Report and agreedToa is false
      guards:
        - field: agreed_toa
          condition: userData.agreedToa is false
      effects:
        - Build an introduction URL for the selected calculator
        - Redirect to the introduction / commitment page after the TOA notice
    - id: create_with_agreement
      from: awaiting_action
      to: creating_report
      trigger: User submits Create Report and agreedToa is true
      guards:
        - field: agreed_toa
          condition: userData.agreedToa is true
      effects:
        - Create the report with default progress
        - Preserve the selected calculator and business context
    - id: create_succeeds
      from: creating_report
      to: gate_handoff
      trigger: Report creation succeeds
      effects:
        - Navigate to the calculator gate or questionnaire handoff
    - id: edit_action_valid
      from: awaiting_action
      to: resume_redirect
      trigger: Report row Edit action resolves a valid handoff
      guards:
        - field: target
          condition: report._id is present
        - field: calculator_id
          condition: calculatorId resolves to a supported gate path
        - field: report_progress
          condition: saved progress route maps to a valid resume route
      effects:
        - Redirect into the calculator gate / resume route
    - id: validation_failure
      from: creating_report
      to: fallback
      trigger: Validation, fetch, or route resolution fails
      effects:
        - Navigate to the fallback destination
        - Show an error toast when handoff resolution fails
conditions:
  - id: create_requires_agreement
    description: Report creation redirects to the introduction page when TOA agreement is missing.
    trigger: Create Report submit
    guards:
      - field: agreed_toa
        condition: userData.agreedToa is false
    then:
      - Build an introduction URL from the calculator gate path
      - Redirect to the introduction / commitment page
    else:
      - Continue to report creation
  - id: edit_handoff_is_ordinary_route_resolution
    description: Existing report edit resolves a gate handoff and resume route without checking TOA agreement.
    trigger: Edit report action
    guards:
      - field: target
        condition: report._id is present
      - field: calculator_id
        condition: calculatorId resolves to a supported gate path
    then:
      - Resolve the edit handoff route
      - Navigate to the calculator gate URL
    else:
      - Show an error toast
      - Push the fallback destination if available
  - id: edit_resume_uses_saved_progress
    description: The edit resume path uses saved report progress to choose the continuation route.
    trigger: Gate-edit initialization after report fetch
    guards:
      - field: report_progress
        condition: saved progress route is recognized for the report's calculator
    then:
      - Redirect to the mapped resume route
    else:
      - Redirect to the reports fallback
inputs:
  - id: agreement_state
    type: boolean from user profile
    source: auth user data (`agreedToa`)
    required: true
  - id: create_form
    type: report creation input object
    source: Create Report modal submit
    required: true
    validation:
      report_name: non-empty trimmed string
      business_id: non-empty selected company id
      calculator_id: one of 1,2,3,4
  - id: report_record
    type: report object with _id, calculatorId, reportProgress
    source: report row or fetched report payload
    required: true
  - id: auth_token
    type: access token + user id
    source: token service
    required: false
  - id: gate_path_map
    type: calculatorId→gate path map
    source: environment configuration
    required: false
  - id: persisted_business_id
    type: business id string
    source: browser localStorage
    required: false
outputs:
  - id: introduction_redirect_url
    type: URL
    destination: browser location.replace
    lifespan: immediate
  - id: created_report
    type: report object
    destination: reports API / follow-up gate handoff
    lifespan: persistent
  - id: gate_handoff_destination
    type: URL or in-app route
    destination: router.push or window.location.replace
    lifespan: immediate
  - id: resume_route
    type: calculator-specific resume path
    destination: calculator gate URL
    lifespan: immediate
  - id: fallback_destination
    type: in-app route or rollback URL
    destination: router.push or window.location.replace
    lifespan: immediate
  - id: error_toast
    type: toast notification
    destination: react-toastify UI
    lifespan: ephemeral
evidence_refs:
