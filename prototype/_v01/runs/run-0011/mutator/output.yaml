confidence_rationale: |
  The diagnosis is strongly grounded and internally consistent across generator flags,
  evaluator recall misses, and evaluator rubric_gap_candidates. The proposed criteria
  exactly match the gaps identified. Confidence is reduced from 0.90 to 0.85 because
  rubric mutations are consequential: adding three criteria at once is a larger change
  than a prompt tweak, and the scoring dynamics (especially the golden_set_recall weight
  reduction) have not been empirically validated in a live run. Nonetheless, the
  prior learned lesson that rubric_candidate_proposal passed for this failure type
  provides strong support for the approach.
