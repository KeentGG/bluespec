proposed_change:
  type: "rubric_mutation"
  target_step: null
  current: |
    Rubric v002 contains 5 criteria: coverage_core_behavior, completeness_inputs_outputs,
    consistency_cross_refs, golden_set_recall (weight 1.2), conditional_flow_documentation.
    It lacks any axis to reward accurate observation when golden wording diverges from
    observed code, when visibility predicates are finer-grained than the golden claims,
    or when cross-system flows span unavailable code boundaries.
  proposed: |
    Add three new active criteria to the rubric and reduce golden_set_recall weight:

    1. stale_golden_vs_observed_implementation (weight 1.0)
       - +1 when the spec accurately documents observed code behavior that contradicts
         the golden wording
       - -1 when the spec blindly copies the golden without code evidence

    2. predicate_level_visibility_distinction (weight 0.8)
       - +1 when conditional UI predicates are documented at the granularity of
         hidden / visible-disabled / visible-enabled
       - 0 when collapsed to a single boolean

    3. cross_system_boundary_coverage (weight 0.6)
       - +1 when cross-system flows are explicitly scoped (e.g.,
         "dashboard-side verified, calculator-side implied")
       - -1 when the spec silently assumes unverified behavior

    Reduce golden_set_recall weight from 1.2 to 0.9 so that stale-golden mismatches
    do not dominate the recall score.
  expected_improvement: |
    Estimated recall improvement: 0.58 -> 0.82.
    The three recall misses caused by rubric gaps would convert to hits or partial hits
    under the new criteria. Cross-system boundary flows would receive partial credit
    instead of full misses. Precision and consistency scores are expected to remain stable
    (~0.86 and ~0.87).
  risk: |
    Medium-low. Adding three new criteria simultaneously could introduce scoring
    instability if the evaluator applies them inconsistently. Reducing golden_set_recall
    weight risks under-penalizing genuine misses where the golden is actually correct
    and the generator failed to find the behavior. However, the analyzer ruled out
    search, recognition, format, and prompt failures with strong evidence, making
    genuine misses unlikely for these four cases.
  rationale: |
    The generator followed the formula prompts precisely, producing evidence-backed specs
    that faithfully document observed code. The evaluator penalized these accurate specs
    because the rubric only measures fidelity to golden wording (golden_set_recall) and
    has no axis for code-faithful observation. All four recall misses share this single
    root cause. A prompt_tweak cannot fix a rubric gap — this was attempted in run-0010
    and failed (see insanity_check). The correct fix is rubric expansion.
