    snippet: |
      export function validateGateEditEntry(options = {}) {
        const { query = {} } = options;
        const gateQuery = validateGateQuery(query);

        if (!gateQuery.isValid) {
          return {
            isValid: false,
            reason: gateQuery.reason,
            gateQuery,
          };
        }

        return {
          isValid: true,
          reason: null,
          gateQuery,
        };
      }
    covers:
