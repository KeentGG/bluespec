      const rollbackRoute = resolveRollbackRouteContract({
        env: process.env,
        storage: resolveBrowserStorage(),
        path: "/gate/edit",
      });
      if (rollbackRoute.shouldRedirect && rollbackRoute.destination) {
        setPhase("fallback"); // Rollback gate tripped — redirect to v1 dashboard
        const rollbackDestination = withBasePath(rollbackRoute.destination);
        if (window.location.pathname !== rollbackDestination) {
          window.location.replace(rollbackDestination);
        }
        return undefined;
      }
