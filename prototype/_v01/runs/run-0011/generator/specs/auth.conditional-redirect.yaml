id: auth.conditional-redirect
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: auth-conditional-redirect
    coverage: partial
    notes: |
      The spec documents the complete gated edit/resume flow mechanics
      (validation, fetch, progress resolution, redirect, fallback), but
      the golden behavior's claim of "only when agreement state is satisfied"
      is NOT evidenced in the edit flow code. No agreement/TOA gating was
      found in any analyzed file; agreement logic appears confined to
      TOA/new-report creation paths. Coverage is partial due to this mismatch.

description: |
  When a user clicks "Edit" on an existing report in the dashboard, the
  system routes through a gated edit entry flow that validates query
  parameters, fetches the report from the API, resolves the report's saved
  progress into a calculator-specific resume route, and redirects the user
  to the correct calculator gate page. If validation fails, the report
  cannot be fetched, or the progress route is unresolvable, the user is
  redirected to a fallback destination (/reports or /companies). The flow
  does NOT check agreement/TOA state before allowing edit access.

state_machine:
  initial: pending_router
  states:
    - id: pending_router
      description: Waiting for Next.js router to be ready before beginning initialization.
    - id: initializing
      description: Validating query params, fetching report, resolving progress route.
    - id: ready
      description: Redirecting to the calculator gate URL with the resolved resume route.
    - id: fallback
      description: Validation or fetch failed; redirecting to fallback destination.
    - id: error
      description: Unrecoverable exception occurred during initialization.
  transitions:
    - id: router_ready
      from: pending_router
      to: initializing
      trigger: Next.js router becomes ready
      guards:
        - field: rollback_gate
          condition: Rollback to v1 dashboard is NOT active
      effects:
        - Set phase to initializing
    - id: init_success
      from: initializing
      to: ready
      trigger: executeGateEditInitialization succeeds
      guards:
        - field: query_params
          condition: target (reportId) is present and valid, calculatorId is present
        - field: report_fetch
          condition: API returns a valid report document
        - field: progress_resolution
          condition: reportProgress maps to a supported route for the calculator
      effects:
        - Navigate to calculator gate URL with resume route
        - Set phase to ready
    - id: init_failure
      from: initializing
      to: fallback
      trigger: executeGateEditInitialization fails
      guards:
        - field: failure_reason
          condition: Any of invalid query, fetch failure, unknown calculator, missing progress, or unmapped route
      effects:
        - Navigate to fallback destination (/reports or /companies)
        - Set phase to fallback
    - id: init_exception
      from: initializing
      to: error
      trigger: Uncaught exception during initialization
      effects:
        - Navigate to fallback destination
        - Set phase to error

conditions:
  - id: rollback_gate_check
    description: Before initializing, check if the app should redirect to the legacy v1 dashboard.
    trigger: Page load at /gate/edit
    guards:
      - field: rollback_route_contract
        condition: resolveRollbackRouteContract returns shouldRedirect=true
    then:
      - Redirect to rollback destination
    else:
      - Proceed to initialization

  - id: query_param_validation
    description: Validate that required query parameters are present for the edit gate.
    trigger: executeGateEditInitialization begins
    guards:
      - field: target
        condition: Non-empty report ID from query string
      - field: calculatorId
        condition: Non-empty calculator identifier from query string
    then:
      - Proceed to report fetch
    else:
      - Navigate to fallback destination with reason "missing_target" or equivalent

  - id: calculator_support_check
    description: Ensure the report's calculator is one of the four supported tools.
    trigger: resolveGateEditProgressRoute is called with report data
    guards:
      - field: calculatorId
        condition: Must be "1" (VE), "2" (DE), "3" (VGA), or "4" (NP)
    then:
      - Attempt to map reportProgress to a supported route
    else:
      - Return failure reason "unknown_calculator"

  - id: progress_route_resolution
    description: Map the report's last saved route to a valid calculator resume route.
    trigger: Report fetch succeeds
    guards:
      - field: reportProgress
        condition: Present and non-empty string starting with "/"
      - field: mapped_route
        condition: Matches exact routes or allowed patterns for the specific calculator
    then:
      - Build calculator gate URL with target reportId and resume route
    else:
      - Return failure reason "unknown_progress" or "missing_report_progress"

inputs:
  - id: target
    type: string (report ID)
    source: URL query parameter "target"
    required: true
    validation:
      non_empty: Must be a non-empty string

  - id: calculatorId
    type: string | number (1-4)
    source: URL query parameter "calculatorId"
    required: true
    validation:
      supported: Must map to VE, DE, VGA, or NP

  - id: source
    type: string (optional source identifier)
    source: URL query parameter "source"
    required: false

  - id: auth_token
    type: JWT bearer token + userId header
    source: tokenService.getToken()
    required: true
    validation:
      accessToken: Must be present for Authorization header
      _id: Must be present for userId header

  - id: report_document
    type: API response object
    source: GET /calculator-reports/report/{target}
    required: true
    validation:
      ok: API response envelope must indicate success
      data: Must contain a valid report document with calculatorId and reportProgress

  - id: env_gate_paths
    type: object of environment variables
    source: process.env
    required: false
    validation:
      gate_path: NEXT_PUBLIC_*_GATE_PATH variables optionally override defaults

outputs:
  - id: calculator_redirect
    type: HTTP redirect (external or internal)
    destination: Calculator gate URL with query params (target, route)
    lifespan: immediate

  - id: fallback_redirect
    type: HTTP redirect (internal)
    destination: /reports or /companies, optionally with businessId hash
    lifespan: immediate

  - id: ui_state
    type: object { heading, detail, fallbackDestination }
    destination: GateStatusView component for user feedback during transitions
    lifespan: session (re-computed on each render)

