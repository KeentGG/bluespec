      - input: target
      - input: calculatorId
    line_range:
      start: 404
      end: 421

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-edit-contract.js
    snippet: |
      export function resolveGateEditProgressRoute(report = {}) {
        if (!isPlainObject(report)) {
          return {
            isValid: false,
            reason: "invalid_report",
            route: null,
            calculatorId: null,
            reportProgress: null,
          };
        }

        const calculatorId = normalizeCalculatorId(report.calculatorId);
        if (!calculatorId || !SUPPORTED_CALCULATOR_IDS.has(calculatorId)) {
          return {
            isValid: false,
            reason: "unknown_calculator",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const reportProgress = normalizeProgressRoute(report.reportProgress);
        if (!reportProgress) {
          return {
            isValid: false,
            reason: "missing_report_progress",
            route: null,
            calculatorId,
            reportProgress: null,
          };
        }

        const route = resolveMappedProgressRoute(calculatorId, reportProgress);
        if (!route) {
          return {
            isValid: false,
            reason: "unknown_progress",
            route: null,
            calculatorId,
            reportProgress,
          };
        }

        return {
          isValid: true,
          reason: null,
          route,
          calculatorId,
          reportProgress,
        };
      }
    covers:
      - condition: calculator_support_check
      - condition: progress_route_resolution
      - input: report_document
    line_range:
      start: 442
      end: 493

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/shared/lib/routing/gate-edit-contract.js
    snippet: |
      export async function executeGateEditInitialization(options = {}) {
        const validation = validateGateEditEntry({ query });
        if (!validation.isValid) {
          const fallback = resolveGateEditFallbackDestination({...});
          navigate(fallback.destination);
          return {
            phase: "fallback",
            reason: validation.reason,
            nextDestination: null,
            fallbackDestination: fallback.destination,
          };
        }

        const intentKey = createGateEditIntentKey(validation.gateQuery);
        const runResult = runOnceWhenRouterReady({
          router,
          guard,
          intentKey,
          callback: async () => {
            let report;
            try {
              report = await fetchReport({...});
            } catch (_error) {
              const fallback = resolveGateEditFallbackDestination({...});
              navigate(fallback.destination);
              return {
                phase: "fallback",
                reason: "fetch_failed",
                nextDestination: null,
                fallbackDestination: fallback.destination,
              };
            }

            const progressResolution = normalizeProgressResolution(resolveProgressRoute({ report }));
            if (!progressResolution.isValid || !progressResolution.route) {
              const fallback = resolveGateEditFallbackDestination({...});
              navigate(fallback.destination);
              return {
                phase: "fallback",
                reason: progressResolution.reason ?? "unknown_progress",
                nextDestination: null,
                fallbackDestination: fallback.destination,
              };
            }

            navigate(progressResolution.route);
            return {
              phase: "redirecting",
              reason: null,
              nextDestination: progressResolution.route,
              fallbackDestination: null,
            };
          },
        });
    covers:
      - transition: init_success
      - transition: init_failure
      - transition: init_exception
      - output: fallback_redirect
      - output: calculator_redirect
    line_range:
      start: 528
      end: 636

confidence: 0.75
confidence_rationale: |
  State machine and all transitions are confirmed directly in code across
  7 source files. Query validation, report fetching, progress route
  resolution, and fallback behavior are all explicitly implemented and
  traceable. However, confidence is reduced because the golden behavior
  claims the flow is gated "only when agreement state is satisfied", and
  NO agreement or TOA state checks were found anywhere in the edit/resume
  flow. The agreement-related logic appears to live exclusively in the
  new-report creation paths (TOA gating). Whether the calculator itself
  performs a post-redirect agreement check is unknown from the available
  code. The spec therefore accurately represents the dashboard-side
  behavior but cannot confirm the agreement condition claimed by the
  golden set.

unresolved_questions:
  - Where, if anywhere, is agreement/TOA state checked before or during
    the edit flow? The dashboard-side code contains no such check.
  - Does the calculator gate page perform its own agreement validation
    after receiving the redirect from the dashboard?
  - What happens when a user attempts to edit a report associated with
    a company whose TOA has expired or been revoked?
  - Is the "gated" terminology in the golden behavior intended to refer
    to the query/param validation gates, or was an actual agreement
    check expected but not implemented?

status: partial
