prior_context: |
  Main agent exploration notes:
  - CreateReportModal collects company, calculator, and report-name inputs and submits through useCreateReportModal().
  - useCreateReportModal delegates submission to useReportCreation.handleCreateReport().
  - useReportCreation fetches user data first and checks userResult.data?.agreedToa === true before creating any report.
  - If TOA is not agreed, the hook shows a success toast, builds an introduction URL from calculatorId + businessId + reportName, redirects with window.location.replace(), and returns early.
  - The createReport() API call only happens in the hasAgreedToa branch, so dashboard-side report persistence is deferred until after TOA acceptance.
  - buildIntroductionUrl() appends businessId and reportname query params to the calculator introduction route derived from the calculator gate path.
  - After TOA is already agreed, the dashboard creates the report and then navigates through the edit-style gate handoff to the calculator.
  - No direct dashboard-side check for "no existing reports" was found; the current code gates by TOA status, not explicit first-report count.
  - The spec should capture the verified deferred-creation branch and note any golden wording that is broader or narrower than the current implementation.
