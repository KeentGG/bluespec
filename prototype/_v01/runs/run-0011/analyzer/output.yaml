    proposed_weight: 0.8

  - id: "cross_system_boundary_coverage"
    name: "Cross-System Boundary Coverage"
    rationale: "Provides partial credit for flows spanning multiple systems when only one system's code is available."
    applies_to_misses:
      - "toa.gated-first-report-creation.yaml"
    proposed_weight: 0.6

