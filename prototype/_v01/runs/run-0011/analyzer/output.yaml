confidence_rationale: |
  The diagnosis is strongly grounded. The generator flags, evaluator recall misses,
  and evaluator rubric_gap_candidates are internally consistent and point to a single
  root cause. The formula prompt text proves the generator was instructed to look for
  the very behaviors it accurately reported as absent or different. No evidence
  supports search, recognition, format, or prompt failure. The only plausible
  explanation is rubric underspecification. Confidence is not 1.0 because we cannot
  fully rule out that the agreement-state check or calculator-side creation exists
  in unanalyzed files outside the prototype scope; however, the generator's honest
  reporting and the evaluator's rubric-gap proposals make this the overwhelmingly
  likely diagnosis.

