proposed_change:
  type: step_management
  target_step: "formula root"
  current: >
    Formula steps flow directly from analyze (produces predicate_inventory) to
    draft (produces spec_set). There is no explicit validation that every golden
    behavior aspect is accounted for in the predicate inventory before drafting
    begins. The analyze step instructions alone are insufficient to prevent the
    generator from collapsing semantic distinctions.
  proposed: >
    Insert a new step `golden_validate` between `analyze` and `draft`.
    Prompt: "Cross-reference the predicate_inventory against every golden
    behavior aspect. For each aspect: (a) mark as found / collapsed / missing,
    (b) cite the matching predicate_id or explain the collapse, (c) list
    evidence_refs from both code and golden set. Output a coverage_gap_report.
    If any aspect is marked missing, STOP and surface the gap; do not proceed
    to draft until the gap is resolved or explicitly flagged as unrecoverable."
    Outputs: coverage_gap_report, golden_cross_ref_map.
  expected_improvement: >
    Prevents silent collapse of semantic distinctions (agreement-state guard
    conflated with auth redirect, visible conflated with enabled, calculator-side
    report creation omitted) by forcing explicit golden-to-predicate mapping
    before drafting. Surfaces recognition failures as blockers rather than
    letting them propagate into drafted specs.
  risk: medium
  rationale: >
    The analyzer identified that the generator collapsed semantic distinctions
    despite the analyze step's explicit instructions to preserve them. A
    verification_crosscheck step mandates explicit mapping, making any collapse
    visible and blocking. The lesson index shows verification_crosscheck
    previously PASSED for recognition_failure on conditional UI visibility,
    indicating this teaching method is effective for this failure type.
