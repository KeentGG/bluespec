id: routing-contracts
version: "1.0"
type: spec
ecosystem: frontend
golden_behaviors:
  - id: routing_contracts
    coverage: full
    notes: "Gate entry routing with query validation and origin checks"
description: >
  Validates routing parameters for gate entry points including edit and new
  report flows. Checks query parameters, validates allowed origins, and
  resolves handoff routes with progress mapping.
conditions:
  - id: gateQueryIsValid
    description: "Validates required query parameters for gate entry"
    trigger: "Gate page loads"
    guards:
      - field: gateQuery
        condition: "gateQuery.isValid === true"
    then:
      - "Proceed with gate initialization"
    else:
      - "Redirect to fallback destination"
  - id: normalizedCurrentOriginInResolvedAllowedOrigins
    description: "Checks if current origin is in allowed origins list"
    trigger: "Gate validation"
    guards:
      - field: normalizedCurrentOrigin
        condition: "normalizedCurrentOrigin in resolvedAllowedOrigins"
    then:
      - "Allow gate entry"
    else:
      - "Redirect to fallback"
  - id: isAllowedReferrerPath
    description: "Validates referrer path against allowed patterns"
    trigger: "Gate validation"
    guards:
      - field: isAllowedReferrerPath
        condition: "isAllowedReferrerPath(parsedReferrer.pathname)"
    then:
      - "Allow gate entry"
    else:
      - "Redirect to fallback"
  - id: normalizedReferrerNull
    description: "Allows entry when referrer is unavailable (browser privacy)"
    trigger: "Gate validation"
    guards:
      - field: normalizedReferrer
        condition: "normalizedReferrer === null → allow (browser privacy)"
    then:
      - "Allow gate entry without referrer validation"
inputs:
  - id: searchParams
    type: "URLSearchParams"
    source: "URL query string"
    required: true
  - id: calculatorId
    type: string
    source: "Query parameter"
    required: true
  - id: target
    type: string
    source: "Query parameter"
    required: true
outputs:
  - id: resolution
    type: "GateResolution object"
    destination: "Router redirect"
    lifespan: "Immediate"
evidence_refs:
