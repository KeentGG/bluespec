      export async function handleAuthError(options = {}) {
        const { 
          redirectUrl = "/login", 
          reason = "session_expired",
          skipRedirect = false 
        } = options;

        // Prevent concurrent handling
        if (isAuthErrorHandling) {
          return { handled: false, reason: "already_handling" };
        }

        isAuthErrorHandling = true;

        try {
          // Clear client data cache first
          await clearClientDataCache();

          // Clear auth session state
          clearToken();

          // Clear only explicitly known auth keys (not pattern-based)
          if (typeof window !== "undefined") {
            try {
              for (const key of EOYT_AUTH_KEYS) {
                try {
                  window.localStorage.removeItem(key);
                } catch (_e) {
                  // Ignore localStorage errors for individual keys
                }
              }
            } catch (_e) {
              // Ignore localStorage errors
            }
          }

          // Redirect to login page (unless skipRedirect)
          if (!skipRedirect && typeof window !== "undefined") {
            // Add reason to URL for user feedback
            const separator = redirectUrl.includes("?") ? "&" : "?";
            const fullUrl = `${withBasePath(redirectUrl)}${separator}reason=${encodeURIComponent(reason)}`;

            // Use replace to prevent back-button returning to authenticated page
            window.location.replace(fullUrl);
          }

          return {
            handled: true,
            redirectUrl: skipRedirect ? null : redirectUrl,
            reason,
          };

        } catch (error) {
          return {
            handled: false,
            error: error.message,
            reason: "handler_error",
          };
        } finally {
          // Reset flag after a short delay to allow redirect to start
          setTimeout(() => {
            isAuthErrorHandling = false;
          }, 100);
        }
      }
