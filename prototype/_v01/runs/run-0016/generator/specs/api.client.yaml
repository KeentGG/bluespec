  - path: src/features/auth/api/tokenRefresher.js
    snippet: |
      export async function refreshAccessToken(options = {}) {
        // Promise-based lock: if refresh is in progress in THIS tab, return existing promise
        // Use || for safety - if either flag is set, we're refreshing
        if (isRefreshing || refreshPromise) {
          log("Refresh already in progress in this tab, waiting...");
          return (
            refreshPromise ||
            Promise.resolve({ success: false, error: "Refresh in progress", token: null })
          );
        }

        const { apiClient } = options;

        isRefreshing = true;

        refreshPromise = performCoordinatedRefresh(apiClient).finally(() => {
          isRefreshing = false;
          refreshPromise = null;
        });

        return refreshPromise;
      }

      async function performCoordinatedRefresh(apiClient) {
        // Try to acquire cross-tab lock
        const hasLock = acquireRefreshLock();

        if (!hasLock) {
          // Another tab is refreshing, wait for its result
          log("Waiting for another tab to complete refresh...");

          try {
            const { waitForResult } = await getCrossTab();
            const result = await waitForResult({
              storageKey: REFRESH_RESULT_KEY,
              eventType: "TOKEN_REFRESHED",
              timeoutMs: 8000,
            });

            if (result && result.success) {
              // Apply the token from the other tab
              log("Applying token from other tab's refresh");
              setToken(result.token);
              return result;
            }
          } catch (error) {
            log("Cross-tab wait failed, proceeding with own refresh:", error.message);
          }

          // If other tab failed or timed out, try to acquire lock again
          log("Other tab refresh failed or timed out, trying to acquire lock...");
          if (!acquireRefreshLock()) {
            log("Still couldn't acquire lock, proceeding with caution");
          }
        }

        try {
          const result = await performRefresh(apiClient);

          // Broadcast result to other tabs
          if (result.success) {
            log("Refresh successful, broadcasting to other tabs");
            try {
              const { broadcastMessage } = await getCrossTab();
              broadcastMessage({
                eventType: "TOKEN_REFRESHED",
                data: result,
                storageKey: REFRESH_RESULT_KEY,
                cleanupMs: 500,
              });
            } catch (error) {
              log("Cross-tab broadcast failed:", error.message);
            }
          }

          return result;
        } finally {
          releaseRefreshLock();
        }
      }
    covers:
      - state:refreshing_credentials
      - condition:coordinated_refresh_lock
      - transition:response_requires_refresh
      - output:refreshed_token
    line_range:
      start: 139
      end: 222

  - path: src/features/auth/api/tokenRefresher.js
    snippet: |
      async function performRefresh(apiClient) {
        try {
          // Create timeout promise that resolves (not rejects) with a marker
          const timeoutPromise = new Promise((resolve) => {
            setTimeout(() => resolve({ __timeout: true }), REFRESH_TIMEOUT_MS);
          });

          // Race between API call and timeout
          const result = await Promise.race([
            refreshToken({}, apiClient ? { client: apiClient } : {}),
            timeoutPromise,
          ]);

          // Check if timeout won
          if (result && result.__timeout) {
            log(`REFRESH TIMEOUT: No response after ${REFRESH_TIMEOUT_MS}ms`);
            return {
              success: false,
              error: `Token refresh timed out after ${REFRESH_TIMEOUT_MS}ms`,
              token: null,
            };
          }

          const actualResponse = result;
          const raw = actualResponse?.raw;
          const rawStatusCode = raw?.statusCode ?? actualResponse?.statusCode;

          if (actualResponse?.error || (typeof rawStatusCode === "number" && rawStatusCode >= 400)) {
            return {
              success: false,
              error: raw?.message || actualResponse?.message || "Token refresh failed",
              statusCode: rawStatusCode,
              token: null,
            };
          }

          const userData = raw?.user ?? raw?.data?.user;

          if (!userData || typeof userData.accessToken !== "string" || typeof userData._id !== "string") {
            return {
              success: false,
              error: "No access token in refresh response",
              token: null,
            };
          }

          const newTokenPayload = {
            _id: userData._id,
            email: typeof userData.email === "string" ? userData.email : "",
            accessToken: userData.accessToken,
          };

          // Extract CSRF token from refresh response (backend may return it in body or header)
          const csrfToken = raw?.csrfToken ?? raw?.data?.csrfToken ?? null;

          setToken(newTokenPayload);

          return {
            success: true,
            token: newTokenPayload,
            csrfToken, // Include CSRF token for client-side access after refresh
            message: raw?.message || "Token refreshed successfully",
          };
        } catch (error) {
          return {
            success: false,
            error: error?.message || "Token refresh error",
            token: null,
          };
        }
      }
    covers:
      - transition:refresh_retries_request
      - transition:refresh_failure_escalates
      - output:refreshed_token
    line_range:
      start: 226
      end: 295

  - path: src/shared/lib/qfm/responseAdapter.js
    snippet: |
      function detectContractFailure({ normalized, transportResponse, originalInput }) {
        if (!isValidHttpStatusCode(normalized.statusCode)) {
          return createContractFailure(
            "invalid_normalized_status",
            "Normalized response statusCode is not a valid HTTP status code.",
          );
        }

        if (transportResponse && !hasOwn(transportResponse, "data")) {
          return createContractFailure(
            "missing_transport_data",
            "Transport response is missing required data payload.",
          );
        }

        if (normalized.envelopeType === "wrapped") {
          const wrapped = normalized.raw;

          if (!isPlainObject(wrapped) || !hasOwn(wrapped, "statusCode")) {
            return createContractFailure(
              "missing_envelope_status_code",
              "Wrapped response envelope is missing statusCode.",
            );
          }

          if (!isValidHttpStatusCode(wrapped.statusCode)) {
            return createContractFailure(
              "invalid_envelope_status_code",
              "Wrapped response envelope contains an invalid statusCode.",
            );
          }

          if (!hasOwn(wrapped, "data")) {
            return createContractFailure(
              "missing_envelope_data",
              "Wrapped response envelope is missing required data field.",
            );
          }
        }

        if (typeof normalized.data === "undefined") {
          return createContractFailure(
            "missing_normalized_data",
            "Normalized response data is undefined.",
          );
        }

        if (typeof originalInput === "undefined") {
          return createContractFailure("missing_payload", "Response payload is undefined.");
        }

        return null;
      }

      export function normalizeQfmResponse(responseOrPayload, options = {}) {
        const transportResponse = isTransportResponseLike(responseOrPayload) ? responseOrPayload : null;
        const payload = transportResponse
          ? hasOwn(transportResponse, "data")
            ? transportResponse.data
            : undefined
          : responseOrPayload;
        const transportStatus = transportResponse ? transportResponse.status : options.transportStatus;
        const normalized = normalizeMixedEnvelope(payload, { transportStatus });
        const contractFailure = detectContractFailure({
          normalized,
          transportResponse,
          originalInput: responseOrPayload,
        });

        return {
          ok: contractFailure ? false : normalized.ok,
          statusCode: normalized.statusCode,
          message: normalized.message || contractFailure?.message || "",
          data: normalized.data,
          envelopeType: normalized.envelopeType,
          raw: normalized.raw,
          taxonomyBucket: contractFailure ? CONTRACT_BUCKET : null,
          contractFailure,
        };
      }
