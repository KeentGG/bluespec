# yaml-language-server: $schema=../../../../schemas/spec.schema.yaml
id: api.client
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: api-client-request-flow
    coverage: full
    notes: >
      The client resolves request URLs from the configured API base, merges caller
      headers with Bearer and userId auth headers, injects CSRF headers for
      state-changing requests, forwards cache and AbortSignal options into fetch,
      and always sends cookies with credentials included.
  - id: api-client-token-refresh
    coverage: full
    notes: >
      Requests that fail with 401, jwt-expired 500 responses, or CSRF-related 403
      responses trigger a coordinated refresh flow. Successful refresh retries the
      original request once; failed refresh escalates to centralized auth-error
      cleanup and login redirect.
  - id: api-client-response-normalization
    coverage: full
    notes: >
      Successful transport responses are normalized through the QFM response
      adapter into a consistent ApiResult shape, including wrapped/raw envelope
      detection and explicit contract-failure tagging.

description: >
  Provides a centralized frontend HTTP client that prepares authenticated browser
  requests, automatically includes session cookies, adds Bearer and CSRF headers
  when needed, normalizes backend responses into a stable result envelope, and
  attempts one coordinated token refresh before falling back to global auth-error
  cleanup and redirect when a session can no longer be recovered.

state_machine:
  initial: ready
  states:
    - id: ready
      description: The client is idle and can accept a new request.
    - id: preparing_request
      description: The client is resolving URL, headers, body, and retry flags for an outgoing request.
    - id: awaiting_response
      description: Fetch is in flight with credentials included and optional cache/signal settings.
    - id: refreshing_credentials
      description: The client has invoked refreshAccessToken to recover from missing CSRF state or expired auth.
    - id: retrying_request
      description: The original request is being reissued once after a successful refresh.
    - id: handling_auth_failure
      description: Centralized auth cleanup and redirect logic is running because refresh recovery failed.
    - id: request_completed
      description: A normalized ApiResult has been returned to the caller.
    - id: request_aborted
      description: The request was cancelled through AbortSignal and returns an aborted result.
  transitions:
    - id: request_started
      from: ready
      to: preparing_request
      trigger: Caller invokes request(), get(), post(), patch(), or delete().
      guards:
        - field: fetch_impl
          condition: resolveFetchImpl returns a callable fetch implementation.
        - field: request_url
          condition: resolveRequestUrl returns a non-null URL.
      effects:
        - Resolve the freshest auth session from getToken().
        - Normalize caller-supplied headers and determine method/body behavior.
    - id: request_dispatched
      from: preparing_request
      to: awaiting_response
      trigger: Request headers and body are finalized.
      effects:
        - Merge Authorization and userId headers when a valid token exists.
        - Inject x-csrf-token for state-changing non-refresh requests when a CSRF cookie is available.
        - Call fetch with method, headers, body, signal, cache, and credentials set to include.
    - id: response_requires_refresh
      from: awaiting_response
      to: refreshing_credentials
      trigger: The first normalized response indicates expired auth or CSRF recovery is needed.
      guards:
        - field: retry_flags
          condition: retriedAfterRefresh is false, skipTokenRefresh is false, and path is not /auth/refresh.
        - field: response_status
          condition: status is 401, or 500 with message containing "jwt expired", or 403 with message containing "csrf".
      effects:
        - Call refreshAccessToken with the current apiClient methods.
    - id: refresh_retries_request
      from: refreshing_credentials
      to: retrying_request
      trigger: refreshAccessToken returns success with a token payload.
      effects:
        - Copy the original request options into retryOptions.
        - Replace or clear x-csrf-token headers based on refreshResult.csrfToken when retrying a CSRF failure.
        - Mark the retry as retriedAfterRefresh to prevent loops.
    - id: retry_reissued
      from: retrying_request
      to: awaiting_response
      trigger: executeRequest() recurses with the retry options.
      effects:
        - Re-run the same request flow once using refreshed session state.
    - id: refresh_failure_escalates
      from: refreshing_credentials
      to: handling_auth_failure
      trigger: refreshAccessToken fails or does not yield a retryable token.
      guards:
        - field: skip_auth_error_handling
          condition: requestOptions.skipAuthErrorHandling is not true.
      effects:
        - Invoke handleAuthError with redirectUrl /login and reason session_expired.
    - id: auth_failure_returned
      from: handling_auth_failure
      to: request_completed
      trigger: handleAuthError finishes.
      effects:
        - Return the original failed ApiResult to the caller after cleanup/redirect is initiated.
    - id: response_returned
      from: awaiting_response
      to: request_completed
      trigger: Fetch resolves and no retry or terminal auth-handling path takes over.
      effects:
        - Parse JSON when available and normalize the payload into ApiResult fields.
        - Return ok/statusCode/message/data/envelopeType/contractFailure/taxonomyBucket/raw metadata.
    - id: request_aborted_transition
      from: awaiting_response
      to: request_aborted
      trigger: fetch throws an AbortError.
      effects:
        - Return a failed ApiResult with aborted true and reason aborted.
    - id: request_failed_transition
      from: awaiting_response
      to: request_completed
      trigger: fetch throws a non-abort error.
      effects:
        - Return a failed ApiResult with reason request_failed.

conditions:
  - id: auth_header_injection
    description: Valid in-memory auth sessions are translated into Authorization and userId headers before dispatch.
    trigger: executeRequest() constructs request headers.
    guards:
      - field: auth_session
        condition: token.accessToken and token._id are non-empty strings.
    then:
      - "Add Authorization: Bearer {accessToken}."
      - "Add userId: {_id}."
    else:
      - Preserve caller headers without auth additions.

  - id: csrf_header_injection
    description: State-changing requests automatically attach x-csrf-token unless the caller already provided one or the request is the refresh endpoint.
    trigger: executeRequest() prepares a non-GET/non-HEAD request.
    guards:
      - field: request_shape
        condition: withBody is true, x-csrf-token is absent, skipTokenRefresh is false, and path is not /auth/refresh.
      - field: csrf_cookie
        condition: getCsrfToken() returns a non-empty cookie value.
    then:
      - Set headers["x-csrf-token"] to the decoded csrfToken cookie value.
    else:
      - Send the request without adding a CSRF header.

  - id: proactive_csrf_refresh
    description: Missing CSRF state on the first state-changing attempt triggers a refresh before dispatch so the client can re-read a fresh csrfToken cookie.
    trigger: executeRequest() prepares a state-changing request without a csrfToken cookie.
    guards:
      - field: csrf_cookie
        condition: getCsrfToken() returns null and retriedAfterRefresh is false.
    then:
      - Call refreshAccessToken before the first fetch attempt.
      - Re-read document.cookie and attach x-csrf-token if refresh succeeds.
    else:
      - Continue with the current request preparation path.

  - id: coordinated_refresh_lock
    description: Refresh attempts are coordinated across tabs so one tab refreshes while others wait for the shared result.
    trigger: refreshAccessToken() runs while another tab may already be refreshing.
    guards:
      - field: refresh_lock
        condition: localStorage contains eoyt-refresh-lock with a timestamp newer than LOCK_TIMEOUT_MS.
    then:
      - Wait for TOKEN_REFRESHED through waitForResult using eoyt-refresh-result.
      - Apply the token from another tab when the shared result succeeds.
      - Attempt lock acquisition again if the wait fails or times out.
    else:
      - Acquire the lock and performRefresh locally.
      - Broadcast TOKEN_REFRESHED with cleanupMs 500 when refresh succeeds.

  - id: qfm_response_normalization
    description: Transport responses and raw payloads are converted into one consistent result envelope before the caller receives them.
    trigger: fetch resolves and parseResponsePayload() returns a payload or undefined.
    then:
      - Treat { status, data } inputs as transport responses and pass transportStatus into normalizeMixedEnvelope.
      - Return ok, statusCode, message, data, envelopeType, raw, taxonomyBucket, and contractFailure fields.

  - id: contract_failure_marking
    description: Broken wrapped/raw response shapes are marked as data-contract failures instead of being treated as successful responses.
    trigger: normalizeQfmResponse() evaluates the normalized payload.
    guards:
      - field: normalized_payload
        condition: statusCode is invalid, transport data is missing, wrapped data/statusCode is missing or invalid, normalized data is undefined, or the original payload is undefined.
    then:
      - Set ok to false.
      - Set taxonomyBucket to data contract.
      - Attach a structured contractFailure object with reasonCode and message.
    else:
      - Preserve normalized.ok and leave taxonomyBucket null.

  - id: terminal_auth_error_cleanup
    description: Non-refreshable auth failures clear client auth state and redirect to login unless the caller opted out.
    trigger: A response remains an auth error after refresh handling or is immediately classified as an auth error.
    guards:
      - field: auth_error_handling
        condition: skipAuthErrorHandling is false and the request path is not /auth/refresh.
    then:
      - Clear SWR client cache.
      - Clear token memory, user cookie, and known auth localStorage keys.
      - Redirect to /login with reason=session_expired using window.location.replace().
    else:
      - Return the failed ApiResult without invoking global cleanup.

inputs:
  - id: request_path
    type: string path or absolute HTTP URL
    source: Caller of request/get/post/patch/delete
    required: true
    validation:
      resolution: joined with apiBaseUrl unless already absolute

  - id: request_method
    type: HTTP method string
    source: Caller of request() or convenience methods
    required: false
    validation:
      default: GET
      normalization: uppercased by normalizeRequestMethod

  - id: request_headers
    type: Record<string,string>
    source: Caller-supplied request options
    required: false
    validation:
      normalization: Headers objects and plain objects are normalized into a mutable header record

  - id: request_query
    type: Record<string,unknown> or URLSearchParams
    source: Caller-supplied request options
    required: false
    validation:
      encoding: appended to the resolved URL and skips nullish entries

  - id: request_body
    type: unknown body payload
    source: Caller-supplied request options
    required: false
    validation:
      serialization: objects and arrays are JSON.stringified unless already FormData, URLSearchParams, or string

  - id: auth_session
    type: Token object with _id, email, accessToken
    source: In-memory auth session via getToken()
    required: false
    validation:
      headers: Authorization and userId are added only when _id and accessToken are non-empty strings

  - id: csrf_cookie
    type: csrfToken cookie value
    source: document.cookie
    required: false
    validation:
      decoding: decoded from the csrfToken cookie before header injection

  - id: refresh_cookie
    type: HTTP-only refreshToken cookie
    source: Browser-managed cookie jar sent automatically because fetch uses credentials include
    required: false
    validation:
      visibility: unreadable to client JavaScript and only used indirectly during /auth/refresh

  - id: abort_signal
    type: AbortSignal
    source: Caller-supplied request options
    required: false
    validation:
      effect: passed directly to fetch and maps AbortError to an aborted ApiResult

  - id: transport_response
    type: Response status plus parsed payload
    source: Backend fetch response
    required: true
    validation:
      normalization: wrapped/raw payloads are normalized through normalizeQfmResponse before return

outputs:
  - id: outgoing_request_headers
    type: merged HTTP header object
    destination: fetch(requestUrl, { headers })
    lifespan: per-request

  - id: outgoing_request
    type: fetch invocation with method/body/query/cache/signal/credentials
    destination: backend API endpoint
    lifespan: per-request

  - id: refreshed_token
    type: token payload with _id, email, accessToken and optional csrfToken
    destination: tokenRefresher result, in-memory auth session, and readable user cookie via setToken()
    lifespan: session for access token state; 7 days for the user cookie mirror

  - id: retried_request
    type: one recursive executeRequest() call after refresh
    destination: original API endpoint
    lifespan: one retry attempt per request

  - id: normalized_api_result
    type: ApiResult<T> with ok/statusCode/message/data/envelopeType/contractFailure/taxonomyBucket/raw/headers/url/error/aborted/reason
    destination: caller of the api client
    lifespan: immediate return value

  - id: auth_failure_redirect
    type: browser redirect to /login?reason=session_expired
    destination: window.location.replace()
    lifespan: immediate navigation side effect

