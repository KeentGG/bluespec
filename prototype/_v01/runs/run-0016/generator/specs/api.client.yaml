    snippet: |
      export interface RequestOptions {
        path?: string;
        method?: string;
        body?: unknown;
        headers?: Record<string, string>;
        query?: Record<string, unknown> | URLSearchParams;
        signal?: AbortSignal;
        cache?: RequestCache;
        token?: Token;
        tokenOptions?: TokenOptions;
        apiBaseUrl?: string;
        fetchImpl?: typeof fetch;
        skipTokenRefresh?: boolean;
        skipAuthErrorHandling?: boolean;
      }
    covers:
      - input:request_path
      - input:request_method
      - input:request_headers
      - input:request_query
      - input:request_body
      - input:abort_signal
    line_range:
      start: 392
      end: 406

  - path: src/shared/lib/contracts/api-contract.ts
    snippet: |
      export function buildAuthHeaders(
        headers: Record<string, string> = {},
        token: Token | null = null,
      ): AuthHeaders {
        const nextHeaders: AuthHeaders = isPlainObject(headers) ? { ...headers } : {};
        const accessToken = typeof token?.accessToken === "string" ? token.accessToken.trim() : "";
        const userId = typeof token?._id === "string" ? token._id.trim() : "";

        if (!accessToken || !userId) {
          return nextHeaders;
        }

        nextHeaders.Authorization = `Bearer ${accessToken}`;
        nextHeaders.userId = userId;
        return nextHeaders;
      }
    covers:
      - condition:auth_header_injection
      - input:auth_session
      - output:outgoing_request_headers
    line_range:
      start: 65
      end: 79

  - path: src/shared/lib/api/apiClient.ts
    snippet: |
      export function createApiClient(options: ApiClientOptions = {}): ApiClient {
        async function executeRequest<T>(
          requestOptions: RequestOptions = {},
          { retriedAfterRefresh = false }: { retriedAfterRefresh?: boolean } = {},
        ): Promise<ApiResult<T>> {
          const fetchImpl = resolveFetchImpl(requestOptions, options);
          if (typeof fetchImpl !== "function") {
            throw new TypeError("apiClient requires a fetch implementation.");
          }

          const requestUrl = resolveRequestUrl(requestOptions, options);
          if (!requestUrl) {
            return createResult<T>({
              ok: false,
              statusCode: 503,
              message: "API service is unavailable.",
              reason: "missing_api_base_url",
            });
          }

          const token = resolveTokenForRequest(requestOptions, options);
          const requestHeaders = normalizeHeaderInput(requestOptions.headers);
          const headers = buildAuthHeaders(requestHeaders, token);
          const method = normalizeRequestMethod(requestOptions.method);
          const withBody = method !== "GET" && method !== "HEAD";
          const isRefreshEndpoint = requestOptions.path === "/auth/refresh";
          const skipRefresh = requestOptions.skipTokenRefresh === true;

          // Global CSRF Interceptor: Attach x-csrf-token to all state-changing requests
          if (withBody && !hasHeader(headers, "x-csrf-token") && !skipRefresh && !isRefreshEndpoint) {
            let csrfToken = getCsrfToken();

            // Proactive refresh: if no CSRF token and not already retried, trigger refresh
            if (!csrfToken && !retriedAfterRefresh) {
              const refreshAccessToken = await getRefreshAccessToken();
              const refreshResult = await refreshAccessToken({
                apiClient: { request, get, post, patch, delete: remove },
              });

              if (refreshResult.success) {
                // Re-read CSRF token after successful refresh
                csrfToken = getCsrfToken();
              }
            }

            if (csrfToken) {
              headers["x-csrf-token"] = csrfToken;
            }
          }

          const requestBody = withBody
            ? resolveRequestBody(requestOptions.body, headers)
            : {
                body: undefined,
                headers,
              };

          try {
            const response = await fetchImpl(requestUrl, {
              method,
              headers: requestBody.headers,
              body: requestBody.body,
              signal: requestOptions.signal,
              cache: requestOptions.cache,
              credentials: "include",
            });
    covers:
      - transition:request_started
      - transition:request_dispatched
      - condition:csrf_header_injection
      - condition:proactive_csrf_refresh
      - input:csrf_cookie
      - input:refresh_cookie
      - output:outgoing_request
      - output:outgoing_request_headers
    line_range:
      start: 445
      end: 510

  - path: src/shared/lib/api/apiClient.ts
    snippet: |
      const payload = await parseResponsePayload(response);
      const normalized = normalizeQfmResponse(
        {
          status: response.status,
          data: payload,
