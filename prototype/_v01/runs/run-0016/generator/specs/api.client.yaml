  - path: src/shared/lib/api/apiClient.ts
    snippet: |
      // Detect CSRF failures: 403 with CSRF-related message
      const isCsrfFailure =
        Number(result.statusCode ?? result.status) === 403 &&
        typeof result.message === "string" &&
        result.message.toLowerCase().includes("csrf");

      const shouldRetryAfterRefresh =
        !retriedAfterRefresh &&
        !skipRefresh &&
        !isRefreshEndpoint &&
        (Number(result.statusCode ?? result.status) === 401 ||
          (Number(result.statusCode ?? result.status) === 500 &&
            typeof result.message === "string" &&
            result.message.includes("jwt expired")) ||
          isCsrfFailure);

      if (shouldRetryAfterRefresh) {
        const refreshAccessToken = await getRefreshAccessToken();
        const refreshResult = await refreshAccessToken({
          apiClient: { request, get, post, patch, delete: remove },
        });

        if (refreshResult.success && refreshResult.token) {
          // Build new request options with refreshed token
          const retryOptions = {
            ...requestOptions,
            token: refreshResult.token,
          };

          // For CSRF failures, use csrfToken from refresh response if available
          // Otherwise clear stale CSRF headers to force re-read from cookie
          if (isCsrfFailure) {
            const retryHeaders = { ...(retryOptions.headers || {}) };

            if (refreshResult.csrfToken) {
              // Use CSRF token from refresh response
              retryHeaders["x-csrf-token"] = refreshResult.csrfToken;
            } else {
              // Clear stale CSRF headers to force re-read from cookie
              delete retryHeaders["x-csrf-token"];
              delete retryHeaders["X-CSRF-Token"];
            }

            retryOptions.headers = retryHeaders;
          }

          return executeRequest<T>(retryOptions, { retriedAfterRefresh: true });
        }

        if (!requestOptions.skipAuthErrorHandling) {
          await handleAuthError({
            redirectUrl: "/login",
            reason: "session_expired",
            skipRedirect: false,
          });
        }

        return result;
      }
    covers:
      - transition:response_requires_refresh
      - transition:refresh_retries_request
      - transition:retry_reissued
      - transition:refresh_failure_escalates
      - output:retried_request
      - output:auth_failure_redirect
    line_range:
      start: 539
      end: 597

