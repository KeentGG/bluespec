id: state.management
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: zustand-stores
    coverage: full
    notes: >
      Cross-component UI state is kept in small Zustand stores for report list
      filters, report modals, create-report modal visibility, per-report action
      flags, and PDF download lifecycle. The PDF store also mirrors state into
      localStorage so the workflow survives refreshes.
  - id: swr-data-fetching
    coverage: full
    notes: >
      Company and report list data use SWR with explicit enable gates derived
      from auth state and selected identifiers. Query keys are composed from the
      active filter values, and the companies page hydrates or clears local page
      state from query results.
  - id: local-component-state
    coverage: full
    notes: >
      Transient view state stays local to components and hooks: companies page
      search/sort/debounce/error state uses React useState/useMemo/useEffect,
      and the login form manages field values, submit in-flight state, and
      error/debug visibility locally.

description: >
  Frontend state is split by responsibility. Zustand stores hold shared UI and
  workflow state for report filters, modal visibility, per-report action flags,
  and PDF download progress. SWR owns server-backed company and report list
  queries, with fetches gated by auth-derived identifiers and current filter
  selections. Local React state handles page-scoped concerns like debounced
  company search, runtime error messages, logo fallback tracking, and login form
  submission. Successful queries hydrate local render state; failed queries set
  local errors; modal/action stores expose explicit open/close/start/finish
  transitions; and PDF download state persists through localStorage-backed
  Zustand setters.

state_machine:
  initial: idle
  states:
    - id: idle
      description: No PDF download workflow is active; persisted download fields are empty or cleared.
    - id: waiting
      description: PDF generation has been started and the store is waiting for the polling layer to resolve it.
    - id: finished
      description: PDF generation succeeded and a public URL has been written into the shared download store.
    - id: failed
      description: PDF generation failed to start or later polling marked the workflow as failed.
  transitions:
    - id: begin_download
      from: idle
      to: waiting
      trigger: useDownloadStore.startDownload(...) is called from a report action
      effects:
        - Set isGenerating to true
        - Set dlStatus to waiting
        - Persist pdfKey, cid, reportId, and cleared publicUrl through localStorage-backed setters
        - Call startPdfGeneration(...)
    - id: start_download_api_rejected
      from: waiting
      to: failed
      trigger: startPdfGeneration(...) returns a non-ok result or throws
      effects:
        - Set dlStatus to failed
        - Return false to the caller
    - id: polling_marks_finished
      from: waiting
      to: finished
      trigger: PdfGenerationOverlay polling sees status "finished" or a publicUrl
      guards:
        - field: publicUrl
          condition: statusData.publicUrl is present OR the status is finished
      effects:
        - Set dlStatus to finished
        - Persist publicUrl into the download store
    - id: polling_marks_failed
      from: waiting
      to: failed
      trigger: PdfGenerationOverlay polling sees failed status, unknown status message, or max attempts reached
      effects:
        - Set dlStatus to failed
    - id: reset_finished
      from: finished
      to: idle
      trigger: useDownloadStore.reset() is called
      effects:
        - Clear in-memory Zustand fields
        - Remove all download-related localStorage keys
    - id: reset_failed
      from: failed
      to: idle
      trigger: useDownloadStore.reset() is called
      effects:
        - Clear in-memory Zustand fields
        - Remove all download-related localStorage keys

conditions:
  - id: company-query-enabled
    description: >
      The companies SWR query only runs when the caller leaves enabled=true and
      the auth token exposes a non-empty userId.
    trigger: useCompanyListQuery(options) executes
    guards:
      - field: enabled
        condition: options.enabled is true or omitted
      - field: auth_token._id
        condition: getToken()?._id is a non-empty string
    then:
      - Compose query key ["companies.list", userId, debouncedSearchQuery, sortBy, sortOrder]
      - Call useSWR(queryKey, fetchCompanyListRuntime, ...)
    else:
      - Pass null as the SWR key so no fetch runs

  - id: reports-query-enabled
    description: >
      The reports SWR query only runs when enabled=true, a non-empty auth userId
      exists, and a non-empty businessId is selected.
    trigger: useReportsListQuery(options) executes
    guards:
      - field: enabled
        condition: options.enabled is true or omitted
      - field: auth_token._id
        condition: getToken()?._id is a non-empty string
      - field: businessId
        condition: businessId is a non-empty string
    then:
      - Compose query key with businessId, page, pageSize, search, sortBy, sortOrder, and calculatorId
      - Call useSWR(queryKey, fetchReportsListRuntime, ...)
    else:
      - Pass null as the SWR key so no fetch runs

  - id: search-debounce
    description: >
      Companies page search updates the immediate input state on every keystroke,
      but only updates the API-facing debouncedSearchQuery after the configured
      debounce timer fires. Loading stays true while the trimmed values differ.
    trigger: User types in the companies search input
    guards:
      - field: searchQuery
        condition: searchQuery.trim() !== debouncedSearchQuery.trim()
    then:
      - setSearchQuery(nextSearchQuery) runs immediately
      - debouncedSearch(nextSearchQuery) schedules setDebouncedSearchQuery(...)
      - isLoading becomes true even before SWR resolves
    else:
      - isLoading falls back to companyListQuery.isLoading

  - id: company-query-success-hydration
    description: >
      When the companies query resolves with ok=true, local page state is
      hydrated from result.businesses and previous logo failures/runtime errors
      are cleared.
    trigger: companyListQuery.data changes
    guards:
      - field: result.ok
        condition: result.ok is true
    then:
      - Set companyList from result.businesses or EMPTY_COMPANY_LIST
      - Reset logoLoadFailuresByBusinessId to an empty object
      - Clear runtimeErrorMessage
    else:
      - Set companyList to EMPTY_COMPANY_LIST

  - id: company-abort-error-suppression
    description: >
      Failed company queries only surface a runtime error when the failure reason
      is not "aborted".
    trigger: companyListQuery.data resolves with ok=false
    guards:
      - field: result.reason
        condition: result.reason !== "aborted"
    then:
      - Set runtimeErrorMessage to result.message or "Unable to load companies."
    else:
      - Leave runtimeErrorMessage unchanged

  - id: report-filters-reset
    description: >
      Resetting the reports list store restores its fixed default filter set.
    trigger: useReportsListStore.resetFilters() is called
    then:
      - Set searchQuery to an empty string
      - Set sortId to "updatedAt:desc"
      - Set calcTypeFilter to "all"

  - id: modal-delete-lifecycle
    description: >
      Opening the delete modal stores the selected report target, starting delete
      marks the modal busy, and finishing delete closes the modal, clears the
      target, and invokes the optional success callback.
    trigger: useReportModalsStore delete actions are called
    then:
      - openDelete(report) sets isDeleteOpen=true and deleteTarget=report
      - startDelete() sets isDeleting=true
      - finishDelete() clears modal state and calls onDeleteSuccess if present
      - closeDelete() clears modal state without invoking the callback

  - id: modal-email-lifecycle
    description: >
      Opening the email modal stores the report id and resets the email draft,
      startEmailSend marks the modal busy, and finishEmailSend closes the modal
      and invokes the optional success callback.
    trigger: useReportModalsStore email actions are called
    then:
      - openEmail(reportId) sets isEmailOpen=true, emailReportId=reportId, emailAddress="", isSending=false
      - setEmailAddress(email) stores the current draft value
      - startEmailSend() sets isSending=true
      - finishEmailSend() clears modal state and calls onEmailSuccess if present
      - closeEmail() clears modal state without invoking the callback

  - id: create-report-modal-defaults
    description: >
      The create-report modal can be opened with an optional defaultBusinessId;
      closing it always clears both visibility and the default selection.
    trigger: useCreateReportStore.open(...) or close() is called
    then:
      - open(defaultBusinessId) sets isOpen=true and stores defaultBusinessId or null
      - close() sets isOpen=false and defaultBusinessId=null

  - id: per-report-action-aggregation
    description: >
      Per-report action flags are stored in four keyed maps; anyActionInProgress
      returns true when any of the maps contains a truthy entry for the same
      report id.
    trigger: anyActionInProgress(reportId) is called
    then:
      - Return true when downloading[reportId], renaming[reportId], deleting[reportId], or emailing[reportId] is truthy
    else:
      - Return false

  - id: login-submit-singleflight
    description: >
      The login form ignores repeat submits while a request is already in flight,
      clears prior errors before a new attempt, and always clears isLoading in a
      finally block after bootstrapLoginSession resolves.
    trigger: LoginPageContent.handleSubmit(event) runs
    guards:
      - field: isLoading
        condition: isLoading is false before submit starts
    then:
      - Clear errorMessage
      - Set isLoading=true
      - Call loginRequest(...) and bootstrapLoginSession(...)
      - Redirect when decision.action is redirect, otherwise set an error message on failure
      - Set isLoading=false in finally
    else:
      - Return immediately without issuing another login request

inputs:
  - id: auth_token
    type: "token object with _id field"
    source: getToken() in company and reports query hooks
    required: true
    validation:
      user_id: "_id must be a non-empty string for SWR queries to enable"

  - id: company_search_query
    type: string
    source: Companies page text input and local React state
    required: false
    validation:
      normalization: "trimmed for debounce/loading comparison"

  - id: company_sort_selection
    type: "sortBy + sortOrder pair"
    source: Companies page local React state
    required: false
    validation:
      default: "updatedAt:desc"

  - id: reports_filters
    type: "object with searchQuery, sortId, calcTypeFilter"
    source: useReportsListStore Zustand state
    required: false
    validation:
      defaults: "searchQuery='', sortId='updatedAt:desc', calcTypeFilter='all'"

  - id: reports_query_params
    type: "object with businessId, page, pageSize, search, sortBy, sortOrder, calculatorId"
    source: useReportsListQuery caller options
    required: false
    validation:
      business_id: "must be a non-empty string for SWR to enable"
      page_default: "1"
      page_size_default: "5"

  - id: modal_target
    type: "delete target object or email reportId string"
    source: useReportModalsStore action callers
    required: false
    validation:
      delete_target: "{ _id, businessId, name? } for openDelete"
      email_target: "non-empty reportId string for openEmail"

  - id: report_action_id
    type: string
    source: useReportActionStore action callers
    required: false
    validation:
      format: "report id used as the key in loading-state maps"

  - id: pdf_download_request
    type: "object with userId, reportId, cid, optional email"
    source: useDownloadStore.startDownload caller
    required: true
    validation:
      required_fields: "userId, reportId, cid are expected by the store workflow"

  - id: login_credentials
    type: "object with email, password, rememberMe"
    source: LoginPageContent local form state
    required: true
    validation:
      email: "trimmed before submission"
      password: "submitted as entered"

outputs:
  - id: company_list_query_key
    type: "array [companies.list, userId, debouncedSearchQuery, sortBy, sortOrder] or null"
    destination: useSWR invocation in useCompanyListQuery
    lifespan: per-render while hook inputs remain stable

  - id: reports_list_query_key
    type: "array [reports.list, userId, businessId, page, pageSize, search, sortBy, sortOrder, calculatorId] or null"
    destination: useSWR invocation in useReportsListQuery
    lifespan: per-render while hook inputs remain stable

  - id: company_page_local_state
    type: "local React state for companyList, debouncedSearchQuery, runtimeErrorMessage, logoLoadFailuresByBusinessId, and isLoading"
    destination: useCompaniesPage return value consumed by page components
    lifespan: current component lifetime

  - id: reports_filter_store_state
    type: "Zustand state with searchQuery, sortId, calcTypeFilter"
    destination: useReportsListStore consumers across the reports UI
    lifespan: in-memory until store is reset or page reloads

  - id: report_modal_state
    type: "Zustand modal state for delete/email/create-report flows and optional success callbacks"
    destination: report modal components and modal-opening controllers
    lifespan: in-memory until actions close or reset the modal

  - id: report_action_state
    type: "four per-report loading maps plus derived anyActionInProgress(reportId)"
    destination: row-level report action controllers and UI affordances
    lifespan: in-memory until overwritten by later setter calls

  - id: pdf_download_state
    type: "Zustand fields dlStatus, isGenerating, pdfKey, cid, publicUrl, currentReportId mirrored to localStorage"
    destination: PDF overlay, report actions, and browser localStorage
    lifespan: persists across refreshes until reset() removes storage keys

  - id: login_ui_state
    type: "local React state for email, password, rememberMe, debug visibility, isLoading, and errorMessage"
    destination: LoginPageContent rendering and router redirect decisions
    lifespan: current login page component lifetime

