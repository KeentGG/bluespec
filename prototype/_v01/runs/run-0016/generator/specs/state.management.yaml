      export function LoginPageContent() {
        const router = useRouter();
        const searchParams = useSearchParams();
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [rememberMe, setRememberMeChecked] = useState(false);
        const [showDebug, setShowDebug] = useState(false);
        const [debugInfo, setDebugInfo] = useState<any>(null);

        const [isLoading, setIsLoading] = useState(false);
        const [errorMessage, setErrorMessage] = useState("");
        const apiBaseUrl = useMemo(getApiBaseUrl, []);
        const apiClient = useMemo(
          () =>
            createDefaultApiClient({
              apiBaseUrl,
            }),
          [apiBaseUrl],
        );

        async function handleSubmit(event) {
          event.preventDefault();

          if (isLoading) {
            return;
          }

          setErrorMessage("");
          setIsLoading(true);

          const trimmedEmail = email.trim();
          let stagedSessionPayload = null;

          try {
            const loginResponse = await loginRequest(apiClient, {
              email: trimmedEmail,
              password,
              rememberMe,
            });

            const decision = await bootstrapLoginSession({
              loginResponse,
              stageSession: async (sessionPayload) => {
                stagedSessionPayload = sessionPayload;
                await clearClientDataCache();
              },
            });

            if (!decision.sessionStaged) {
              setErrorMessage(
                typeof loginResponse?.message === "string" && loginResponse.message.length > 0
                  ? loginResponse.message
                  : "Unable to log in with those credentials.",
              );
              return;
            }

            if (decision.action === "redirect" && typeof decision.destination === "string") {
              router.replace(decision.destination);
              return;
            }

            setErrorMessage("Unable to continue after authentication.");
          } finally {
            setIsLoading(false);
          }
        }
    covers:
