  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/reports/store/useReportActionStore.ts
    snippet: |
      export const useReportActionStore = create<ReportActionState>((set, get) => ({
        downloading: {},
        renaming: {},
        deleting: {},
        emailing: {},

        setDownloading: (reportId, isLoading) =>
          set((state) => ({
            downloading: { ...state.downloading, [reportId]: isLoading },
          })),

        setRenaming: (reportId, isLoading) =>
          set((state) => ({
            renaming: { ...state.renaming, [reportId]: isLoading },
          })),

        setDeleting: (reportId, isLoading) =>
          set((state) => ({
            deleting: { ...state.deleting, [reportId]: isLoading },
          })),

        setEmailing: (reportId, isLoading) =>
          set((state) => ({
            emailing: { ...state.emailing, [reportId]: isLoading },
          })),

        isDownloading: (reportId) => !!get().downloading[reportId],
        isRenaming: (reportId) => !!get().renaming[reportId],
        isDeleting: (reportId) => !!get().deleting[reportId],
        isEmailing: (reportId) => !!get().emailing[reportId],

        anyActionInProgress: (reportId) => {
          const state = get();
          return (
            !!state.downloading[reportId] ||
