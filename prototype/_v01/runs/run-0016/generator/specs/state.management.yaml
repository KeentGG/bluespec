  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/company/hooks/useCompanyListQuery.ts
    snippet: |
      export function useCompanyListQuery(options: any = {}) {
        const { debouncedSearchQuery = "", sortBy = "updatedAt", sortOrder = "desc", enabled = true } = options;
        const token = getToken();
        const userId = typeof token?._id === "string" && token._id.length > 0 ? token._id : null;
        const isEnabled = enabled && typeof userId === "string" && userId.length > 0;

        const queryKey = useMemo(
          () => ["companies.list", userId, debouncedSearchQuery, sortBy, sortOrder],
          [debouncedSearchQuery, sortBy, sortOrder, userId],
        );

        const swrQuery = useSWR(
          isEnabled ? queryKey : null,
          () =>
            fetchCompanyListRuntime({
              debouncedSearchQuery,
              sortBy,
              sortOrder,
            }),
          {
            keepPreviousData: false,
            revalidateOnMount: true,
            shouldRetryOnError: false,
          },
        );

        return {
          ...swrQuery,
          revalidate: () => swrQuery.mutate(),
        };
      }
    covers:
      - "condition:company-query-enabled"
      - "input:auth_token"
      - "input:company_search_query"
      - "input:company_sort_selection"
      - "output:company_list_query_key"
    line_range:
      start: 9
      end: 39

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/reports/hooks/useReportsListQuery.ts
    snippet: |
      export function useReportsListQuery(options: any = {}) {
        const {
          businessId = null,
          enabled = true,
          page = 1,
          pageSize = DEFAULT_PAGE_SIZE,
          search = "",
          sortBy = "",
          sortOrder = "",
          calculatorId = "",
        } = options;
        const token = getToken();
        const userId = typeof token?._id === "string" && token._id.length > 0 ? token._id : null;
        const isEnabled =
          enabled &&
          typeof userId === "string" &&
          userId.length > 0 &&
          typeof businessId === "string" &&
          businessId.length > 0;

        const queryKey = useMemo(
          () => [
            "reports.list",
            userId,
            businessId,
            page,
            pageSize,
            search,
            sortBy,
            sortOrder,
            calculatorId,
          ],
          [businessId, userId, page, pageSize, search, sortBy, sortOrder, calculatorId],
        );

        const swrQuery = useSWR(
          isEnabled ? queryKey : null,
          () =>
            fetchReportsListRuntime({
              businessId,
              page,
              pageSize,
              search,
              sortBy,
              sortOrder,
              calculatorId,
            }),
          {
            keepPreviousData: true,
            revalidateOnMount: true,
            shouldRetryOnError: false,
          },
        );

        // Extract pagination data from the response
