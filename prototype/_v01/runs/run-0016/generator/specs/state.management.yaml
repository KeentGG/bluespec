        setDlStatus: (status) => {
          set({ dlStatus: status });
          setStorageValue(STORAGE_KEY_STATUS, status);
        },

        setIsGenerating: (value) => {
          set({ isGenerating: value });
          setStorageValue(STORAGE_KEY_IS_GENERATING, value.toString());
        },

        setPdfKey: (value) => {
          set({ pdfKey: value });
          setStorageValue(STORAGE_KEY_PDF_KEY, value);
        },

        setCid: (value) => {
          set({ cid: value });
          setStorageValue(STORAGE_KEY_CID, value);
        },

        setPublicUrl: (value) => {
          set({ publicUrl: value });
          setStorageValue(STORAGE_KEY_PUBLIC_URL, value);
        },
    covers:
      - "state:idle"
      - "state:waiting"
      - "state:finished"
      - "output:pdf_download_state"
    line_range:
      start: 68
      end: 100

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/pdf/store/useDownloadStore.ts
    snippet: |
        startDownload: async ({ userId, reportId, cid, email }) => {
          try {
            // Set generating state first
            get().setIsGenerating(true);
            get().setDlStatus("waiting");
            get().setPdfKey(userId);
            get().setCid(cid);
            get().setCurrentReportId(reportId);
            get().setPublicUrl("");

            // Call API to start generation
            const response = await startPdfGeneration({ userId, reportId, email });

            // Fix: response.data contains userId directly, not nested under .data
            if (response.ok && response.data?.userId) {
              // Generation started successfully
              return true;
            } else {
              // API returned error
              get().setDlStatus("failed");
              return false;
            }
          } catch (error) {
            console.error("Failed to start PDF generation:", error);
            get().setDlStatus("failed");
            return false;
          }
        },

        reset: () => {
          set({
            dlStatus: "",
            isGenerating: false,
            pdfKey: "",
            cid: "",
            publicUrl: "",
            currentReportId: "",
          });
          removeStorageValue(STORAGE_KEY_IS_GENERATING);
          removeStorageValue(STORAGE_KEY_PDF_KEY);
          removeStorageValue(STORAGE_KEY_CID);
          removeStorageValue(STORAGE_KEY_STATUS);
          removeStorageValue(STORAGE_KEY_PUBLIC_URL);
          removeStorageValue(STORAGE_KEY_REPORT_ID);
        },
    covers:
      - "transition:begin_download"
      - "transition:start_download_api_rejected"
      - "transition:reset_finished"
      - "transition:reset_failed"
      - "input:pdf_download_request"
      - "output:pdf_download_state"
    line_range:
      start: 107
      end: 151

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/pdf/components/PdfGenerationOverlay.tsx
    snippet: |
      useEffect(() => {
        if (!isGenerating || !pdfKey) return;
        if (dlStatus === "finished" || dlStatus === "failed") return;

        let attempts = 0;

        const poll = async () => {
          try {
            const status = await getPdfStatus({ userId: pdfKey });
            const statusData = status?.raw?.data;

            if (statusData?.status === "finished" || statusData?.publicUrl) {
              setDlStatus("finished");
              setPublicUrl(statusData.publicUrl || "#");
              return true;
            }

            if (statusData?.status === "failed" || statusData?.status?.includes("failed")) {
              setDlStatus("failed");
              return true;
            }

            if (status?.raw?.message?.includes("Unknown")) {
              setDlStatus("failed");
              return true;
            }

            return false;
          } catch {
            return false;
          }
        };

        const intervalId = setInterval(async () => {
          attempts++;

          if (attempts >= MAX_ATTEMPTS) {
            clearInterval(intervalId);
            setDlStatus("failed");
            return;
          }

          const shouldStop = await poll();
          if (shouldStop) {
            clearInterval(intervalId);
          }
        }, POLL_INTERVAL);

        return () => clearInterval(intervalId);
      }, [isGenerating, pdfKey, dlStatus, setDlStatus, setPublicUrl]);
    covers:
      - "transition:polling_marks_finished"
      - "transition:polling_marks_failed"
      - "state:waiting"
      - "state:finished"
      - "state:failed"
    line_range:
      start: 108
      end: 157

  - path: /Volumes/Keen/Desk/Career/Valhalla/EOYT/dashboard-v2/src/features/reports/store/useReportModalsStore.ts
