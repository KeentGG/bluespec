      async function bootstrapSession(options = {}) {
        const { authResponse, stageSession, routes, source } = options;
        log("bootstrapSession() called, source:", source);
        const resolvedRoutes = resolveRoutes(routes);
        const parseEnvelope =
          source === "signup" ? parseSignupSuccessEnvelope : parseLoginSuccessEnvelope;
        const sessionPayload = parseEnvelope(authResponse);

        if (!sessionPayload) {
          log("No session payload extracted, aborting");
          return createDecision("none", null, `${source}_envelope_not_success`, false, false);
        }

        log("Session payload extracted, _id:", sessionPayload._id);

        try {
          log("Calling setToken()...");
          setToken(sessionPayload);
          log("setToken() completed");

          if (typeof stageSession === "function") {
            log("Calling stageSession callback...");
            await stageSession(sessionPayload);
            log("stageSession callback completed");
          }
        } catch (_error) {
          log("Session staging failed:", _error.message);
          return createDecision("none", null, `${source}_session_stage_failed`, false, false);
        }

        log("Bootstrap complete, redirecting to:", resolvedRoutes.companies);
        return createDecision(
          "redirect",
          resolvedRoutes.companies,
          `${source}_session_verified_redirect_companies`,
          true,
          true,
        );
      }
