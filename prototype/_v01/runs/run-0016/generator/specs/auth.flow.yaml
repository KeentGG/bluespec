      async function attemptSilentRefresh(options = {}) {
        const { cookieHeader, requestOrigin, fetchImpl } = options;
        const appApiUrl = resolveAppApiUrl();

        if (typeof cookieHeader !== "string" || cookieHeader.length === 0 || appApiUrl.length === 0) {
          return null;
        }

        const hasRefreshToken = cookieHeader.includes("refreshToken=");
        if (!hasRefreshToken) {
          return null;
        }

        const csrfToken = extractCookieValue(cookieHeader, CSRF_TOKEN_COOKIE);

        let result = await callRefreshEndpoint({
          cookieHeader,
          requestOrigin,
          fetchImpl,
          csrfToken,
          appApiUrl,
        });

        if (result.error || (result.response && result.response.error)) {
          result = await callRefreshEndpoint({
            cookieHeader,
            requestOrigin,
            fetchImpl,
            csrfToken: null,
            appApiUrl,
          });
        }

        const { response, error } = result;

        if (error || response.error) {
          return null;
        }

        const raw = response.raw;
        const rawStatusCode = raw?.statusCode ?? response.statusCode;

        if (rawStatusCode !== 200) {
          return null;
        }

        const user = raw?.user ?? raw?.data?.user;
        if (!user) {
          return null;
        }

        return {
          session: normalizeSessionPayload(user),
          csrfToken: raw?.csrfToken ?? raw?.data?.csrfToken,
          refreshToken,
        };
      }
