# yaml-language-server: $schema=../../../../schemas/spec.schema.yaml
id: auth.flow
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: auth-login-flow
    coverage: full
    notes: >
      The login page submits email, password, and rememberMe to /auth/login,
      stages the returned access token in memory, clears cached client data, and
      redirects successful logins to /companies.
  - id: auth-token-management
    coverage: full
    notes: >
      Access tokens are normalized into an in-memory authSession object and
      mirrored into a readable user cookie. Logout clears memory and the user
      cookie. Refresh uses an HTTP-only refreshToken cookie and propagates CSRF
      headers when present.
  - id: auth-cross-tab-sync
    coverage: full
    notes: >
      Login and logout events are broadcast across tabs through
      BroadcastChannel/localStorage. Login redirects other tabs away from
      /login; logout clears auth state and redirects protected routes to /login.
  - id: auth-token-refresh
    coverage: full
    notes: >
      Token refresh is coordinated both within one tab and across tabs. One tab
      performs /auth/refresh while others wait for TOKEN_REFRESHED. Successful
      refresh re-stages the access token and publishes the result.
  - id: auth-route-protection
    coverage: full
    notes: >
      authGuard redirects anonymous users from protected routes to /login and
      redirects authenticated users away from /login to /companies. Middleware
      attempts silent refresh before enforcing the redirect on guarded routes.

description: >
  Implements a browser-based authentication flow that starts on the login form,
  stages a returned access token into in-memory session state, keeps a readable
  user cookie for middleware-visible session continuity, and uses an HTTP-only
  refresh cookie for silent re-authentication. The flow protects guarded routes,
  redirects authenticated users away from /login, coordinates login/logout and
  refresh activity across tabs, and injects CSRF headers when refresh/logout
  requests are sent.

state_machine:
  initial: anonymous
  states:
    - id: anonymous
      description: No valid staged session is available to the current page or guard evaluation.
    - id: authenticating
      description: The login form has submitted credentials and is waiting for the login response.
    - id: authenticated
      description: A normalized session with _id and accessToken exists and protected routes are allowed.
    - id: refreshing
      description: The system is attempting /auth/refresh, either in this tab or via a coordinating leader tab.
    - id: redirecting_to_companies
      description: The browser is navigating an authenticated user to /companies.
    - id: redirecting_to_login
      description: The browser is navigating an anonymous or expired session to /login.
  transitions:
    - id: login_submit
      from: anonymous
      to: authenticating
      trigger: User submits the login form.
      guards:
        - field: is_loading
          condition: isLoading is false before submission starts.
        - field: credentials
          condition: email is trimmed and password is present from required form inputs.
      effects:
        - Send POST /auth/login with email, password, and rememberMe.
        - Set local loading state and clear any prior error message.
    - id: login_success
      from: authenticating
      to: redirecting_to_companies
      trigger: bootstrapLoginSession returns a staged session and redirect decision.
      guards:
        - field: login_response
          condition: statusCode resolves to 200 and payload.user contains non-empty _id and accessToken.
      effects:
        - Normalize and store the access token in memory.
        - Write the user cookie and broadcast login to other tabs.
        - Clear client data cache and redirect to /companies.
    - id: login_failure
      from: authenticating
      to: anonymous
      trigger: Login response does not produce a staged session.
      effects:
        - Show loginResponse.message when available, otherwise show a generic credential error.
        - End the loading state without navigating.
    - id: authenticated_login_redirect
      from: authenticated
      to: redirecting_to_companies
      trigger: authGuard evaluates a valid session on the /login route.
      effects:
        - Return a redirect decision targeting /companies.
    - id: anonymous_protected_redirect
      from: anonymous
      to: redirecting_to_login
      trigger: authGuard evaluates a protected route without a valid session.
      effects:
        - Return a redirect decision targeting /login.
    - id: protected_route_silent_refresh
      from: anonymous
      to: refreshing
      trigger: Middleware handles /login or a protected route and finds a refreshToken cookie but no valid session.
      guards:
        - field: pathname
          condition: shouldResolveSession(pathname) is true.
        - field: refresh_cookie
          condition: cookieHeader includes refreshToken=.
      effects:
        - Call /auth/refresh with the request cookie header and optional x-csrf-token.
        - Retry refresh once without x-csrf-token if the first attempt errors.
    - id: silent_refresh_success
      from: refreshing
      to: authenticated
      trigger: Middleware silent refresh returns a normalized session.
      effects:
        - Set user, csrfToken, and refreshToken cookies on the outgoing response when present.
        - Re-run authGuard using the refreshed session before continuing.
    - id: token_refresh_requested
      from: authenticated
      to: refreshing
      trigger: refreshAccessToken is called because the current tab needs a fresh access token.
      effects:
        - Reuse the in-tab refresh promise if one already exists.
        - Otherwise acquire or wait on the cross-tab refresh lock.
    - id: token_refresh_success
      from: refreshing
      to: authenticated
      trigger: performRefresh receives a valid refresh response.
      guards:
        - field: refresh_response
          condition: raw.user or raw.data.user contains string _id and string accessToken.
      effects:
        - Store the refreshed token in memory and the user cookie.
        - Broadcast TOKEN_REFRESHED for other tabs.
        - Release the refresh lock.
    - id: token_refresh_failure
      from: refreshing
      to: redirecting_to_login
      trigger: Refresh errors, times out, or does not return a valid token payload.
      effects:
        - Return a failed refresh result or null session to the caller.
        - Redirect guarded navigation to /login when auth cannot be re-established.
        - Release the refresh lock.
    - id: logout_broadcast_received
      from: authenticated
      to: redirecting_to_login
      trigger: Another tab broadcasts logout while this tab is on a protected route.
      effects:
        - Clear in-memory session and readable user cookie.
        - Redirect to /login with the current base path preserved.

conditions:
  - id: refresh_lock_coordination
    description: >
      Only one tab performs /auth/refresh at a time. If another tab already owns
      the lock, the current tab waits for a TOKEN_REFRESHED result before trying
      to refresh on its own.
    trigger: refreshAccessToken() runs while another tab may already be refreshing.
    guards:
      - field: refresh_lock
        condition: localStorage refresh lock exists and is younger than LOCK_TIMEOUT_MS.
    then:
      - Wait for TOKEN_REFRESHED via waitForResult using REFRESH_RESULT_KEY.
      - If the result succeeds, apply the token from the other tab.
      - If waiting fails or times out, try to acquire the lock again and continue cautiously.
    else:
      - Acquire the lock and perform refresh in the current tab.

  - id: cross_tab_login_sync
    description: >
      A login broadcast from another tab redirects the current tab to /companies
      only when the user is still on /login; otherwise it only refreshes auth state.
    trigger: Login event arrives through BroadcastChannel or localStorage listener.
    guards:
      - field: current_path
        condition: window.location.pathname includes /login.
    then:
      - Compute the base path and set window.location.href to the corresponding /companies route.
      - Invoke the supplied login callback.
    else:
      - Keep the current route.
      - Invoke the supplied login callback.

  - id: cross_tab_logout_sync
    description: >
      A logout broadcast clears auth state in other tabs and redirects only when
      the receiving tab is on a protected route.
    trigger: Logout event arrives through BroadcastChannel or localStorage listener.
    guards:
      - field: current_path
        condition: window.location.pathname includes /companies or /reports.
    then:
      - Compute the base path and set window.location.href to the corresponding /login route.
      - Invoke the logout callback to clear cookies and session state.
    else:
      - Do not redirect.
      - Invoke the logout callback to clear cookies and session state.

  - id: csrf_header_injection
    description: >
      Refresh and logout requests attach x-csrf-token when a csrfToken cookie is
      available, including middleware-side silent refresh requests.
    trigger: A refresh or logout HTTP request is prepared.
    guards:
      - field: csrf_cookie
        condition: getCsrfToken(cookieString) returns a non-empty value.
    then:
      - Merge x-csrf-token into the request headers.
    else:
      - Send the request without x-csrf-token.

  - id: silent_refresh_retry_without_csrf
    description: >
      Middleware attempts silent refresh with the current csrfToken first, then
      retries once without that header if the first attempt errors.
    trigger: attemptSilentRefresh() runs for a guarded request.
    guards:
      - field: first_refresh_attempt
        condition: The initial callRefreshEndpoint result has an error or response.error.
    then:
      - "Call callRefreshEndpoint again with csrfToken: null."
    else:
      - Keep the first refresh result.

  - id: protected_route_match
    description: >
      Route protection uses prefix matching so nested routes under a protected path
      inherit the same guard behavior.
    trigger: authGuard evaluates pathname against protectedPaths.
    guards:
      - field: pathname
        condition: pathname equals a protected path or starts with protectedPath + '/'.
    then:
      - Treat the route as protected for redirect decisions.
    else:
      - Treat the route as public.

inputs:
  - id: credentials
    type: email/password object
    source: LoginPageContent form submission
    required: true
    validation:
      email: trimmed string from the email field
      password: non-empty string from the password field

  - id: remember_me
    type: boolean
    source: LoginPageContent rememberMe checkbox
    required: false
    validation:
      default: "false"

  - id: pathname
    type: string URL path
    source: Next.js router, window.location.pathname, or middleware request URL
    required: true
    validation:
      normalization: empty or missing path normalizes to /

  - id: login_response
    type: auth API response envelope
    source: POST /auth/login response
    required: true
    validation:
      statusCode: must resolve to 200 for session bootstrap
      user: must include _id and accessToken strings

  - id: refresh_cookie
    type: HTTP-only refreshToken cookie
    source: browser cookie header supplied to middleware or backend refresh endpoint
    required: false
    validation:
      presence_check: cookieHeader includes refreshToken=

  - id: csrf_cookie
    type: csrfToken cookie value
    source: browser cookies
    required: false
    validation:
      header_mapping: copied into x-csrf-token when present

  - id: session_candidate
    type: session-like object with _id, email, accessToken
    source: login payload, refresh payload, or middleware user payload
    required: false
    validation:
      _id: non-empty string
      accessToken: non-empty string

  - id: cross_tab_event
    type: BroadcastChannel message or localStorage event payload
    source: other browser tabs
    required: false
    validation:
      event_types: logout, login, TOKEN_REFRESHED

outputs:
  - id: login_request
    type: POST /auth/login HTTP request
    destination: backend /auth/login endpoint
    lifespan: per submission

  - id: access_token_memory
    type: normalized session object containing _id, email, accessToken, and user
    destination: module-scoped authSession variable in memory
    lifespan: browser session until cleared or replaced

  - id: user_cookie
    type: JSON-encoded user cookie
    destination: browser cookie named user
    lifespan: 7 days on client writes, 14 days on middleware silent-refresh writes

  - id: csrf_header
    type: x-csrf-token request header
    destination: refresh and logout HTTP requests
    lifespan: per request

  - id: refresh_result_broadcast
    type: TOKEN_REFRESHED event payload
    destination: BroadcastChannel and localStorage REFRESH_RESULT_KEY
    lifespan: 500ms cleanup window for the localStorage copy

  - id: route_guard_decision
    type: object with action, destination, reason, clearSessionCookie
    destination: middleware or client-side guard caller
    lifespan: per authGuard invocation

  - id: response_session_cookies
    type: user, csrfToken, and refreshToken response cookies
    destination: NextResponse generated by middleware after silent refresh
    lifespan: 14 days when set by middleware

  - id: redirect_to_companies
    type: browser navigation to /companies
    destination: router.replace, window.location.href, or NextResponse.redirect
    lifespan: immediate

  - id: redirect_to_login
    type: browser navigation to /login
    destination: window.location.href or NextResponse.redirect
    lifespan: immediate

  - id: login_error_message
    type: UI error string
    destination: login page errorMessage state
    lifespan: until a later submit clears or replaces it

evidence_refs:
  - path: src/features/auth/components/LoginPageContent.tsx
    snippet: |
      async function loginRequest(apiClient, credentials) {
        const response = await apiClient.post({
          path: "/auth/login",
          body: credentials,
          headers: {
            Accept: "application/json",
          },
          cache: "no-store",
          skipTokenRefresh: true,
          skipAuthErrorHandling: true,
        });

        if (response.raw && typeof response.raw === "object") {
          return response.raw;
        }

        return {
          statusCode: response.statusCode ?? (response.aborted ? 499 : 503),
          message: response.message || "Login request failed.",
        };
      }
    covers:
      - "transition:login_submit"
      - "input:credentials"
      - "output:login_request"
    line_range:
      start: 25
      end: 45

  - path: src/features/auth/components/LoginPageContent.tsx
    snippet: |
      async function handleSubmit(event) {
        event.preventDefault();

        if (isLoading) {
          return;
        }

        setErrorMessage("");
        setIsLoading(true);

        const trimmedEmail = email.trim();
        let stagedSessionPayload = null;

        try {
          const loginResponse = await loginRequest(apiClient, {
            email: trimmedEmail,
            password,
            rememberMe,
          });

          const decision = await bootstrapLoginSession({
            loginResponse,
            stageSession: async (sessionPayload) => {
              stagedSessionPayload = sessionPayload;
              await clearClientDataCache();
            },
          });

          if (!decision.sessionStaged) {
            setErrorMessage(
              typeof loginResponse?.message === "string" && loginResponse.message.length > 0
                ? loginResponse.message
                : "Unable to log in with those credentials.",
            );
            return;
          }

          if (decision.action === "redirect" && typeof decision.destination === "string") {
            router.replace(decision.destination);
            return;
          }
        } finally {
          setIsLoading(false);
        }
      }
    covers:
      - "transition:login_submit"
      - "transition:login_success"
      - "transition:login_failure"
      - "output:redirect_to_companies"
      - "output:login_error_message"
    line_range:
