prior_context: |
  Main agent exploration notes:
  - Complete auth system with login/signup/logout endpoints
  - JWT access token stored in memory (not localStorage) for XSS protection
  - Refresh token stored in HTTP-only cookie (backend-managed)
  - Cross-tab session sync via BroadcastChannel with localStorage fallback
  - Token refresh uses cross-tab lock mechanism to prevent multiple simultaneous refreshes
  - Middleware handles auth guard for protected routes (/companies, /reports)
  - AuthGuard component wraps protected pages and shows loading state
  - CSRF protection via x-csrf-token header on state-changing requests
