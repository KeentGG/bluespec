needs_deeper_exploration:
  - behavior_id: auth_token_refresh
    reason: >
      The cross-tab lock/leader/follower state machine is the most complex
      coordination mechanism in the auth system. The description mentions a
      localStorage-based lock, 10s auto-expiry, promise deduplication, and
      crossTab.waitForResult — but the exact state transitions, error handling
      during lock acquisition, and the boundary between intra-tab dedup and
      cross-tab coordination need source-level verification. The lock's failure
      modes (what if leader tab closes during refresh? what if broadcast is
      lost?) are unspecified.
  - behavior_id: auth_csrf_protection
    reason: >
      The description states "If the token is missing, it proactively triggers a
      refresh to obtain one" with "max 1 retry." The interaction between this
      retry and the apiClient's own 401-refresh-retry needs verification. There
      is a risk of double-refresh or infinite loop if the CSRF retry and the 401
      retry are not coordinated. Need to confirm the retry tracking mechanism
      and its interaction with auth_api_client_integration.
  - behavior_id: stateful_ui_reports_stores
    reason: >
      Reports uses three separate Zustand stores (list, create wizard, action)
      plus dedicated hooks for each action (email, rename, delete, download) and
      dedicated modal hooks. The orchestration via useReportsPageController and
      the interaction between stores (e.g., does create wizard write to the list
      store? does delete action update list store optimistically?) needs deeper
      verification. The stale-response-guard interaction with these stores is
      also unclear.
  - behavior_id: infra_qfm_response_normalization
    reason: >
      The rollbackGate determines v1/v2 routing, and the responseAdapter
      normalizes responses. Their interaction — does the rollback gate affect
      which adapter is used? Does failureTaxonomy classification trigger the
      rollback gate? — needs source-level verification. The pdfLifecycle state
      machine bundled in this module is also a separate concern that may warrant
      its own behavior spec.
  - behavior_id: auth_route_guard_middleware
    reason: >
      The middleware performs a "silent token refresh" using the HTTP-only
      refresh cookie and then "sets response cookies (user, csrf, refreshToken)"
      on success. The exact cookie names, expiration policies, and the
      interaction between the middleware's refresh and the client-side
      tokenRefresher's refresh need verification. If both can refresh, there is
      a potential race condition on initial page load.
