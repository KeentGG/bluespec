predicate_inventory:
  - behavior_id: auth_route_guard_middleware
    predicates:
      - QFM rollback gate active (v1/v2 routing decision)
      - Session cookie present in request
      - Route is protected (/companies, /reports)
      - Silent token refresh succeeds (HTTP-only refresh cookie)
    render_mode: hidden
  - behavior_id: auth_client_route_guard
    predicates:
      - In-memory token exists on page mount
      - Token refresh attempt succeeds
    render_mode: visible-disabled
  - behavior_id: auth_token_refresh
    predicates:
      - HTTP 401 response detected
      - localStorage lock acquired (leader tab)
      - Lock NOT acquired (follower tab — waits via crossTab)
      - POST /auth/refresh API call succeeds
      - POST /auth/refresh API call fails
      - Lock auto-expires after 10s timeout (deadlock prevention)
      - Intra-tab promise deduplication active (one refresh per tab)
    render_mode: hidden
  - behavior_id: auth_cross_tab_sync
    predicates:
      - BroadcastChannel API available (fallback to localStorage for Safari)
      - Logout broadcast received
      - Login broadcast received
      - Receiving tab is on a protected route (redirect to /login)
      - Receiving tab is on /login (redirect to /companies on login broadcast)
      - Debounce window (1s) has elapsed since last broadcast
    render_mode: hidden
  - behavior_id: auth_error_handling
    predicates:
      - Response status is 401 or 403
      - Error message matches auth-related patterns
      - Module-level concurrent handling flag is NOT set
      - "apiClient 401 path: refresh attempted first, handler is fallback"
    render_mode: hidden
  - behavior_id: auth_csrf_protection
    predicates:
      - Request method is POST, PATCH, or DELETE
      - csrfToken cookie exists in document.cookie
      - csrfToken cookie missing → proactive refresh triggered
      - Retry count < 1 (max 1 retry, prevents infinite loop)
    render_mode: hidden
  - behavior_id: auth_api_client_integration
    predicates:
      - Request method requires Bearer token (all requests)
      - Request method requires CSRF header (POST/PATCH/DELETE)
      - Response returns 401 → refresh-and-retry flow
      - CSRF failure detected → refresh-and-retry flow
      - Refresh fails → handleAuthError fallback
      - Response passes through QFM responseAdapter normalization
    render_mode: hidden
  - behavior_id: auth_token_validation
    predicates:
      - JWT payload is valid base64url
      - Token structure passes validateToken check
      - isTokenExpired intentionally returns false (defers to backend 401)
    render_mode: hidden
  - behavior_id: stateful_ui_dashboard_shell
    predicates:
      - User email extracted from in-memory token (useEffect + getToken)
      - Sidebar isOpen state is true/false (toggled by hamburger)
      - Logout action triggered (API call → clear session → toast → redirect)
    render_mode: visible-enabled
  - behavior_id: stateful_ui_sidebar
    predicates:
      - isOpen prop is true (sidebar visible)
      - isOpen prop is false (sidebar hidden)
      - activeItemId matches current route (highlighted nav item)
    render_mode: visible-enabled
  - behavior_id: stateful_ui_company_modals
    predicates:
      - "Create modal: user clicks create button → isOpenCreate=true"
      - "Edit modal: user clicks edit on row → isOpenEdit=true, selectedCompany
        set"
      - "Delete modal: user clicks delete on row → isOpenDelete=true,
        selectedCompany set"
      - Form validation passes/fails (useCompanyForm)
    render_mode: visible-enabled
  - behavior_id: stateful_ui_reports_stores
    predicates:
      - List filters applied (useReportsListStore)
      - Pagination state changes
      - Create wizard step advances (useCreateReportStore)
      - Row-level action state active (useReportActionStore)
      - Modal visibility flags for Create/Delete/Email
    render_mode: visible-enabled
  - behavior_id: stateful_ui_gate_routing
    predicates:
      - Session state determines initial redirect (useRootRedirect)
      - New entry form validation (useGateNewEntryState)
      - Edit entry form validation (useGateEditEntryState)
      - Route entry status displayed (GateStatusView)
    render_mode: visible-enabled
  - behavior_id: stateful_ui_pdf_overlay
    predicates:
      - PDF generation in progress → overlay visible
      - Download state changes (useDownloadStore Zustand)
    render_mode: visible-enabled
  - behavior_id: infra_qfm_response_normalization
    predicates:
      - Response needs normalization through responseAdapter
      - Error classified by failureTaxonomy (auth/session, network, validation,
        etc.)
      - "Rollback gate: v2 active or redirect to v1"
    render_mode: hidden
  - behavior_id: infra_stale_response_guards
    predicates:
      - API response timestamp is older than current in-flight request
      - Response should be ignored (stale — prevents out-of-order corruption)
    render_mode: hidden
behaviors_to_spec:
  - auth_login_signup
  - auth_session_memory_store
  - auth_token_refresh
  - auth_cross_tab_sync
  - auth_route_guard_middleware
  - auth_client_route_guard
  - auth_error_handling
  - auth_csrf_protection
