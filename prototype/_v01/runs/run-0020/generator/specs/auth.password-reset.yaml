# yaml-language-server: $schema=../../../../schemas/spec.schema.yaml
id: auth.password-reset
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: auth_password_reset
    coverage: full
    notes: >
      Password reset flow submits email to /auth/request-link endpoint.
      Form validates input, shows loading state, and displays success/error
      messages. Success message is generic to prevent email enumeration.

description: >
  Handles password reset requests by submitting an email address to the
  backend endpoint. The form validates input fields, prevents duplicate
  submissions during loading, and displays generic success messages to
  prevent email enumeration attacks.

state_machine:
  initial: idle
  states:
    - id: idle
      description: Password reset form is ready for input.
    - id: submitting
      description: Reset request is in flight.
    - id: success
      description: Reset email sent successfully (generic message shown).
    - id: error
      description: Reset request failed, error message displayed.
  transitions:
    - id: submit_reset
      from: idle
      to: submitting
      trigger: User clicks reset password button.
      guards:
        - field: is_email_valid
          condition: Email field contains a valid email format.
        - field: is_not_submitting
          condition: isLoading is false.
      effects:
        - Clear any previous error/success message.
        - Set isLoading to true.
        - Send POST /auth/request-link with email.
    - id: reset_success
      from: submitting
      to: success
      trigger: Reset request completes successfully.
      effects:
        - Display generic success message.
        - Prevent email enumeration.
    - id: reset_failure
      from: submitting
      to: error
      trigger: Reset request fails.
      effects:
        - Display error message from response.
        - Set isLoading to false.

conditions:
  - id: email_validation
    description: >
      Email field must contain a valid email format. Empty or malformed
      emails prevent form submission.
    trigger: User submits reset form.
    guards:
      - field: email
        condition: email.trim() is non-empty and matches email pattern.
    then:
      - Allow form submission.
    else:
      - Prevent submission, show validation error.

  - id: submission_guard
    description: >
      Prevents duplicate form submissions while a reset request is in flight.
    trigger: User clicks reset button.
    guards:
      - field: isLoading
        condition: isLoading is false.
    then:
      - Proceed with reset request.
    else:
      - Return immediately.

inputs:
  - id: email
    type: string
    source: Password reset form email input
    required: true
    validation:
      format: trimmed string matching email pattern

outputs:
  - id: reset_request
    type: POST /auth/request-link HTTP request
    destination: Backend endpoint
    lifespan: per submission

  - id: success_message
    type: UI success string
    destination: Reset form success display
    lifespan: until page refresh

  - id: error_message
    type: UI error string
    destination: Reset form error display
    lifespan: until next submission

evidence_refs:
  - path: src/features/auth/components/ResetPasswordPageContent.tsx
    snippet: |
      async function handleSubmit(event) {
        event.preventDefault();
        if (isLoading) return;
        setErrorMessage("");
        setSuccessMessage("");
        setIsLoading(true);
        const trimmedEmail = email.trim();
        try {
          const response = await requestPasswordReset({ email: trimmedEmail }, { client: apiClient });
          if (response.ok || response.statusCode === 200) {
            setSuccessMessage("If an account exists, a password reset link has been sent to your email.");
          } else {
            setErrorMessage(response.message || "Failed to request a password reset. Please try again.");
          }
        } finally {
          setIsLoading(false);
        }
      }
    covers:
      - "transition:submit_reset"
      - "transition:reset_success"
      - "transition:reset_failure"
      - "condition:email_validation"
      - "condition:submission_guard"

  - path: src/features/auth/api/auth-service.js
    snippet: |
      export async function requestPasswordReset({ email }, options = {}) {
        const client = getClient(options);
        return client.post({
          path: "/auth/request-link",
          body: { email },
          skipTokenRefresh: true,
          skipAuthErrorHandling: true,
        });
      }
    covers:
      - "output:reset_request"

confidence: 0.94
confidence_rationale: >
  Password reset form, submission handling, and success/error messaging are
  directly evidenced in ResetPasswordPageContent.tsx. The backend endpoint
  and request structure are confirmed in auth-service.js.
unresolved_questions:
  - Whether rate limiting is applied to reset requests (backend-dependent).
  - Token expiry for reset links (backend-dependent).
status: complete
