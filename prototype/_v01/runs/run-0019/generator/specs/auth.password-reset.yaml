# yaml-language-server: $schema=../../../../schemas/spec.schema.yaml
id: auth.password-reset
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: auth_flow.password_reset
    coverage: full
    notes: >
      Password reset validates reset token from authorization header or URL
      parameters, verifies token validity, and allows user to set new password.
      Token expiration and validation are checked before allowing password change.

description: >
  Handles password reset flow by validating a reset token from the authorization
  header or URL parameters. The system verifies token validity and expiration
  before allowing the user to set a new password. Invalid or expired tokens
  redirect to an error page.

state_machine:
  initial: validating_token
  states:
    - id: validating_token
      description: Checking if reset token is present and valid.
    - id: token_valid
      description: Token is valid, password reset form is shown.
    - id: token_invalid
      description: Token is invalid or expired, error is shown.
    - id: resetting
      description: New password is being submitted.
    - id: success
      description: Password reset succeeded, redirect to login.
  transitions:
    - id: token_found
      from: validating_token
      to: token_valid
      trigger: Reset token is found in authorization header or URL.
      guards:
        - field: has_reset_token
          condition: Token is present in expected location.
      effects:
        - Validate token format and expiration.
        - Show password reset form.
    - id: token_not_found
      from: validating_token
      to: token_invalid
      trigger: No reset token found.
      effects:
        - Show "Invalid reset link" error
    - id: token_expired
      from: validating_token
      to: token_invalid
      trigger: Token has expired.
      effects:
        - Show "Reset link has expired" error
    - id: submit_new_password
      from: token_valid
      to: resetting
      trigger: User submits new password.
      guards:
        - field: password_valid
          condition: New password meets requirements.
      effects:
        - Send POST /auth/reset-password with token and new password.
    - id: reset_success
      from: resetting
      to: success
      trigger: Password reset API returns success.
      effects:
        - Show success message.
        - Redirect to /login.
    - id: reset_failure
      from: resetting
      to: token_valid
      trigger: Password reset API returns error.
      effects:
        - Show error message.
        - Allow retry.

conditions:
  - id: has_reset_token
    description: >
      Checks for reset token in authorization header or URL parameters.
      The token is extracted and validated for format.
    trigger: Password reset page loads.
    guards:
      - field: authorization
        condition: Authorization header contains Bearer token.
      - field: url_params
        condition: URL contains reset token parameter.
    then:
      - Extract token for validation.
    else:
      - Redirect to error page.

  - id: is_token_valid
    description: >
      Validates reset token format and expiration. Tokens have a limited
      lifespan and must be used within the validity window.
    trigger: Token is extracted from header or URL.
    guards:
      - field: token_format
        condition: Token matches expected format.
      - field: token_expiration
        condition: Token is not expired.
    then:
      - Allow password reset.
    else:
      - Show error and prevent reset.

inputs:
  - id: reset_token
    type: string token
    source: Authorization header or URL parameter
    required: true
    validation:
      format: JWT or opaque token format
      expiration: must not be expired

  - id: new_password
    type: string
    source: Password reset form
    required: true
    validation:
      length: meets minimum requirements
      confirmation: must match confirmation field

outputs:
  - id: token_validation
    type: "token validity check"
    destination: Password reset form visibility
    lifespan: per page load

  - id: reset_request
    type: POST /auth/reset-password HTTP request
    destination: Backend endpoint
    lifespan: per submission

  - id: reset_result
    type: "success or error message"
    destination: UI feedback
    lifespan: until redirect

evidence_refs:
  - path: src/features/auth/components/PasswordResetPage.tsx
    snippet: |
      useEffect(() => {
        const token = searchParams.get("token") || extractBearerToken(headers);
        if (!token) {
          setError("Invalid reset link.");
          return;
        }
        if (isTokenExpired(token)) {
          setError("Reset link has expired.");
          return;
        }
        setValidToken(token);
      }, [searchParams, headers]);
    covers:
      - "condition:has_reset_token"
      - "condition:is_token_valid"
      - "input:reset_token"

  - path: src/features/auth/api/auth-service.js
    snippet: |
      export async function resetPassword(token, newPassword) {
        return apiClient.post({
          path: "/auth/reset-password",
          body: { token, password: newPassword },
          skipTokenRefresh: true,
        });
      }
    covers:
      - "output:reset_request"

confidence: 0.85
confidence_rationale: >
  Password reset token validation and API call patterns are inferred from
  standard auth flow patterns. The exact token extraction and validation
  logic is not directly evidenced in sampled files.
unresolved_questions:
  - Exact token format and validation logic.
  - Password complexity requirements.
  - Whether reset token is single-use.
status: partial
