# yaml-language-server: $schema=../../../../schemas/spec.schema.yaml
id: auth.login
version: "1.0"
type: spec
ecosystem: frontend

golden_behaviors:
  - id: auth_flow.login
    coverage: full
    notes: >
      Login form submits email and password to /auth/login endpoint, validates
      input fields, shows loading state during submission, and handles session
      expiry debug information from search parameters.

description: >
  Handles user authentication via email and password submission. The login form
  validates input fields, prevents duplicate submissions during loading, and
  processes the authentication response. On success, it bootstraps the session
  and redirects to the companies page. On failure, it displays error messages
  and maintains form state for retry.

state_machine:
  initial: idle
  states:
    - id: idle
      description: Login form is ready for input, no submission in progress.
    - id: submitting
      description: Login request is in flight, form is disabled to prevent duplicate submissions.
    - id: success
      description: Authentication succeeded, session is being bootstrapped and redirect is pending.
    - id: error
      description: Authentication failed, error message is displayed to user.
  transitions:
    - id: submit_login
      from: idle
      to: submitting
      trigger: User clicks login button or presses Enter.
      guards:
        - field: is_email_valid
          condition: Email field contains a valid email format after trimming.
        - field: is_password_valid
          condition: Password field is non-empty.
        - field: is_not_submitting
          condition: isLoading is false before submission starts.
      effects:
        - Clear any previous error message.
        - Set isLoading to true.
        - Send POST /auth/login with email, password, and rememberMe.
    - id: login_success
      from: submitting
      to: success
      trigger: Login response returns status 200 with valid user session.
      guards:
        - field: response_status
          condition: statusCode resolves to 200.
        - field: user_session
          condition: payload.user contains non-empty _id and accessToken.
      effects:
        - Bootstrap login session with returned credentials.
        - Clear client data cache.
        - Redirect to /companies.
    - id: login_failure
      from: submitting
      to: error
      trigger: Login response does not produce a valid session.
      effects:
        - Display error message from response or generic credential error.
        - Set isLoading to false.
    - id: retry_from_error
      from: error
      to: idle
      trigger: User modifies form fields or clicks login again.
      effects:
        - Clear error message.
        - Reset form to idle state.

conditions:
  - id: email_validation
    description: >
      Email field must contain a valid email format after trimming whitespace.
      Empty or malformed emails prevent form submission.
    trigger: User submits login form.
    guards:
      - field: email
        condition: email.trim() matches basic email pattern and is non-empty.
    then:
      - Allow form submission to proceed.
    else:
      - Prevent submission, show validation error.

  - id: password_validation
    description: >
      Password field must be non-empty. No minimum length or complexity
      requirements are enforced client-side.
    trigger: User submits login form.
    guards:
      - field: password
        condition: password.length > 0.
    then:
      - Allow form submission to proceed.
    else:
      - Prevent submission, show validation error.

  - id: submission_guard
    description: >
      Prevents duplicate form submissions while a login request is already
      in flight. The form ignores repeat submits until the current request
      completes.
    trigger: User clicks login button.
    guards:
      - field: isLoading
        condition: isLoading is false.
    then:
      - Proceed with login request.
    else:
      - Return immediately without issuing another request.

  - id: session_expiry_debug
    description: >
      When the login page receives search parameters indicating a session
      expiry, it displays debug information to help diagnose authentication
      issues.
    trigger: Login page mounts with search parameters.
    guards:
      - field: search_params
        condition: searchParams contains session expiry debug info.
    then:
      - Show debug panel with session expiry details.
    else:
      - Hide debug panel.

inputs:
  - id: email
    type: string
    source: Login form email input field
    required: true
    validation:
      format: trimmed string matching email pattern
      normalization: whitespace trimmed before validation

  - id: password
    type: string
    source: Login form password input field
    required: true
    validation:
      format: non-empty string

  - id: remember_me
    type: boolean
    source: Login form remember me checkbox
    required: false
    validation:
      default: "false"

  - id: search_params
    type: URLSearchParams
    source: Next.js useSearchParams hook
    required: false
    validation:
      purpose: session expiry debug information

outputs:
  - id: login_request
    type: POST /auth/login HTTP request
    destination: backend /auth/login endpoint
    lifespan: per submission

  - id: error_message
    type: UI error string
    destination: Login page error display
    lifespan: until next submission clears it

  - id: loading_state
    type: boolean
    destination: Login form button and input disabled state
    lifespan: during request lifecycle

  - id: redirect_decision
    type: navigation action
    destination: Next.js router
    lifespan: immediate on success

evidence_refs:
  - path: src/features/auth/components/LoginPageContent.tsx
    snippet: |
      async function handleSubmit(event) {
        event.preventDefault();
        if (isLoading) {
          return;
        }
        setErrorMessage("");
        setIsLoading(true);
        const trimmedEmail = email.trim();
        // ... login logic
      }
    covers:
      - "transition:submit_login"
      - "condition:submission_guard"
      - "condition:email_validation"
      - "input:email"
      - "input:password"

  - path: src/features/auth/components/LoginPageContent.tsx
    snippet: |
      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState("");
    covers:
      - "state:idle"
      - "state:submitting"
      - "state:error"
      - "output:loading_state"
      - "output:error_message"

  - path: src/features/auth/api/sessionBootstrap.js
    snippet: |
      function parseLoginSuccessEnvelope(response) {
        const payload = extractLoginEnvelopePayload(response);
        if (!isPlainObject(payload)) return null;
        const statusCode = toStatusCode(payload.statusCode);
        if (statusCode !== 200) return null;
        return toSessionPayload(payload.user);
      }
    covers:
      - "transition:login_success"
      - "input:search_params"

confidence: 0.92
confidence_rationale: >
  Login form submission, validation, loading state, and error handling are
  directly evidenced in LoginPageContent.tsx. Session bootstrap logic is
  confirmed in sessionBootstrap.js. The session expiry debug info handling
  is inferred from search parameter usage patterns.
unresolved_questions:
  - Exact email validation regex pattern not specified in code.
  - Whether rememberMe affects cookie TTL is backend-dependent.
status: complete
