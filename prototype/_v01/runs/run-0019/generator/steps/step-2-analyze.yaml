needs_deeper_exploration:
  - behavior_id: auth_flow.error_handling
    reason: Integration with apiClient interceptor chain unclear. Need to verify
      exact interceptor registration order, whether multiple interceptors can
      conflict, and how QFM taxonomy buckets are defined.
  - behavior_id: auth_flow.cross_tab_sync
    reason: BroadcastChannel + localStorage fallback complexity. Need to verify
      Safari detection method, debounce implementation details, and
      AuthSyncBootstrap component mounting strategy.
  - behavior_id: auth_flow.middleware_silent_refresh
    reason: Two-attempt CSRF strategy needs verification. Unclear how apiClient
      behaves in Edge runtime (no Node.js APIs), and whether the 3s timeout is
      enforced at fetch level or middleware level.
  - behavior_id: auth_flow.csrf_protection
    reason: Proactive refresh retry logic may have edge cases. Need to verify how
      csrfHelper distinguishes between 'no token' and 'invalid token', and
      whether the retry limit interacts with token refresh lock.
  - behavior_id: stateful_ui.gate_entry_state_machines
    reason: Phase-based state machine complexity. Need to verify oneShotGuard
      implementation, rollback gate contract resolution, and how
      gate-edit-contract vs gate-new-contract differ.
  - behavior_id: stateful_ui.reports_page_controller
    reason: Append-mode pagination with accumulatedReportsRef. Need to verify how
      userPage interacts with SWR pagination, and whether the ref correctly
      accumulates across page changes.
  - behavior_id: stateful_ui.swr_query_layer
    reason: "clearClientDataCache() uses SWR mutate with undefined key. Need to
      verify this actually clears all cache entries, and whether revalidate:
      false prevents re-fetching."
  - behavior_id: stateful_ui.business_selection_persistence
    reason: sanitizeDashboardPersistedKey abstraction. Need to verify what mutations
      it prevents and how rollback route checks interact with selection
      persistence.
