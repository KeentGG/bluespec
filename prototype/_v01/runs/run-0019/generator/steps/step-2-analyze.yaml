predicate_inventory:
  - behavior_id: auth_flow.route_protection
    predicates:
      - isProtectedRoute(path)
      - hasInMemoryToken()
      - canRefresh()
      - isAuthenticated()
    render_mode: hidden
  - behavior_id: auth_flow.error_handling
    predicates:
      - isAuthError(statusCode, qfmBucket, keywords)
      - isAlreadyHandling()
      - hasAuthLocalStorageKeys()
    render_mode: hidden
  - behavior_id: auth_flow.cross_tab_sync
    predicates:
      - isBroadcastChannelAvailable()
      - isSafari()
      - isInDebounceWindow(timestamp, 1000)
    render_mode: hidden
  - behavior_id: auth_flow.csrf_protection
    predicates:
      - isCsrfTokenAvailable()
      - isStateChangingRequest(method)
      - isRetryLimitReached(retryCount, 1)
    render_mode: hidden
  - behavior_id: auth_flow.middleware_silent_refresh
    predicates:
      - isProtectedRoute(path)
      - hasRefreshToken()
      - isCsrfTokenAvailable()
      - isFirstAttempt()
    render_mode: hidden
  - behavior_id: auth_flow.toa_guard
    predicates:
      - hasAgreedToa(userId)
      - calculatorType()
    render_mode: hidden
  - behavior_id: stateful_ui.gate_entry_state_machines
    predicates:
      - phase == 'pending_router'
      - phase == 'initializing'
      - phase == 'ready'
      - phase == 'fallback'
      - phase == 'error'
      - isOneShotGuardPassed()
      - hasRollbackGate()
      - isValidReferrer(origin)
    render_mode: hidden
  - behavior_id: stateful_ui.reports_list_filter_state
    predicates:
      - searchQuery.length > 0
      - sortId != 'updatedAt:desc'
      - calcTypeFilter != 'all'
    render_mode: visible-enabled
  - behavior_id: stateful_ui.company_page_state
    predicates:
      - searchQuery.length > 0
      - sortBy / sortOrder
      - logoLoadFailuresByBusinessId
    render_mode: visible-enabled
  - behavior_id: stateful_ui.pdf_download_state
    predicates:
      - dlStatus == 'waiting'
      - dlStatus == 'finished'
      - dlStatus == 'failed'
      - dlStatus == 'completed'
      - isGenerating()
    render_mode: visible-enabled
  - behavior_id: stateful_ui.auth_redirect_state
    predicates:
      - isChecking()
      - isAuthenticated()
      - attemptTokenRefresh()
      - minLoadingDelay()
    render_mode: hidden
  - behavior_id: auth_flow.login
    predicates:
      - isEmailValid(email)
      - isPasswordValid(pass)
      - isSubmitting()
      - hasSessionExpiredDebugInfo(searchParams)
    render_mode: visible-enabled
  - behavior_id: auth_flow.signup
    predicates:
      - isEmailValid(email)
      - isPasswordValid(pass)
      - isSubmitting()
    render_mode: visible-enabled
  - behavior_id: auth_flow.logout
    predicates:
      - isExecuting()
      - apiFailed()
    render_mode: visible-enabled
  - behavior_id: auth_flow.token_refresh
    predicates:
      - hasRefreshToken()
      - isLockAcquired(localStorage)
      - lockExpired(10000)
      - isPromiseLockActive()
    render_mode: hidden
  - behavior_id: auth_flow.password_reset
    predicates:
      - hasResetToken(authorization)
      - isTokenValid(token)
    render_mode: visible-enabled
  - behavior_id: stateful_ui.report_action_loading_state
    predicates:
      - isDownloading(reportId)
      - isRenaming(reportId)
      - isDeleting(reportId)
      - isEmailing(reportId)
      - anyActionInProgress(reportId)
    render_mode: visible-disabled
  - behavior_id: stateful_ui.report_row_controller
    predicates:
      - editingReportId == reportId
      - hasEditTimeElapsed(500)
      - hasFocused()
    render_mode: visible-enabled
  - behavior_id: stateful_ui.report_modals
    predicates:
      - useReportEmailModal.isOpen
      - useReportDeleteDialog.isOpen
      - useCreateReportModal.isOpen
    render_mode: visible-enabled
  - behavior_id: stateful_ui.create_report_modal_state
    predicates:
      - isOpen()
      - defaultBusinessId
    render_mode: visible-enabled
  - behavior_id: stateful_ui.company_modals
    predicates:
      - addEdit.isOpen
      - delete.isOpen
      - createReport.isOpen
    render_mode: visible-enabled
  - behavior_id: stateful_ui.company_form_state
    predicates:
      - isSubmitting()
      - hasLogoChanges()
      - isDragging()
      - logoError
    render_mode: visible-enabled
  - behavior_id: stateful_ui.dashboard_shell_state
    predicates:
      - isSidebarOpen()
      - userEmail
    render_mode: visible-enabled
  - behavior_id: stateful_ui.user_data_query
    predicates:
      - hasUserId()
      - isLoading()
      - isError()
    render_mode: hidden
  - behavior_id: stateful_ui.business_selection_persistence
    predicates:
      - hasHashSelection()
      - hasPersistedSelection()
    render_mode: hidden
  - behavior_id: stateful_ui.swr_query_layer
    predicates:
      - hasToken()
      - isLoading()
      - isError()
      - isValidating()
    render_mode: hidden
  - behavior_id: auth_flow.session_persistence
    predicates:
      - hasToken()
      - hasCookie()
    render_mode: hidden
