summary: >
  Drafted 28 behavioral specifications for auth_flow (12) and stateful_ui (16)
  behaviors. Auth specs cover login, signup, session persistence, token refresh,
  route protection, error handling, cross-tab sync, CSRF protection, logout,
  password reset, middleware silent refresh, and TOA guard. Stateful UI specs
  cover reports list filter state, report action loading, create report modal,
  PDF download state machine, company page state, company modals, company form,
  reports page controller, report row controller, report modals, dashboard
  shell, auth redirect, user data query, business selection persistence, gate
  entry state machines, and SWR query layer. Each spec includes state machines
  where applicable, conditions, inputs/outputs, evidence references from the
  dashboard-v2 codebase, and confidence scores. Specs follow the schema at
  schemas/spec.schema.yaml and are written to runs/run-0019/generator/specs/.
