  - runs/run-0014/inputs/rubric.yaml
  - prompts/shared/failure-types.md

confidence: 0.90
confidence_rationale: >
  All source files were available and readable. The decision tree was applied
  exhaustively to each recall miss. All three misses passed steps 1-4 (not
  search, recognition, format, or prompt failure) and clearly map to rubric
  gap candidates in the evaluator's shadow findings. Minor uncertainty about
