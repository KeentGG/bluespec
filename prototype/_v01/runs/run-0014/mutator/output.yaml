  risk: >
    Adding four new criteria increases rubric complexity and scoring subjectivity.
    Risk of over-crediting specs that genuinely miss behaviors by attributing them
    to "accurate negative findings". Weight reduction on golden_set_recall may
    under-penalize genuine omissions if the new criteria are not applied rigorously.
  rationale: >
    All three recall misses are cases where the spec accurately documents actual
    code behavior, but the rubric penalizes it for not matching imprecise, stale,
    or non-existent golden behavior. The generator correctly followed formula
    instructions (analyze step explicitly preserves hidden-vs-disabled differences
