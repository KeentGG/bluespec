rubric_candidate:
  id: rubric-v003-enriched
  parent_version: v002
  active_criteria:
    - coverage_core_behavior
    - completeness_inputs_outputs
    - consistency_cross_refs
    - golden_set_recall
    - conditional_flow_documentation
    - ui_gate_pattern_precision
    - negative_condition_documentation
    - evidence_ref_existence
    - backend_enforcement_documentation
  weights:
    coverage_core_behavior: 1
    completeness_inputs_outputs: 1
    consistency_cross_refs: 0.8
    golden_set_recall: 1.0
    conditional_flow_documentation: 0.81
    ui_gate_pattern_precision: 0.9
    negative_condition_documentation: 0.9
    evidence_ref_existence: 0.8
    backend_enforcement_documentation: 0.7
  new_criteria_descriptions:
    ui_gate_pattern_precision: >
      Distinguish between "visibility" (render/unmount) and "interactivity"
      (disabled/enabled) as separate UI gate patterns. Credit specs that correctly
      identify the actual gate pattern in code rather than penalizing them for
      not matching imprecise golden behavior wording.
    negative_condition_documentation: >
      Credit specs for explicitly documenting the absence of a claimed condition
      when the condition does not exist in the evidenced code, rather than
      penalizing honest negative findings as recall misses.
    evidence_ref_existence: >
      Verify golden-set evidence_refs exist in the codebase before scoring recall
      against them. Discount or flag recall penalties when golden-set refs are stale
      or missing.
    backend_enforcement_documentation: >
      When a frontend gate is purely cosmetic (e.g., disabled button), require
      documentation of whether server-side enforcement exists. Credit specs that
      explicitly note the absence or presence of backend validation.

