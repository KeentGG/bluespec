$schema: "https://json-schema.org/draft/2020-12/schema"
title: RubricSnapshot
type: object
required:
  - rubric_version
  - active_criteria
  - weights
properties:
  rubric_version:
    type: string
  parent_version:
    type:
      - string
      - "null"
  seed_sources:
    type: array
    items:
      type: string
  active_criteria:
    type: array
    items:
      type: string
  weights:
    type: object
    additionalProperties:
      type: number
  effective_from_run:
    type: string
  official_channel_only:
    type: boolean
