predicate_inventory:
  - behavior_id: auth_guard_protection
    predicates:
      - token._id && token.accessToken (hasValidToken)
      - attemptTokenRefresh option
      - isChecking state
    render_mode: visible-enabled
  - behavior_id: auth_token_refresh
    predicates:
      - isRefreshing || refreshPromise (already refreshing in this tab)
      - hasLock (acquired cross-tab lock via localStorage)
      - result.success (refresh succeeded)
    render_mode: hidden
  - behavior_id: auth_login_flow
    predicates:
      - isLoading (prevents double submission)
      - decision.sessionStaged (determines if session was established)
      - decision.action === "redirect" (determines if redirect happens)
    render_mode: visible-enabled
  - behavior_id: auth_signup_flow
    predicates:
      - isLoading (prevents double submission)
      - decision.sessionStaged (determines if session was established)
      - decision.action === "redirect" (determines if redirect happens)
    render_mode: visible-enabled
  - behavior_id: auth_password_reset
    predicates:
      - isLoading (prevents double submission)
      - response.ok || response.statusCode === 200 (determines success/error message)
    render_mode: visible-enabled
  - behavior_id: auth_error_handling
    predicates:
      - isAuthErrorHandling (prevents concurrent handling)
      - isAuthError(response) (checks if response is auth error: 401/403 or taxonomy bucket)
      - skipRedirect option (controls whether redirect happens)
    render_mode: hidden
  - behavior_id: auth_csrf_protection
    predicates:
      - hasCsrfToken() (checks if CSRF token exists)
      - isCsrfTokenValid(token) (validates token format)
      - retriedAfterRefresh (prevents infinite retry loops)
      - MAX_CSRF_RETRIES (limits retry attempts)
    render_mode: hidden
  - behavior_id: auth_cross_tab_sync
    predicates:
      - isBroadcastSupported() (checks if BroadcastChannel API is available)
      - REDIRECT_DEBOUNCE_MS (prevents redirect loops)
      - LOGIN_DEBOUNCE_MS (prevents login broadcast loops)
      - isLoginPage check (determines redirect behavior)
      - isProtected check (determines if on protected route)
    render_mode: hidden
  - behavior_id: stateful_pdf_download
    predicates:
      - dlStatus state: "waiting" | "finished" | "failed" | "completed" | ""
      - isGenerating (tracks PDF generation state)
      - response.ok && hasPdfGenerationUserId(response.data) (determines success)
    render_mode: visible-enabled
  - behavior_id: stateful_report_actions
    predicates:
      - anyActionInProgress(reportId) (checks if any action is in progress for a report)
    render_mode: visible-enabled
  - behavior_id: stateful_reports_list
    predicates:
      - searchQuery (empty or non-empty)
      - sortId (default "updatedAt:desc" or other)
      - calcTypeFilter (default "all" or specific type)
    render_mode: visible-enabled
  - behavior_id: infrastructure_routing
    predicates:
      - isRouterReady(router) (checks if Next.js router has resolved initial params)
      - shouldRun(intentKey) (one-shot execution guard)
      - hasRun(intentKey) (checks if intent has already executed)
    render_mode: hidden

