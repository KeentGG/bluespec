needs_deeper_exploration:
  - infrastructure_qfm (Query/Fetch/Mutation framework with failure taxonomy, rollback gates, and response normalization - complex interaction patterns)
  - infrastructure_routing (route guards, base path handling, query validation - needs more context on how guards interact with auth)
  - feature_reports_templates (template system for different calculator types - needs understanding of how templates affect report generation)
  - auth_token_refresh (cross-tab coordination via localStorage lock - edge cases around lock expiry and concurrent refresh attempts)
  - auth_error_handling (global 401/403 handling - needs verification of all error detection paths and redirect logic)
